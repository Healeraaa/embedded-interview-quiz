<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="嵌入式软件与硬件秋招面试题练习工具">
  <title>嵌入式面试题练习</title>
  <style>
    :root { --bg:#f4f6f8; --paper:#fffdfa; --ink:#172033; --muted:#667085; --line:#e3e7ed; --blue:#2563eb; --orange:#e76f51; --green:#16805a; --shadow:0 18px 55px rgba(30,42,70,.11); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 15% 0%,#e7efff 0,transparent 28rem),radial-gradient(circle at 100% 100%,#fff0e8 0,transparent 25rem),var(--bg); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; min-height:100vh; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:34px 0 56px; }
    header { display:flex; gap:22px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
    .eyebrow { color:var(--blue); font-weight:800; letter-spacing:.14em; font-size:12px; }
    h1 { margin:6px 0 5px; font-size:clamp(28px,5vw,46px); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); }
    .progress-box { min-width:220px; text-align:right; }
    .progress-label { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:8px; }
    .progress-track { height:9px; border-radius:99px; background:#dfe4eb; overflow:hidden; }
    .progress-fill { height:100%; width:0; background:linear-gradient(90deg,var(--blue),#65a2ff); transition:width .25s; }
    .layout { display:grid; grid-template-columns:280px minmax(0,1fr); gap:22px; align-items:start; }
    [hidden] { display:none!important; }
    .panel,.card { background:rgba(255,253,250,.94); border:1px solid rgba(255,255,255,.8); border-radius:22px; box-shadow:var(--shadow); }
    .panel { padding:20px; position:sticky; top:18px; }
    .field { margin-bottom:17px; }
    .field label { display:block; font-size:12px; font-weight:800; color:#536077; margin:0 0 7px; }
    select,input[type="search"] { width:100%; border:1px solid var(--line); border-radius:11px; padding:10px 11px; color:var(--ink); background:white; outline:none; }
    select:focus,input:focus { border-color:#8ab0fb; box-shadow:0 0 0 3px #dce8ff; }
    .bank-tabs { display:grid; gap:8px; }
    .bank-tab { text-align:left; border:1px solid var(--line); border-radius:12px; background:#fff; padding:11px 12px; color:#465066; font-weight:700; }
    .bank-tab.active { color:#fff; border-color:transparent; background:var(--accent); }
    .summary { font-size:13px; line-height:1.7; color:var(--muted); border-top:1px solid var(--line); padding-top:14px; margin-top:4px; }
    .card { min-height:580px; padding:clamp(24px,5vw,56px); display:flex; flex-direction:column; }
    #quiz { min-height:470px; display:flex; flex:1; flex-direction:column; }
    .meta { display:flex; align-items:center; flex-wrap:wrap; gap:9px; color:var(--muted); font-size:13px; }
    .tag { padding:5px 9px; border-radius:99px; background:#edf2fa; color:#40516e; font-weight:700; }
    .stars { color:#e9a31b; letter-spacing:.04em; }
    .question { font-size:clamp(24px,3.3vw,38px); line-height:1.35; letter-spacing:-.025em; margin:28px 0; }
    .reveal { align-self:flex-start; border:0; border-radius:13px; padding:13px 20px; background:var(--ink); color:white; font-weight:800; box-shadow:0 7px 18px rgba(23,32,51,.18); }
    .answer { display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--line); font-size:16px; line-height:1.85; animation:fade .2s ease; }
    .answer.open { display:block; }
    .answer p:first-child { margin-top:0; }
    .answer code { font-family:Consolas,monospace; background:#eff2f5; border-radius:5px; padding:.12em .32em; font-size:.92em; }
    .answer pre { overflow:auto; padding:16px; color:#e7edf7; background:#172033; border-radius:12px; line-height:1.55; }
    .answer pre code { background:transparent; padding:0; }
    .answer blockquote { margin:1em 0; padding:10px 16px; border-left:4px solid #9db9ed; background:#f2f6fd; color:#44516a; }
    .answer li { margin:.35em 0; }
    .spacer { flex:1; min-height:28px; }
    .rating { display:none; margin-top:22px; gap:9px; flex-wrap:wrap; }
    .rating.open { display:flex; }
    .rate { border:1px solid var(--line); border-radius:10px; padding:9px 14px; background:white; color:#465066; }
    .rate.selected { color:white; border-color:transparent; }
    .rate[data-value="again"].selected { background:#c2413a; }
    .rate[data-value="fuzzy"].selected { background:#c48413; }
    .rate[data-value="know"].selected { background:var(--green); }
    .nav { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
    .nav button { border:1px solid var(--line); border-radius:11px; padding:10px 15px; background:white; color:var(--ink); font-weight:700; }
    .nav button:hover,.rate:hover { border-color:#aeb9ca; }
    .nav button:disabled { opacity:.4; cursor:not-allowed; }
    .position { margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
    .empty { margin:auto; text-align:center; color:var(--muted); }
    .kbd { border:1px solid #cfd5de; border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:#fff; color:#606b7e; font-size:11px; }
    @keyframes fade { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:none } }
    @media (max-width:780px) { .app{width:min(100% - 20px,680px);padding-top:20px} header{align-items:flex-start;flex-direction:column}.progress-box{width:100%;text-align:left}.layout{grid-template-columns:1fr}.panel{position:static}.bank-tabs{grid-template-columns:1fr 1fr}.card{min-height:520px;padding:24px;border-radius:18px}.question{margin:23px 0}.position{margin-left:0;width:100%;order:-1}.nav{flex-wrap:wrap}.nav button{flex:1}.nav .random{flex-basis:100%} }
    @media print { body{background:white}.panel,header,.nav,.reveal,.rating{display:none!important}.layout{display:block}.card{box-shadow:none;border:0;padding:0}.answer{display:block}.question{font-size:24px} }
  </style>

<body>
  <main class="app">
    <header>
      <div><div class="eyebrow">INTERVIEW DRILL</div><h1>嵌入式面试题练习</h1><p class="subtitle">先在心里作答，再点击查看参考答案。</p></div>
      <div class="progress-box"><div class="progress-label"><span>已掌握进度</span><strong id="progressText">0 / 376</strong></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
    </header>
    <div class="layout">
      <aside class="panel">
        <div class="field"><label>题库</label><div class="bank-tabs" id="bankTabs"></div></div>
        <div class="field"><label for="sectionSelect">章节</label><select id="sectionSelect"></select></div>
        <div class="field"><label for="starSelect">重要程度</label><select id="starSelect"><option value="0">全部星级</option><option value="5">★★★★★ 五星必问</option><option value="4">★★★★ 四星高频</option><option value="3">★★★ 三星常见</option><option value="2">★★ 两星</option><option value="1">★ 一星</option></select></div>
        <div class="field"><label for="statusSelect">掌握状态</label><select id="statusSelect"><option value="all">全部状态</option><option value="unrated">尚未标记</option><option value="again">不会</option><option value="fuzzy">模糊</option><option value="know">会</option></select></div>
        <div class="field"><label for="searchInput">搜索题目和答案</label><input id="searchInput" type="search" placeholder="例如：优先级反转"></div>
        <div class="summary" id="filterSummary"></div>
      </aside>
      <section class="card" id="card" aria-live="polite">
        <div id="quiz">
          <div class="meta"><span class="tag" id="sectionTag"></span><span id="bankName"></span><span class="stars" id="stars"></span></div>
          <h2 class="question" id="question"></h2>
          <button class="reveal" id="revealButton" type="button">查看答案 <span class="kbd">空格</span></button>
          <div class="answer" id="answer"></div>
          <div class="rating" id="rating"><button class="rate" data-value="again">不会</button><button class="rate" data-value="fuzzy">模糊</button><button class="rate" data-value="know">会</button></div>
          <div class="spacer"></div>
          <nav class="nav"><button id="previousButton">← 上一题</button><button id="nextButton">下一题 →</button><button class="random" id="randomButton">随机一题</button><span class="position" id="position"></span></nav>
        </div>
        <div class="empty" id="empty" hidden><h2>没有匹配的题目</h2><p>请调整章节、星级、状态或搜索词。</p></div>
      </section>
    </div>
  </main>
  <script>
    const BANKS = [{"id":"software","name":"嵌入式软件","file":"嵌入式软件工程师秋招完整问答版_FreeRTOS.md","accent":"#2563eb","questions":[{"id":"software-1.","bankId":"software","number":"1.","title":"请做一个一分钟自我介绍。","stars":5,"section":"一、自我介绍与项目","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>面试官您好，我是××大学××专业的应届生，主要学习和实践方向是 MCU 嵌入式软件开发。我比较熟悉 C 语言、STM32 常用外设以及 FreeRTOS，做过××项目。在这个项目中，我主要负责驱动、任务划分和通信模块，实现了××功能。我曾经重点解决过××问题，通过逻辑分析仪/日志/断点定位到××原因，最终把××指标从……优化到……。我希望从事底层驱动、RTOS 和设备通信相关的嵌入式软件工作。</blockquote>\n<p><strong>面试官关注：</strong>是否与岗位匹配；是否真正做过项目；能否用量化结果证明能力。</p>\n<p><strong>易错点：</strong>不要从小学经历开始讲；不要只罗列“会 C、会 STM32”；不要把团队工作全部说成自己完成。</p>"},{"id":"software-2.","bankId":"software","number":"2.","title":"请详细介绍你最有代表性的项目。","stars":5,"section":"一、自我介绍与项目","answerHtml":"<p><strong>参考回答框架：</strong></p>\n<blockquote>项目要解决的是……，核心指标包括……。硬件采用……MCU，连接了……外设，设备之间通过……通信。软件上我分成 BSP、驱动/服务和业务层；FreeRTOS 中划分了……任务，任务之间使用……传递数据。我独立负责的是……。项目中最难的问题是……，现象是……。我先用……确认了……，再通过……排除了……，最终定位为……。修复后经过……小时压力测试，结果……。如果重新设计，我会在……方面进一步改进。</blockquote>\n<p><strong>追问：</strong>为什么选这款 MCU？为什么用 RTOS？任务优先级怎么定？队列多长？谁喂看门狗？怎样证明稳定？</p>"},{"id":"software-3.","bankId":"software","number":"3.","title":"为什么使用 FreeRTOS，而不是裸机？","stars":5,"section":"一、自我介绍与项目","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>项目里有多个并发活动，例如传感器采集、通信接收、数据处理和人机交互，它们的周期和实时性不同。裸机也可以用中断加状态机实现，但功能增多后状态耦合和维护成本会迅速上升。FreeRTOS 可以通过任务、优先级、阻塞等待以及队列、通知等机制，把不同活动隔离开，让高实时任务及时响应，同时避免无意义轮询。代价是增加 RAM、ROM 和任务切换开销，也带来竞态、死锁、优先级反转等问题。因此，如果系统只有一个简单顺序流程，我不会为了“用了 RTOS”而强行使用。</blockquote>\n<p><strong>追问：</strong>不用 RTOS 怎么重构？RTOS 是否一定实时？任务越多越好吗？</p>"},{"id":"software-4.","bankId":"software","number":"4.","title":"你的软件架构是怎样的？","stars":5,"section":"一、自我介绍与项目","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>我通常划分为 BSP/硬件抽象层、设备驱动层、服务或中间件层、业务应用层。底层负责 GPIO、UART、SPI 等硬件访问；设备层把具体芯片封装成统一接口；服务层负责协议、存储和状态管理；业务层只依赖接口，不直接操作寄存器。中断只负责快速取数和通知，复杂处理放到任务中。模块之间优先通过接口、消息或回调通信，减少全局变量和双向依赖。</blockquote>\n<p><strong>追问：</strong>初始化顺序如何管理？多个任务同时访问同一驱动怎么办？怎样替换硬件做单元测试？</p>"},{"id":"software-5.","bankId":"software","number":"5.","title":"讲一个最难的 Bug。","stars":5,"section":"一、自我介绍与项目","answerHtml":"<p><strong>参考回答模板：</strong></p>\n<blockquote>现象是……，它只在……条件下出现。首先我通过日志/示波器把问题稳定复现，并记录发生前的任务状态和通信数据。随后提出了……几个假设，利用……逐项排除，发现……时数据已经异常，因此继续向上游追踪。最终确认根因是……。修复方法是……，而不是简单重启。之后我增加了……保护和诊断，并在……负载下运行……小时，确认问题没有再次出现。</blockquote>\n<p><strong>易错点：</strong>只说“调了很久最后好了”没有价值；必须体现证据链、根因和回归验证。</p>\n<p>---</p>"},{"id":"software-6.","bankId":"software","number":"6.","title":"`static` 有什么作用？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>static</code> 有三种常见作用。修饰函数内局部变量时，它具有静态存储期，程序整个运行期间都存在，只初始化一次，但作用域仍限于函数内部；修饰文件级全局变量或函数时，会把链接属性限制在当前源文件，避免对外暴露符号。静态局部变量通常在 <code>.data</code> 或 <code>.bss</code>，不是普通函数栈变量。</blockquote>\n<p><strong>追问：</strong>静态局部变量线程安全吗？——变量本身长期存在不代表并发访问安全，仍需同步。</p>"},{"id":"software-7.","bankId":"software","number":"7.","title":"`const` 有什么作用？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>const</code> 表示不能通过该标识符修改对象，主要用于接口约束、表达只读意图和帮助编译器检查。<code>const int *p</code> 是指向只读整数的指针，不能通过 <code>p</code> 改内容；<code>int * const p</code> 是指针本身不能改指向。<code>const</code> 对象不一定都在 Flash，具体位置取决于对象类型、作用域、链接方式和链接脚本。</blockquote>\n<p><strong>追问：</strong>能否强转后修改？——如果底层对象本来可写，绕过 const 可能成功但破坏接口约束；如果对象本来就是 const，修改会产生未定义行为。</p>"},{"id":"software-8.","bankId":"software","number":"8.","title":"`volatile` 有什么作用？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>volatile</code> 告诉编译器，该对象可能在当前代码看不到的地方发生变化，因此每次都要按照语言规则实际访问，不能长期缓存或删除必要读写。典型场景是硬件寄存器、被中断和主程序共享的状态标志。它不保证操作原子性，不提供互斥，也不是完整的线程同步或内存屏障，所以 <code>volatile int count; count++</code> 仍可能发生竞态。</blockquote>\n<p><strong>追问：</strong>ISR 与任务共享变量只加 <code>volatile</code> 是否够？——只有单写单读且访问原子、顺序要求简单的标志才可能够；一般优先使用任务通知、队列、原子操作或临界区。</p>"},{"id":"software-9.","bankId":"software","number":"9.","title":"数组和指针有什么区别？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>数组是包含固定数量元素的连续对象，数组名不能像普通指针变量一样改变；指针是保存地址的变量。在大多数表达式中数组名会转换为首元素指针，但作为 <code>sizeof</code> 或一元 <code>&amp;</code> 的操作数时不会退化。数组作为函数参数声明时实际会调整为指针，因此函数内部无法通过 <code>sizeof</code> 参数得到原数组长度，长度应单独传入。</blockquote>\n<p><strong>追问：</strong><code>&amp;a</code> 和 <code>a</code> 数值可能相同，但类型不同；前者是指向整个数组的指针。</p>"},{"id":"software-10.","bankId":"software","number":"10.","title":"指针数组和数组指针有什么区别？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>int *a[10]</code> 中先看 <code>[]</code>，说明 <code>a</code> 是数组，数组里有 10 个 <code>int *</code>；<code>int (*p)[10]</code> 中括号让 <code>*p</code> 先结合，说明 <code>p</code> 是指针，指向一个含 10 个 <code>int</code> 的数组。判断复杂声明时从变量名向外按运算符优先级阅读。</blockquote>"},{"id":"software-11.","bankId":"software","number":"11.","title":"`sizeof` 和 `strlen` 有什么区别？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>sizeof</code> 是运算符，得到对象或类型占用的字节数，大多数情况下在编译期确定，不会扫描内容；<code>strlen</code> 是库函数，从给定地址开始寻找 <code>\\0</code>，返回终止符之前的字符数。<code>char s[] = &quot;abc&quot;</code> 时 <code>sizeof(s)</code> 是 4，<code>strlen(s)</code> 是 3；如果 <code>s</code> 是指针，<code>sizeof(s)</code> 得到指针大小。</blockquote>"},{"id":"software-12.","bankId":"software","number":"12.","title":"结构体为什么要内存对齐？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>处理器对某些类型在自然对齐地址访问更高效，有些架构对非对齐访问甚至会异常，所以编译器会在成员之间插入填充。每个成员从满足自身对齐要求的偏移开始，结构体总大小再补齐为最大成员对齐值的整数倍。调整成员顺序常能减少填充。强制 packed 虽然节省空间，但可能带来低效或非法非对齐访问，解析协议时还存在字节序和别名问题。</blockquote>\n<p><strong>追问：</strong>给出 <code>char/int/short</code> 组合现场计算；联合体大小为最大成员大小并满足最大对齐。</p>"},{"id":"software-13.","bankId":"software","number":"13.","title":"宏和内联函数有什么区别？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>宏在预处理阶段做文本替换，没有类型检查，参数可能被重复求值，也容易受优先级影响；内联函数遵循正常类型、作用域和求值规则，是否真正展开由编译器决定。工程里短小、频繁调用的函数更适合 <code>static inline</code>。如果必须用宏，参数和整体表达式都要加括号，并避免传入有副作用的表达式。</blockquote>"},{"id":"software-14.","bankId":"software","number":"14.","title":"`memcpy` 和 `memmove` 有什么区别？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>两者都按字节复制指定长度；<code>memcpy</code> 要求源和目标区域不重叠，重叠时行为未定义；<code>memmove</code> 支持重叠，通常根据地址关系选择从前向后或从后向前复制。二者都不会自动补字符串终止符，也不能完成含指针对象的深拷贝。</blockquote>"},{"id":"software-15.","bankId":"software","number":"15.","title":"什么是大端和小端？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>对多字节整数，小端把最低有效字节放在最低地址，大端把最高有效字节放在最低地址。网络协议常使用大端字节序。协议编解码时最好显式移位拼接或使用规定的转换函数，不要直接把接收缓冲区强转为结构体，因为还可能受到对齐、填充和严格别名影响。</blockquote>"},{"id":"software-16.","bankId":"software","number":"16.","title":"有符号数和无符号数混合有什么风险？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>按 C 的通常算术转换，负的有符号数可能被转换成很大的无符号数，导致长度和边界判断失效。例如 <code>int i=-1; size_t n=10; i&lt;n</code> 可能为假。无符号溢出按模运算，而有符号溢出属于未定义行为。长度、下标和差值比较时要统一类型并先验证范围。</blockquote>"},{"id":"software-17.","bankId":"software","number":"17.","title":"什么是函数指针？有什么用途？","stars":4,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>函数指针保存具有特定返回值和参数类型的函数地址，可用于回调、中断向量、状态机分发表和驱动接口表。使用时必须保证签名匹配，并明确回调在哪个上下文执行、是否允许阻塞、传入上下文对象的生命周期是否有效。</blockquote>"},{"id":"software-18.","bankId":"software","number":"18.","title":"如何实现一个环形缓冲区？","stars":5,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>环形缓冲区通常有数据数组、读索引和写索引。入队写到写索引后回绕，出队从读索引读取后回绕。空和满必须无歧义：可以牺牲一个槽位，用 <code>write==read</code> 表示空、<code>next(write)==read</code> 表示满；也可以额外保存计数。并发时要先明确是单生产者单消费者还是多生产者，跨 ISR/任务时需保证索引访问和内存顺序安全。还要定义满时丢新数据、覆盖旧数据还是反压。</blockquote>\n<p><strong>追问：</strong>容量是 2 的幂时可用 <code>index &amp; (size-1)</code> 回绕，但必须保证 size 确实为 2 的幂。</p>"},{"id":"software-19.","bankId":"software","number":"19.","title":"常见位操作怎么写？","stars":5,"section":"二、C 语言基础","answerHtml":"<pre><code class=\"language-c\">reg |=  (1u &lt;&lt; n);       /* 置位 */\nreg &amp;= ~(1u &lt;&lt; n);       /* 清零 */\nreg ^=  (1u &lt;&lt; n);       /* 翻转 */\nbit = (reg &gt;&gt; n) &amp; 1u;   /* 读取 */</code></pre>\n<p><strong>参考回答：</strong></p>\n<blockquote>使用无符号常量可减少符号扩展问题；要确认 n 小于类型位宽。操作硬件寄存器时还要确认寄存器是否允许读改写，有些状态位是写 1 清除，不能套用普通读改写。</blockquote>"},{"id":"software-20.","bankId":"software","number":"20.","title":"为什么嵌入式中要谨慎使用递归和浮点？","stars":3,"section":"二、C 语言基础","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>递归深度可能难以界定，栈消耗和最坏执行时间不易分析；资源受限或硬实时场景更适合迭代或显式栈。浮点要确认 MCU 是否有 FPU、ABI 和上下文保存配置；软件浮点和浮点格式化可能增加执行时间、栈和代码体积。不是完全不能使用，而是要测量并满足资源和实时约束。</blockquote>\n<p>---</p>"},{"id":"software-21.","bankId":"software","number":"21.","title":"MCU 程序有哪些常见内存段？","stars":5,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>.text</code> 放代码，<code>.rodata</code> 放只读数据，通常位于 Flash；<code>.data</code> 放有非零初值的全局和静态变量，其初值保存在 Flash，启动时复制到 RAM；<code>.bss</code> 放零初始化或未显式初始化的全局和静态变量，启动时清零；栈用于调用现场和自动变量，堆用于动态分配。具体地址和大小由链接脚本决定。</blockquote>"},{"id":"software-22.","bankId":"software","number":"22.","title":"栈和堆有什么区别？","stars":5,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>栈随函数调用自动分配回收，速度快、生命周期清晰，但容量小，深调用和大局部数组容易溢出；堆由分配器管理，生命周期灵活，但可能分配失败、碎片化且耗时不确定。在 FreeRTOS 中每个任务有独立任务栈，内核对象和动态任务可能从 FreeRTOS heap 分配，两者不能混为一谈。</blockquote>"},{"id":"software-23.","bankId":"software","number":"23.","title":"为什么嵌入式常避免运行期 `malloc/free`？","stars":4,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>长期反复分配释放可能产生碎片，分配耗时和失败时机不确定，错误路径也难覆盖。高可靠系统常在初始化阶段一次分配，或使用静态对象、固定块内存池。若必须动态分配，应检查失败、监控历史最小剩余空间、明确线程安全和所有权，并避免在 ISR 和关键实时路径分配。</blockquote>"},{"id":"software-24.","bankId":"software","number":"24.","title":"野指针、悬空指针和内存泄漏分别是什么？","stars":5,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>野指针通常指未初始化或被破坏、指向未知位置的指针；悬空指针曾指向有效对象，但对象已经释放或离开生命周期；内存泄漏是已分配资源失去可达引用，无法再释放。预防手段包括初始化、清晰的所有权、释放后置空、边界检查、静态分析和减少动态分配。</blockquote>"},{"id":"software-25.","bankId":"software","number":"25.","title":"从 `.c` 文件到固件经历什么过程？","stars":4,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>预处理展开头文件和宏；编译把 C 转为汇编或中间表示并优化；汇编生成目标文件；链接器解析符号和重定位，按链接脚本把各段放进 Flash/RAM，生成 ELF；最后可转换为 bin 或 hex。启动文件提供向量表、复位入口和运行库初始化代码。</blockquote>"},{"id":"software-26.","bankId":"software","number":"26.","title":"map 文件有什么用？","stars":4,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>map 文件展示每个段和符号的地址、大小及来源，可检查 Flash/RAM 占用、某个大数组在哪、哪个库函数拉大了固件、Bootloader 与 App 是否重叠。定位“内存超限”“函数地址异常”和分析全局对象时很有用。</blockquote>"},{"id":"software-27.","bankId":"software","number":"27.","title":"如何估算和检测任务栈？","stars":5,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>静态上要考虑最大调用深度、大局部变量、库函数、浮点上下文和中断嵌套；运行时使用 FreeRTOS 栈高水位、栈填充和溢出钩子。高水位表示历史上最少剩余量，不是当前使用量。测试必须覆盖最坏路径，并保留安全余量，不能看到还剩几个字就认为足够。</blockquote>"},{"id":"software-28.","bankId":"software","number":"28.","title":"什么是原子操作？`i++` 原子吗？","stars":4,"section":"三、内存、编译与链接","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>原子操作从其他执行上下文看不可再分割。某些对齐的机器字读写可能由硬件一次完成，但 <code>i++</code> 通常包含读、加、写三个步骤，不是原子操作。需要根据并发关系使用临界区、互斥量、架构原子指令或 C 原子类型；<code>volatile</code> 不能把它变成原子。</blockquote>\n<p>---</p>"},{"id":"software-29.","bankId":"software","number":"29.","title":"MCU 上电后如何运行到 `main()`？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>以 Cortex-M 为例，上电复位后处理器从向量表第一个字取得初始主栈指针 MSP，从第二个字取得 Reset_Handler 地址。复位处理函数完成必要的底层初始化，把 <code>.data</code> 初值从 Flash 复制到 RAM，把 <code>.bss</code> 清零，可能执行系统时钟和 C/C++ 运行时初始化，最后调用 <code>main()</code>。准确顺序要看具体启动文件和工具链。</blockquote>"},{"id":"software-30.","bankId":"software","number":"30.","title":"中断发生时经历什么？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>当中断到达且优先级和屏蔽条件允许时，CPU 完成当前指令，Cortex-M 硬件自动把部分寄存器压入当前栈，从向量表取 ISR 地址并进入处理；软件保存额外需要的寄存器。ISR 读取和处理中断原因并按手册清标志。异常返回时恢复上下文，若有更高优先级异常可发生嵌套或尾链。</blockquote>"},{"id":"software-31.","bankId":"software","number":"31.","title":"ISR 中不能做什么？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>ISR 要短且有界。不要做长循环、阻塞等待、普通互斥锁、动态内存、复杂打印以及可能阻塞或不可重入的函数。中断中只完成必要的数据读取、清除状态和快速通知，把解析、算法和业务处理交给任务。调用 RTOS 时必须使用允许的 <code>FromISR</code> API，并满足中断优先级限制。</blockquote>"},{"id":"software-32.","bankId":"software","number":"32.","title":"中断标志为什么要清？什么时候清？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>不清标志，退出 ISR 后硬件可能立即再次请求中断。清除方式必须按芯片手册：可能是写 1 清除、读状态后读数据清除，或由硬件序列自动清。清得太早可能丢失状态，清得太晚可能重复进入，因此不能统一说“进入中断第一句就清”。</blockquote>"},{"id":"software-33.","bankId":"software","number":"33.","title":"中断优先级数值越大越高吗？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>Cortex-M NVIC 通常是数值越小、逻辑优先级越高。芯片只实现优先级字段中的部分高位，还可能按优先级分组划分抢占优先级和子优先级。配置 FreeRTOS 时还要分清 CMSIS 使用的逻辑值与写入寄存器后的左移值。</blockquote>"},{"id":"software-34.","bankId":"software","number":"34.","title":"FreeRTOS 的中断优先级有什么限制？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>FreeRTOS 只能通过临界区屏蔽某一优先级范围内的中断。需要调用 <code>...FromISR()</code> API 的中断，逻辑优先级不能高于内核允许的系统调用阈值；那些极高优先级、不会被内核屏蔽的中断不能调用 FreeRTOS API。常见错误是把“数值更大”和“优先级更高”混淆，或把 <code>configMAX_SYSCALL_INTERRUPT_PRIORITY</code> 的寄存器值与库优先级值混用。</blockquote>"},{"id":"software-35.","bankId":"software","number":"35.","title":"ISR 和任务共享数据怎么保护？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>优先避免直接共享：ISR 通过任务通知、队列或流缓冲把事件交给任务。如果必须共享短小状态，要确认访问宽度和原子性，并使用适合 ISR 的临界区或短时间屏蔽相关中断。普通互斥量不能在 ISR 中使用，仅加 <code>volatile</code> 也不能防止读改写竞态。</blockquote>"},{"id":"software-36.","bankId":"software","number":"36.","title":"什么是中断延迟？","stars":4,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>中断延迟是事件发生到 ISR 开始执行的时间，受当前指令、关中断区间、更高优先级 ISR 和硬件入口时间影响。若业务最终由任务处理，还要加上 ISR 执行、通知、调度和任务获得 CPU 的时间。优化时要测最坏值，控制临界区和高优先级 ISR 的最长执行时间。</blockquote>"},{"id":"software-37.","bankId":"software","number":"37.","title":"什么是 HardFault？如何定位？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>HardFault 是 Cortex-M 的严重异常，可能由非法地址、总线错误、错误函数指针、栈溢出、未对齐访问或被升级的其他 Fault 引起。定位时不能只在 HardFault_Handler 死循环。我会判断异常前使用 MSP 还是 PSP，读取异常栈帧中的 PC、LR 和通用寄存器，再查看 CFSR、HFSR、BFAR、MMFAR，结合 map 文件和反汇编定位出错指令，同时检查任务栈水位和内存越界。</blockquote>"},{"id":"software-38.","bankId":"software","number":"38.","title":"看门狗应该怎样设计？","stars":4,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>看门狗用于系统失控时自动恢复，但喂狗必须代表整个系统健康。可以让各关键任务周期上报心跳，由监控任务检查所有心跳、关键队列和状态正常后统一喂狗。不能让一个最高优先级任务无条件喂狗，否则其他任务死锁时仍不会复位。复位后还应记录复位原因和必要现场。</blockquote>"},{"id":"software-39.","bankId":"software","number":"39.","title":"轮询、中断和 DMA 如何选择？","stars":5,"section":"四、启动、中断与异常","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>低频、异步且要求及时响应的事件适合中断；规则简单、频率固定或调试方便时可轮询；连续或大批量数据传输适合 DMA。高频小事件若每字节都中断可能产生中断风暴，此时 DMA 加半满/满或空闲事件更合理。选择要综合实时性、吞吐量、CPU 占用和实现复杂度。</blockquote>\n<p>---</p>"},{"id":"software-40.","bankId":"software","number":"40.","title":"I²C 的基本原理是什么？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>I²C 使用 SDA 和 SCL 两根线，是同步、半双工、支持多主多从的总线。器件通常使用开漏输出，只能主动拉低，因此两根线需要上拉。空闲时两线为高；SCL 为高时 SDA 从高变低是起始条件，从低变高是停止条件。每传输 8 位后由接收方在第 9 个时钟应答。</blockquote>\n<p><strong>追问：</strong>开漏便于多个设备安全共享总线；上拉阻值由总线电容、上升时间和器件灌电流共同决定。</p>"},{"id":"software-41.","bankId":"software","number":"41.","title":"I²C 的 ACK/NACK 和重复起始是什么？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>每 8 位数据后，接收方拉低 SDA 表示 ACK，保持高表示 NACK。主机读最后一个字节时一般回复 NACK，表示不再继续读取，然后发 STOP。重复起始是在不释放总线的情况下再次发 START，常用于先写寄存器地址再切换方向读取，保证整个操作不被其他主机插入。</blockquote>"},{"id":"software-42.","bankId":"software","number":"42.","title":"7 位地址和所谓 8 位地址有什么区别？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>I²C 常用 7 位从机地址，总线上发送的第一个字节是 7 位地址左移一位，再加最低位读写位。有些数据手册直接给出已经左移后的写地址和读地址，所以使用驱动前必须确认 API 需要原始 7 位地址还是总线首字节形式，这是地址 NACK 的常见原因。</blockquote>"},{"id":"software-43.","bankId":"software","number":"43.","title":"I²C 总线被拉死如何恢复？","stars":4,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先用示波器确认 SDA 或 SCL 是否持续为低，并给所有事务设置超时，避免软件永久卡住。可复位 I²C 控制器，把引脚临时改为 GPIO；如果从机卡在发送过程中，可按器件建议产生若干 SCL 脉冲，常见是 9 个，再生成 STOP。仍失败时复位或重新上电从机，最后恢复外设并记录错误。具体恢复序列应遵循器件手册。</blockquote>"},{"id":"software-44.","bankId":"software","number":"44.","title":"I²C 通信失败怎样排查？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>我会按物理层到协议层排查：先确认供电、共地、引脚复用和上拉；再用逻辑分析仪检查 START、地址、R/W 位、ACK、寄存器地址和数据；根据错误状态区分地址 NACK、数据 NACK、超时和总线错误；核对地址格式、速率、时钟拉伸和器件上电时序；必要时降速、单设备验证并加入总线恢复。</blockquote>"},{"id":"software-45.","bankId":"software","number":"45.","title":"SPI 的基本原理和四种模式是什么？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>SPI 常用 SCLK、MOSI、MISO、CS 四根线，是主从式同步全双工通信。CPOL 决定时钟空闲电平，CPHA 决定在第一个还是第二个有效边沿采样，组合成四种模式。主从的模式、位序和数据宽度必须一致。判断模式时应看器件时序图，确认数据在哪个边沿改变、在哪个边沿稳定采样，而不是只背模式编号。</blockquote>"},{"id":"software-46.","bankId":"software","number":"46.","title":"为什么 SPI 读取时也要发送数据？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>SPI 的发送和接收移位寄存器同时工作，主机只有产生时钟，从机数据才会移出。因此读取时主机仍要发送 dummy 字节；同理，写入时主机也会收到一些可能无意义的数据，需要按硬件要求清接收状态。</blockquote>"},{"id":"software-47.","bankId":"software","number":"47.","title":"SPI 通信全是 `0xFF`、`0x00` 或错位怎么查？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先检查从机供电、CS、共地和 MISO 是否真正被驱动；再核对 CPOL、CPHA、位序、数据宽度和频率；用逻辑分析仪观察 CS 建立保持时间和采样边沿。全 <code>0xFF</code> 常见于 MISO 浮空或被上拉、从机未选中，全 <code>0x00</code> 可能被拉低，但不能只凭数据猜。DMA 发送时还要等 SPI 移位寄存器真正结束再抬高 CS。</blockquote>"},{"id":"software-48.","bankId":"software","number":"48.","title":"UART 一帧是什么结构？乱码原因有哪些？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>UART 是异步串行通信，一帧通常包含起始位、数据位、可选校验位和停止位。双方的波特率、数据位、校验和停止位必须一致。乱码可能来自波特率或时钟误差、帧格式不一致、电平标准错误、未共地、噪声、缓冲区溢出、协议边界错误或多个任务同时打印。我会先看物理波形和原始字节，再检查上层解析。</blockquote>"},{"id":"software-49.","bankId":"software","number":"49.","title":"UART 不定长数据如何接收？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>数据量小可用逐字节中断写入环形缓冲；高速或突发数据更适合 DMA 循环接收，配合 IDLE、半满和满事件确定新增数据区间。协议层通过帧头、长度、CRC、超时或转义识别边界。解析器必须支持数据任意分片、一次到多帧、错误后重新同步和缓冲溢出处理。</blockquote>"},{"id":"software-50.","bankId":"software","number":"50.","title":"UART DMA + IDLE 的完整流程是什么？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>启动 DMA 循环接收。发生 IDLE 或 DMA 半满/满事件时，根据 DMA 当前写入位置和上次处理位置计算新增区间，把新数据交给环形缓冲或解析任务，然后继续接收。处理时要考虑缓冲区回绕、IDLE 与 DMA 事件重复、消费者来不及导致覆盖，以及带 Cache 芯片上的一致性问题。中断中只做快速确认和通知，解析放在任务中。</blockquote>"},{"id":"software-51.","bankId":"software","number":"51.","title":"怎样设计健壮的串口协议？","stars":4,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>我会定义同步头、版本、命令、长度、序号、负载和 CRC，并明确字节序、最大帧长、超时、应答重试和错误码。解析顺序是先确认同步和最小头部，再检查长度不超过缓冲区，收齐后校验 CRC，最后分发命令。发生错误要能重新寻找同步头，不能因为一个坏字节永久错位。</blockquote>"},{"id":"software-52.","bankId":"software","number":"52.","title":"TTL UART、RS-232 和 RS-485 有什么区别？","stars":4,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>UART 描述数据帧和控制器；TTL/CMOS UART 是单端逻辑电平；RS-232 使用不同的电气电平和极性，不能直接连接 MCU；RS-485 使用差分信号，抗干扰和距离更好，可多节点，常见半双工并需要方向控制和总线两端终端匹配。它们不能仅按接口名字直接互连，需要相应收发器。</blockquote>"},{"id":"software-53.","bankId":"software","number":"53.","title":"CAN 的特点和仲裁机制是什么？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>CAN 是多主广播总线，使用差分信号，具有位仲裁、错误检测、自动重发和故障隔离。报文 ID 主要表示消息含义并决定优先级，不是普通节点地址。仲裁时显性位覆盖隐性位，节点边发边监听；发送隐性却读到显性的节点退出，胜出报文不会被破坏，因此 ID 数值较小的报文通常优先级更高。</blockquote>"},{"id":"software-54.","bankId":"software","number":"54.","title":"CAN 为什么需要 120Ω 终端？","stars":4,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>在总线物理两端放置约 120Ω 终端，用于匹配线缆特性阻抗、减少反射。断电时测 CAN_H 和 CAN_L 之间通常约 60Ω，代表两只 120Ω 并联。终端不应随意放在每个节点；支线过长也会恶化高速信号质量。</blockquote>"},{"id":"software-55.","bankId":"software","number":"55.","title":"CAN 收不到报文怎样排查？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>从收发器供电、使能、共地、H/L 接线和终端开始；再核对波特率、采样点、标准/扩展 ID、过滤器和引脚复用；用分析仪看总线上是否存在正常帧或错误帧；读取控制器发送/接收错误计数和 Bus Off 状态。若自己能发送但无人 ACK，也会不断重发并积累错误。</blockquote>"},{"id":"software-56.","bankId":"software","number":"56.","title":"I²C、SPI、UART、CAN 如何选型？","stars":5,"section":"五、I²C、SPI、UART 与 CAN","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>板内低速多外设且希望省引脚，可选 I²C；板内高速传感器或 Flash 常选 SPI；简单点对点、调试口或带外部收发器的串行链路常用 UART；多节点、强干扰和需要仲裁容错的场合常选 CAN。还要结合距离、吞吐量、引脚、布线、可靠性、器件支持和软件复杂度，不能只说“哪个更快”。</blockquote>\n<p>---</p>"},{"id":"software-57.","bankId":"software","number":"57.","title":"什么是实时系统？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>实时系统强调在确定的截止时间内完成，而不是平均运行速度快。硬实时系统错过截止时间可能造成不可接受后果，软实时系统偶尔超时通常只是性能或体验下降。判断是否实时要分析最坏执行时间、阻塞时间和最坏响应时间，不能因为用了 FreeRTOS 就自动成为实时系统。</blockquote>"},{"id":"software-58.","bankId":"software","number":"58.","title":"FreeRTOS 任务有哪些状态？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>主要有 Running、Ready、Blocked 和 Suspended。Running 是当前执行；Ready 已具备运行条件但等待 CPU；Blocked 在等待时间或事件，到期或事件发生后回 Ready；Suspended 不会因为超时自动恢复，需要显式恢复。已删除任务还可能等待 Idle 任务回收动态内存。</blockquote>"},{"id":"software-59.","bankId":"software","number":"59.","title":"FreeRTOS 如何调度任务？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>常见配置是固定优先级抢占调度：所有 Ready 任务中最高优先级任务运行；更高优先级任务一旦就绪可抢占当前任务。同优先级任务是否按 tick 时间片轮转由配置决定。任务阻塞、让出、ISR 唤醒高优先级任务和 tick 到来都可能触发调度。高优先级任务无事时必须阻塞，否则低优先级任务会饥饿。</blockquote>"},{"id":"software-60.","bankId":"software","number":"60.","title":"一次任务切换发生了什么？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>内核保存当前任务需要保留的寄存器和栈指针，把任务状态更新并选择下一个最高优先级就绪任务，再恢复它的上下文。Cortex-M 端口通常使用 PendSV 完成切换，部分寄存器由异常硬件自动压栈，部分由端口汇编保存。切换有时间和缓存开销，所以任务不是越多越好。</blockquote>"},{"id":"software-61.","bankId":"software","number":"61.","title":"SysTick、PendSV、SVC 在 FreeRTOS 中做什么？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>SysTick 常提供系统节拍，更新延时和超时；PendSV 通常设为最低异常优先级，用于在合适时机执行上下文切换；SVC 常用于启动第一个任务或特权服务。具体实现取决于芯片端口，但三者共同支持时间管理和调度。</blockquote>"},{"id":"software-62.","bankId":"software","number":"62.","title":"`vTaskDelay()` 和 `vTaskDelayUntil()` 有什么区别？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>vTaskDelay()</code> 从调用时刻起延迟相对 tick 数，如果循环中的处理时间变化，周期会累积漂移；<code>vTaskDelayUntil()</code> 以保存的上次唤醒时间为基准计算下一周期，更适合固定周期任务。唤醒只代表进入 Ready，不保证该时刻立即运行；如果错过周期，还要根据业务决定补跑还是跳过。</blockquote>"},{"id":"software-63.","bankId":"software","number":"63.","title":"为什么不能在任务中长期忙等？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>忙等期间任务一直是 Running/Ready，会占用 CPU，让同级或低优先级任务得不到执行，也阻碍 Idle 和低功耗。等待外设、消息或时间时应使用阻塞 API；微秒级且必须精确的极短等待可以结合硬件定时器评估，但不能把大段业务写成延时死循环。</blockquote>"},{"id":"software-64.","bankId":"software","number":"64.","title":"如何划分任务和设置优先级？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>按独立并发活动、不同周期和实时需求划分，而不是每个函数一个任务。优先级依据截止时间、响应要求、最坏执行时间和资源依赖确定，不是“功能重要就最高”。高优先级任务要短小并经常阻塞；长计算可分片或放较低优先级。最后要在最坏通信和负载下实测响应。</blockquote>"},{"id":"software-65.","bankId":"software","number":"65.","title":"高优先级任务一直不阻塞会怎样？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>只要它始终处于 Ready，所有较低优先级任务都会饥饿，包括 Idle 任务。系统可能无法回收已删除任务内存、无法执行空闲钩子和低功耗。正确设计是让任务等待队列、通知、信号量或周期时间，而不是空转轮询。</blockquote>"},{"id":"software-66.","bankId":"software","number":"66.","title":"FreeRTOS tick 越高越好吗？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>tick 越高，延时和时间片粒度更细，但周期中断、调度开销和功耗更大；tick 较低则开销小但时间粒度粗。tick 频率不等于任务精确运行频率，微秒级或低抖动定时应使用硬件定时器。选择应依据最小软件时间需求和系统负载测量。</blockquote>"},{"id":"software-67.","bankId":"software","number":"67.","title":"动态和静态创建任务如何选择？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>动态创建方便，TCB 和栈从 FreeRTOS heap 分配，但要处理失败和碎片；静态创建由应用提供 TCB 与栈，内存位置和上限更可控，适合高可靠系统。无论哪种都要检查创建结果、测栈高水位，并避免为了省少量 RAM 把栈压到危险边缘。</blockquote>"},{"id":"software-68.","bankId":"software","number":"68.","title":"`heap_1` 到 `heap_5` 有什么区别？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote><code>heap_1</code> 只能分配不能释放，最简单；<code>heap_2</code> 可释放但不合并相邻空闲块，容易碎片；<code>heap_3</code> 封装标准 malloc/free 并做调度保护；<code>heap_4</code> 支持释放和相邻空闲块合并，最常用；<code>heap_5</code> 类似 heap_4，但支持多个不连续内存区域。选择取决于是否释放、确定性和内存布局。</blockquote>"},{"id":"software-69.","bankId":"software","number":"69.","title":"如何检查 FreeRTOS 内存和栈是否足够？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>所有创建和分配 API 都检查返回值；记录当前和历史最小剩余 heap；对每个任务读取栈高水位并启用栈溢出钩子；启用 malloc failed hook；在最坏通信突发、完整功能和长时间运行下测试。只看系统刚启动时的剩余空间没有意义。</blockquote>"},{"id":"software-70.","bankId":"software","number":"70.","title":"软件定时器回调在哪运行？","stars":5,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>FreeRTOS 软件定时器回调在 Timer Service/Daemon Task 中执行，不是硬件中断。因此回调不能长时间阻塞或做大量计算，否则会延迟其他定时器回调和命令。复杂工作应由回调发送通知给专用任务；同时合理配置定时器任务优先级、栈和命令队列长度。</blockquote>"},{"id":"software-71.","bankId":"software","number":"71.","title":"临界区和挂起调度器有什么区别？","stars":4,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>临界区通常屏蔽内核可管理范围内的中断，用于极短的不可打断操作；挂起调度器只阻止任务切换，中断仍可执行，因此不能保护与 ISR 共享的数据。两者都不应包住长耗时或阻塞操作，恢复时可能立即触发调度。</blockquote>"},{"id":"software-72.","bankId":"software","number":"72.","title":"什么是 Tickless Idle？","stars":3,"section":"六、FreeRTOS 任务、调度和时间","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>当内核预计一段时间没有任务需要运行时，Tickless Idle 暂停周期 tick 并让 MCU 进入低功耗，唤醒后根据实际睡眠时间补偿 tick。实现要处理低功耗时钟精度、外设唤醒、最大睡眠时间和调试器影响。前提仍是任务无事时真正阻塞。</blockquote>\n<p>---</p>"},{"id":"software-73.","bankId":"software","number":"73.","title":"队列、信号量、互斥量和任务通知如何选？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>需要传递数据副本时用队列；只表示一次事件可用二值信号量；累计同类事件或管理有限资源数量可用计数信号量；保护由任务独占的共享资源使用互斥量，因为它有所有权和优先级继承；一个任务接收简单事件、计数、位或值时，任务通知更轻量。选择要根据数据、所有权、接收者数量和是否需要排队决定。</blockquote>"},{"id":"software-74.","bankId":"software","number":"74.","title":"FreeRTOS 队列传数据还是传地址？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>队列按创建时的 item size 复制固定大小数据。如果元素类型是指针，队列只复制指针值，不复制底层对象。传指针可以减少大数据复制，但必须明确缓冲区由谁申请、接收前是否仍有效、谁负责释放以及队列满时如何归还，否则容易悬空或泄漏。</blockquote>"},{"id":"software-75.","bankId":"software","number":"75.","title":"互斥量和二值信号量有什么区别？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>二值信号量主要表达事件同步，没有严格所有权，哪个任务都可以 give；互斥量表达资源所有权，应由获取者释放，并提供优先级继承来缓解优先级反转。ISR 可以 give 某些信号量来通知任务，但不能使用互斥量，因为 ISR 不是可阻塞且拥有资源的任务。</blockquote>"},{"id":"software-76.","bankId":"software","number":"76.","title":"什么是优先级反转？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>低优先级任务持有互斥资源，高优先级任务等待它；此时中优先级任务不断抢占低优先级任务，导致高优先级任务被间接延迟，这就是优先级反转。优先级继承会临时提高锁持有者优先级，使其尽快完成并释放。还应缩短持锁区、减少共享、避免嵌套锁；继承只是缓解，不解决所有设计问题。</blockquote>"},{"id":"software-77.","bankId":"software","number":"77.","title":"什么是死锁？如何避免？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>死锁通常同时具备互斥、占有且等待、不可抢占和循环等待。工程中最实用的预防是规定全局锁顺序、减少嵌套锁、缩短持锁时间、必要时一次申请资源，并设置超时和诊断。超时可以避免永久卡死，但不能自动保证业务状态一致，超时后必须执行明确的回滚或恢复。</blockquote>"},{"id":"software-78.","bankId":"software","number":"78.","title":"什么是竞态条件？`volatile` 能解决吗？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>多个执行上下文访问共享状态，结果取决于不可控的执行交错，就是竞态。<code>volatile</code> 只能约束编译优化，不能让复合操作原子化，也不能建立互斥和完整的内存顺序。解决要根据场景使用单所有者消息模型、互斥量、临界区、原子操作或 RTOS 通信原语。</blockquote>"},{"id":"software-79.","bankId":"software","number":"79.","title":"任务通知为什么高效？有什么限制？","stars":4,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>通知状态直接存放在任务控制块中，不需要额外创建队列对象，所以内存和执行开销较小。它可以表达置位、计数、覆盖值等模式，特别适合 ISR 唤醒某个固定任务。但它主要面向指定接收任务，不适合多个消费者竞争，也不能替代需要缓存多个结构体消息的队列。</blockquote>"},{"id":"software-80.","bankId":"software","number":"80.","title":"Event Group 适合什么场景？","stars":4,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>Event Group 用 bit 表示多个条件，任务可以等待任意一个或全部条件，例如“网络已连接且时间已同步”。它适合状态组合，不携带数据内容。要明确等待后是否自动清位、多个等待者的行为以及 ISR 设置事件位的实现限制，避免把一次性事件和长期状态混淆。</blockquote>"},{"id":"software-81.","bankId":"software","number":"81.","title":"Stream Buffer 和 Message Buffer 有什么区别？","stars":3,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>Stream Buffer 传输连续字节流，不保留消息边界，适合串口数据；Message Buffer 在其基础上保留每条变长消息的边界。典型实现面向单写者单读者，多写者或多读者要额外串行化并确认版本文档。它们不是通用多生产者消息队列。</blockquote>"},{"id":"software-82.","bankId":"software","number":"82.","title":"ISR 唤醒高优先级任务后怎样立即切换？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>在 ISR 中调用对应的 <code>...FromISR()</code> API，并把初始化为 <code>pdFALSE</code> 的 <code>xHigherPriorityTaskWoken</code> 地址传入。如果操作使更高优先级任务就绪，该变量会被置真；退出 ISR 前调用端口提供的 yield 宏请求切换。不能在 ISR 调普通阻塞 API，也不能设置非零等待时间。</blockquote>"},{"id":"software-83.","bankId":"software","number":"83.","title":"队列满或空时怎样处理？","stars":5,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>任务 API 可选择立即失败、有限超时或一直阻塞；ISR 不能阻塞。更重要的是定义系统过载策略：关键控制消息可能需要预留容量或报警，连续数据可丢最新、丢最旧、覆盖或反压。队列长度应根据最大突发量和消费者最坏阻塞时间计算，并通过高水位统计验证，而不是无限加大。</blockquote>"},{"id":"software-84.","bankId":"software","number":"84.","title":"多任务日志应该怎样设计？","stars":4,"section":"七、FreeRTOS 同步与通信","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>多任务直接格式化并发送串口容易交叉、阻塞和产生锁竞争。可以把日志等级、模块、时间戳和参数写入日志队列，由单独低优先级任务统一格式化发送；设置带宽和丢弃策略，并保留崩溃前环形日志。ISR 中只记录最小事件或使用专门的无阻塞通道。</blockquote>\n<p>---</p>"},{"id":"software-85.","bankId":"software","number":"85.","title":"DMA 的原理和优缺点是什么？","stars":5,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>DMA 控制器在外设和内存或内存之间搬运数据，CPU 只负责配置源地址、目标地址、长度、方向和触发条件，完成后用中断通知。它减少逐字节中断和 CPU 搬运，但并非零开销：DMA 会争用总线，CPU 仍需管理缓冲和完成事件。有 Cache 的 MCU 还必须处理一致性。</blockquote>"},{"id":"software-86.","bankId":"software","number":"86.","title":"DMA 循环和双缓冲怎样工作？","stars":4,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>循环模式传到缓冲末尾后自动回到开头，适合连续采样；双缓冲让 DMA 填 A 时 CPU 处理 B，然后交换，使采集和处理并行。设计的关键是缓冲区所有权：CPU 必须在 DMA 再次覆盖前处理完成，并通过半满/满事件、索引或状态位同步。若处理速度长期低于产生速度，缓冲再大也会溢出。</blockquote>"},{"id":"software-87.","bankId":"software","number":"87.","title":"DMA 与 Cache 为什么会不一致？","stars":4,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>CPU 可能只修改了 Cache 而 RAM 还是旧数据，DMA 发送就会读到旧值；DMA 接收已经写入 RAM，但 CPU Cache 中仍有旧副本，CPU 也可能读错。发送前按平台要求 clean，接收后 invalidate；缓冲区和长度通常需按 cache line 对齐，或放在非缓存区。顺序必须遵循芯片手册和 SDK。</blockquote>"},{"id":"software-88.","bankId":"software","number":"88.","title":"定时器频率怎样计算？","stars":5,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先从时钟树确认定时器实际输入时钟，再根据预分频 PSC 和自动重装 ARR 计算。常见向上计数更新频率为 <code>timer_clk / ((PSC+1)*(ARR+1))</code>。STM32 某些系列在 APB 分频不为 1 时，定时器时钟可能是 APB 时钟的两倍，所以不能只看总线频率。</blockquote>"},{"id":"software-89.","bankId":"software","number":"89.","title":"PWM 频率和占空比怎样设置？","stars":5,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>PSC 和 ARR 决定计数频率及 PWM 周期，比较寄存器 CCR 相对 ARR 决定占空比。还要确认向上/中心对齐模式、输出极性、更新影子寄存器和边界值。频率越高，在固定定时器时钟下可用计数值越少，占空比分辨率会降低。</blockquote>"},{"id":"software-90.","bankId":"software","number":"90.","title":"ADC 精度受什么影响？","stars":4,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>位数只决定理想分辨率，实际精度还受参考电压、输入源阻抗、采样时间、时钟、噪声、布局、地线和校准影响。高阻信号可能无法在采样窗口内给采样电容充到正确电压，需要增加采样时间或加缓冲。软件滤波能降噪，但不能修复错误参考源和硬件布局。</blockquote>"},{"id":"software-91.","bankId":"software","number":"91.","title":"GPIO 的推挽和开漏有什么区别？","stars":5,"section":"八、DMA、定时器与常用外设","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>推挽能主动输出高、低电平，驱动能力强；开漏只能主动拉低，高电平靠上拉，因此可让多个器件共享线路、实现线与和一定范围的电平转换。I²C 使用开漏就是为了避免多个设备同时输出不同电平造成硬冲突。</blockquote>\n<p>---</p>"},{"id":"software-92.","bankId":"software","number":"92.","title":"MCU 常见低功耗模式如何选择？","stars":4,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>从 Sleep 到 Stop、Standby，关闭的时钟和电源域逐渐增多，功耗更低，但唤醒延迟更长、保留状态更少。选择要根据最长允许响应时间、唤醒源、RAM/外设保持需求和平均能量。进入前配置唤醒源、处理外设和 GPIO，唤醒后恢复时钟并验证系统时间。</blockquote>"},{"id":"software-93.","bankId":"software","number":"93.","title":"为什么实测低功耗比手册高？","stars":5,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>手册通常给特定电压、温度和外设状态下的 MCU 电流，开发板还有稳压器、LED、调试器、USB 芯片和传感器。常见问题包括调试器连接、GPIO 浮空、外设时钟未关、外部器件未休眠、通过 IO 反向供电和频繁唤醒。我会先分离 MCU 与整板功耗，再逐模块关闭并测量。</blockquote>"},{"id":"software-94.","bankId":"software","number":"94.","title":"FreeRTOS 下怎样做低功耗？","stars":4,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>首先让所有无事任务进入 Blocked，避免轮询；再利用 Idle 或 Tickless Idle，在没有即将到期任务时进入睡眠。进入和退出流程要协调系统 tick、低功耗定时器、UART/DMA 和外部唤醒源。不能在 Idle Hook 中不检查条件就直接深睡，否则可能破坏内核时间和外设事务。</blockquote>"},{"id":"software-95.","bankId":"software","number":"95.","title":"Bootloader 有什么作用？","stars":5,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>Bootloader 负责最小硬件初始化、判断启动或升级条件、接收和验证固件、选择可启动镜像并跳转到应用。可靠方案还包括版本管理、失败回滚、升级状态记录和安全签名验证。Bootloader 应尽量小、稳定并与 App 的 Flash 分区清晰隔离。</blockquote>"},{"id":"software-96.","bankId":"software","number":"96.","title":"Bootloader 怎样跳转到 App？","stars":5,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先校验 App 向量表、初始栈地址和复位入口是否合法；关闭或恢复 Bootloader 使用过的外设和中断，停止 SysTick，清理挂起中断；把向量表偏移设为 App 地址；加载 App 向量表中的初始 MSP，再跳转到 App 的 Reset_Handler。带 Cache、MPU 或复杂时钟时还要恢复到双方约定状态。</blockquote>"},{"id":"software-97.","bankId":"software","number":"97.","title":"固件升级怎样防止断电变砖？","stars":5,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>使用 A/B 双镜像或独立下载区。新固件完整下载到非当前运行分区，逐块校验，完成后验证整包哈希或签名，再以断电安全方式写入待启动标志。启动新镜像后先进入试运行，应用上报健康才正式提交；超时、崩溃或看门狗复位则回滚。关键元数据要有冗余、序号和 CRC。</blockquote>"},{"id":"software-98.","bankId":"software","number":"98.","title":"CRC、哈希、签名和加密有什么区别？","stars":4,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>CRC 主要检查随机传输或存储错误，攻击者可以重新计算；哈希生成内容摘要，但单独使用不能证明发布者身份；数字签名验证固件未被篡改且来自可信发布者；加密保护内容不被看到。安全 OTA 通常至少需要签名验证，是否加密取决于保密需求。</blockquote>"},{"id":"software-99.","bankId":"software","number":"99.","title":"Flash 参数怎样可靠保存？","stars":4,"section":"九、低功耗、Bootloader 与升级","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>Flash 通常按页擦除、写入粒度有限且寿命有限。我会采用双页或日志式记录，每条包含魔数、版本、长度、序号和 CRC；先完整写新记录并校验，再让它生效。启动时选择序号最新的有效记录，空间满后再垃圾回收。频繁变化的数据先在 RAM 聚合，避免每次变化都擦写。</blockquote>\n<p>---</p>"},{"id":"software-100.","bankId":"software","number":"100.","title":"如何定位偶现死机？","stars":5,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先提高可观测性：记录复位原因、最后日志、任务状态、栈高水位、历史最小 heap、锁和队列状态，HardFault 时保存异常寄存器和栈帧。然后构造高负载、边界输入和电源干扰复现，从内存越界、栈溢出、竞态死锁、ISR 优先级、DMA 缓冲和硬件供电分层排查。看门狗用于恢复和保留现场，不能替代根因定位。</blockquote>"},{"id":"software-101.","bankId":"software","number":"101.","title":"怎样定位内存被踩？","stars":5,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>在关键缓冲区前后放哨兵值，启用栈填充和溢出检查，使用硬件数据观察点或 MPU 捕捉非法写；检查所有 memcpy/DMA 的地址与长度；找到第一次被破坏的时刻，而不是只看最终崩溃位置。可逐步缩小可疑模块和数据路径，并在主机测试环境使用 sanitizer 辅助。</blockquote>"},{"id":"software-102.","bankId":"software","number":"102.","title":"Debug 正常、Release 异常的原因有哪些？","stars":5,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>常见原因是未初始化变量、越界和其他未定义行为、竞态和时序变化、应使用 <code>volatile</code> 的硬件/异步状态没有使用、栈布局变化以及无副作用延时循环被优化掉。正确方法是根据告警、反汇编和运行证据修复根因，而不是永久关闭优化。</blockquote>"},{"id":"software-103.","bankId":"software","number":"103.","title":"怎样测代码执行时间和实时延迟？","stars":4,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>最直接的方法是在关键路径前后翻转 GPIO，用示波器或逻辑分析仪测脉宽；也可使用 CPU 周期计数器、硬件定时器或 RTOS trace。要测多次并覆盖最坏中断和总线负载，关注最大值和抖动。串口日志本身耗时较大，只适合较粗粒度测量。</blockquote>"},{"id":"software-104.","bankId":"software","number":"104.","title":"什么是可重入函数？","stars":4,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>一个函数尚未执行完时被另一个任务或 ISR 再次调用，仍能各自正确运行，就是可重入。它通常只使用局部数据或由调用者提供的上下文，不依赖未保护的可变全局/静态状态，也不返回共享静态缓冲。线程安全与可重入相关，但线程安全函数可能依赖锁，因此不一定适合 ISR 重入。</blockquote>"},{"id":"software-105.","bankId":"software","number":"105.","title":"代码优化应该怎么做？","stars":4,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先明确指标并测量热点，再优化算法、数据结构、数据搬运和任务阻塞，最后才做局部指令优化。每次优化都要验证正确性、最坏执行时间、代码体积、RAM 和可维护性。没有测量的优化很容易优化错方向。</blockquote>"},{"id":"software-106.","bankId":"software","number":"106.","title":"嵌入式怎样做单元测试？","stars":3,"section":"十、调试、性能与可靠性","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>把协议解析、状态机和算法写成与寄存器无关的纯逻辑，通过接口封装硬件驱动，并用 fake/mock 替换。大量边界测试可在主机上快速执行，目标板再做驱动集成和硬件在环测试。重点覆盖超时、错误帧、溢出和资源失败等异常路径。</blockquote>\n<p>---</p>"},{"id":"software-107.","bankId":"software","number":"107.","title":"串口高速接收偶尔丢包，怎样排查？","stars":5,"section":"十一、高频场景题","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>先量化波特率、包长、突发间隔和丢失位置；检查 UART 的溢出、帧错误和物理波形；统计 ISR 最长延迟、DMA/环形缓冲和队列高水位；测消费者最坏处理时间。若逐字节中断压力过大，可改 DMA 循环加 IDLE/半满满事件并批量处理。最后定义过载策略，并用高于真实负载的持续压力测试验证。</blockquote>"},{"id":"software-108.","bankId":"software","number":"108.","title":"系统运行数小时后卡死，重启恢复，怎么办？","stars":5,"section":"十一、高频场景题","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>重点怀疑泄漏、碎片、栈溢出、死锁、计数回绕、DMA 越界和电源问题。我会在卡死前周期记录 heap 最小值、各任务栈水位、任务状态、锁和队列，加入 HardFault 现场和看门狗复位原因；用加速负载和边界条件复现。修复后做长时间回归，不能只加自动重启。</blockquote>"},{"id":"software-109.","bankId":"software","number":"109.","title":"高优先级任务响应突然变慢，可能是什么原因？","stars":5,"section":"十一、高频场景题","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>可能是长时间关中断、被更高优先级 ISR 占用、等待低优先级持有的锁形成优先级反转、调度器被挂起、总线/DMA 争用或任务自身最坏执行时间变长。我会用 GPIO 或 trace 分别测事件到 ISR、ISR 到通知、通知到任务运行和任务处理各阶段，定位延迟发生在哪里。</blockquote>"},{"id":"software-110.","bankId":"software","number":"110.","title":"两个任务访问同一个 I²C/SPI 设备怎样设计？","stars":5,"section":"十一、高频场景题","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>简单方案是用互斥量保护一次完整事务，包括 CS、重复起始和设备内部状态，设置超时并保证所有错误路径释放锁。复杂系统可建立总线管理任务，其他任务通过请求队列提交事务，由它统一调度、超时和恢复。后者更容易管理异步 DMA 和优先级，但增加消息设计复杂度。</blockquote>"},{"id":"software-111.","bankId":"software","number":"111.","title":"固定频率采样但处理偶尔来不及，怎样设计？","stars":4,"section":"十一、高频场景题","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>用硬件定时器触发 ADC 和 DMA，采用双缓冲，半满/满事件只通知处理任务。测量最坏处理时间，保证小于缓冲再次覆盖的时间。如果平均处理能力不足，任何缓冲最终都会满，因此要优化算法、降低采样、分级处理或明确丢块和报警策略。</blockquote>\n<p>---</p>"},{"id":"software-112.","bankId":"software","number":"112.","title":"面试常见手写题有哪些？","stars":4,"section":"十二、手写题与项目追问","answerHtml":"<p>必须能够独立写出并解释边界：</p>\n<ol>\n<li>单链表反转、判断链表是否有环；</li>\n<li><code>strlen</code>、有限长度字符串复制、重叠安全复制；</li>\n<li>环形队列入队/出队；</li>\n<li>位统计、判断 2 的幂、位域读写；</li>\n<li>二分查找及边界；</li>\n<li>非阻塞按键消抖状态机；</li>\n<li>UART 帧解析状态机；</li>\n<li>生产者—消费者队列；</li>\n<li>ISR 采集、任务处理的数据通路。</li>\n</ol>\n<p><strong>答题原则：</strong>先澄清输入、容量、并发和错误策略，再写正常流程，最后主动检查空输入、满/空、回绕、溢出和生命周期。</p>"},{"id":"software-113.","bankId":"software","number":"113.","title":"项目任务设计必须准备哪些数据？","stars":5,"section":"十二、手写题与项目追问","answerHtml":"<p>对每个任务准备一张表：任务职责、触发方式、周期/截止时间、优先级及理由、最坏执行时间、栈大小及实测高水位、等待对象、输出对象、异常策略。能画出 ISR → 队列/通知 → 任务 → 外设或业务的完整数据流。</p>"},{"id":"software-114.","bankId":"software","number":"114.","title":"面试官问“队列长度为什么是这个值”怎么答？","stars":5,"section":"十二、手写题与项目追问","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>队列容量应根据生产最大突发速率、消费者最坏阻塞时间和单条处理时间估算，再通过压力测试观察高水位并保留余量。例如消费者最多可能被阻塞 20ms，生产者每 2ms 一条，至少要容纳 10 条，再结合抖动和安全余量设置。队列满时还必须有明确的丢弃、覆盖或报警策略。</blockquote>"},{"id":"software-115.","bankId":"software","number":"115.","title":"面试官问“你的项目稳定性如何证明”怎么答？","stars":5,"section":"十二、手写题与项目追问","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>我不会只说“运行没问题”，而会说明测试条件和数据：连续运行时长、最大通信负载、异常断线/错误帧/掉电次数、任务栈和 heap 历史最小值、看门狗与复位记录、丢包率和最大响应延迟。发现问题后有固定回归用例，关键指标可复现。</blockquote>"},{"id":"software-116.","bankId":"software","number":"116.","title":"如果重新做一次项目，会怎么改？","stars":5,"section":"十二、手写题与项目追问","answerHtml":"<p><strong>参考回答：</strong></p>\n<blockquote>我会基于真实不足回答，例如把驱动和业务进一步解耦、用 DMA 环形接收代替逐字节中断、建立统一错误恢复、补充栈/队列监控和自动化测试。说明改动解决什么已观察到的问题以及代价，不要泛泛说“代码写得更规范”。</blockquote>\n<p>---</p>"}]},{"id":"hardware","name":"嵌入式硬件","file":"硬件工程师秋招面试题库.md","accent":"#e76f51","questions":[{"id":"hardware-0.1","bankId":"hardware","number":"0.1","title":"一分钟自我介绍怎么讲？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>建议结构：学校与专业 → 硬件技术栈 → 最有代表性的板卡/项目 → 自己负责的工作 → 一个量化结果或典型问题 → 求职方向。</p>\n<p>示例骨架：</p>\n<blockquote>我主要做嵌入式硬件开发，熟悉 MCU 最小系统、电源、常见接口及两/四层板设计流程。项目中负责过器件选型、原理图、PCB 检查、焊接调试和联调，曾通过……定位并解决……，最终实现……。我希望应聘控制板、物联网或工控方向的硬件工程师岗位。</blockquote>"},{"id":"hardware-0.2","bankId":"hardware","number":"0.2","title":"如何介绍一个硬件项目？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>必须覆盖：</p>\n<ul>\n<li>需求、应用场景和关键指标；</li>\n<li>系统框图：输入电源、主控、传感器、通信、执行器；</li>\n<li>你独立负责的原理图、PCB 或调试部分；</li>\n<li>关键器件为什么这样选；</li>\n<li>最难的问题、测量证据和定位过程；</li>\n<li>功耗、纹波、温升、通信距离、EMC、良率等结果；</li>\n<li>如果重做一次会如何改版。</li>\n</ul>"},{"id":"hardware-0.3","bankId":"hardware","number":"0.3","title":"为什么想做硬件工程师？","stars":4,"section":"0. 自我介绍与项目表达","answerHtml":"<p>回答要落到真实经历：喜欢把需求变为可测量的电路、愿意看手册和波形、能耐心定位板级问题；不要只说“喜欢焊板子”。</p>"},{"id":"hardware-0.4","bankId":"hardware","number":"0.4","title":"原理图到量产通常经历哪些阶段？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>需求与指标 → 系统方案 → 器件选型与风险评估 → 原理图 → 评审与 ERC → PCB 约束/布局布线 → DRC/可制造性检查 → 打样 → 焊接与上电 → 单元测试 → 系统联调 → 环境/EMC/可靠性测试 → 试产和量产问题闭环。</p>"},{"id":"hardware-0.5","bankId":"hardware","number":"0.5","title":"项目中最严重的硬件故障是什么？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>按“现象 → 复现条件 → 分块隔离 → 测量证据 → 根因 → 修改 → 回归验证”回答。必须说出使用的工具和具体波形/数值，避免只说“查资料后解决了”。</p>\n<p>---</p>"},{"id":"hardware-1.1","bankId":"hardware","number":"1.1","title":"欧姆定律、KCL、KVL 分别是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<ul>\n<li>欧姆定律：在线性电阻条件下 <code>V = IR</code>；</li>\n<li>KCL：节点流入电流代数和等于流出电流代数和；</li>\n<li>KVL：闭合回路电压代数和为零。</li>\n</ul>\n<p>回答时注意它们成立的模型和参考方向。</p>"},{"id":"hardware-1.2","bankId":"hardware","number":"1.2","title":"戴维南等效和诺顿等效是什么？","stars":4,"section":"1. 电路基础","answerHtml":"<p>线性二端网络可等效为理想电压源串联电阻，或理想电流源并联电阻。常用于分析负载、分压器输出阻抗和最大功率传输。</p>"},{"id":"hardware-1.3","bankId":"hardware","number":"1.3","title":"RC 电路充放电规律是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<p>时间常数 <code>τ = RC</code>；一阶响应经过 1τ 达到最终变化量约 63.2%，约 5τ 可视为基本稳定。要能分析上电复位、按键滤波、软启动和延时电路。</p>"},{"id":"hardware-1.4","bankId":"hardware","number":"1.4","title":"电容和电感的基本特性是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<p>理想电容电压不能突变，<code>i = C·dv/dt</code>；理想电感电流不能突变，<code>v = L·di/dt</code>。真实器件存在 ESR、ESL、额定电压/电流、自谐振和温度特性。</p>"},{"id":"hardware-1.5","bankId":"hardware","number":"1.5","title":"容抗和感抗如何计算？","stars":4,"section":"1. 电路基础","answerHtml":"<p><code>|Xc| = 1/(2πfC)</code>，频率越高容抗越低；<code>|Xl| = 2πfL</code>，频率越高感抗越高。实际高频下寄生参数会使规律在自谐振点附近改变。</p>"},{"id":"hardware-1.6","bankId":"hardware","number":"1.6","title":"一阶 RC 低通和高通如何判断？","stars":5,"section":"1. 电路基础","answerHtml":"<p>低通通常串 R、对地 C，从电容两端取输出；高通通常串 C、对地 R，从电阻两端取输出。截止频率 <code>fc = 1/(2πRC)</code>，在截止点幅度约下降 3 dB。</p>"},{"id":"hardware-1.7","bankId":"hardware","number":"1.7","title":"分贝 dB 如何计算？","stars":4,"section":"1. 电路基础","answerHtml":"<p>功率比用 <code>10log10(P2/P1)</code>；相同阻抗下电压或电流幅值比用 <code>20log10(V2/V1)</code>。3 dB 约对应功率 2 倍，20 dB 对应幅值 10 倍。</p>"},{"id":"hardware-1.8","bankId":"hardware","number":"1.8","title":"有功功率、无功功率和视在功率是什么？","stars":2,"section":"1. 电路基础","answerHtml":"<p>交流系统中有功功率完成净能量传递，无功功率在储能元件与电源间交换，视在功率综合电压电流有效值；功率因数反映有功与视在功率关系。</p>"},{"id":"hardware-1.9","bankId":"hardware","number":"1.9","title":"电阻串并联如何计算？","stars":5,"section":"1. 电路基础","answerHtml":"<p>串联电阻相加；并联满足倒数相加。两电阻并联为 <code>R1R2/(R1+R2)</code>。还要能算分压器输出及负载接入后的误差。</p>"},{"id":"hardware-1.10","bankId":"hardware","number":"1.10","title":"上拉和下拉电阻有什么作用？阻值如何选？","stars":5,"section":"1. 电路基础","answerHtml":"<p>提供默认逻辑电平，避免输入悬空；阻值要在功耗、抗干扰、上升时间、漏电流和驱动能力间权衡。I²C 等开漏总线还需根据总线电容和速率计算上升时间。</p>"},{"id":"hardware-1.11","bankId":"hardware","number":"1.11","title":"什么是阻抗匹配？什么时候必须考虑？","stars":4,"section":"1. 电路基础","answerHtml":"<p>当互连的传播延时相对信号上升时间不可忽略时，走线应按传输线处理，通过源端、端接或差分阻抗控制减少反射。不能只依据时钟频率判断，高速边沿的低频信号也可能需要。</p>"},{"id":"hardware-1.12","bankId":"hardware","number":"1.12","title":"什么是谐振？串联和并联谐振有何特点？","stars":3,"section":"1. 电路基础","answerHtml":"<p>理想 LC 谐振频率 <code>f0 = 1/(2π√LC)</code>。串联谐振阻抗最低，并联谐振阻抗最高；实际品质因数和损耗由寄生电阻决定。</p>\n<p>---</p>"},{"id":"hardware-2.1","bankId":"hardware","number":"2.1","title":"选电阻要看哪些参数？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>阻值、精度、额定功率、温漂、最大工作电压、封装、脉冲承受能力和噪声。功率应按最坏电压/电流计算并留降额余量。</p>"},{"id":"hardware-2.2","bankId":"hardware","number":"2.2","title":"电阻额定功率如何计算与降额？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>使用 <code>P=I²R=V²/R=VI</code>。额定功率是在规定环境温度和散热条件下给出，高温时需要按曲线降额；浪涌场景还要看脉冲能量，不能只看平均功率。</p>"},{"id":"hardware-2.3","bankId":"hardware","number":"2.3","title":"0Ω 电阻有什么用途？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>配置选择、跨接、调试隔离、预留电流测量位置、单点连接或兼容不同版本。它并非真正零阻抗，也有额定电流和寄生电感。</p>"},{"id":"hardware-2.4","bankId":"hardware","number":"2.4","title":"选电容要看哪些参数？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>容量、耐压、介质、容差、温度范围、ESR/ESL、纹波电流、漏电和寿命。MLCC 还要特别关注直流偏压导致的有效容量下降。</p>"},{"id":"hardware-2.5","bankId":"hardware","number":"2.5","title":"X7R、X5R、C0G/NP0 有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>C0G/NP0 稳定性好、损耗低、容量较小，适合精密和高频；X7R/X5R 容量大但随偏压、温度和时间变化。X7R 温度上限通常高于 X5R，具体以规格书为准。</p>"},{"id":"hardware-2.6","bankId":"hardware","number":"2.6","title":"为什么去耦常用 0.1 μF？所有芯片都固定这样吗？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>0.1 μF 是常见经验值，在一定频段提供局部瞬态电流，但不是万能值。应依据芯片手册、电源阻抗目标、封装寄生和频段组合不同容量，并把小电容尽量靠近电源引脚。</p>"},{"id":"hardware-2.7","bankId":"hardware","number":"2.7","title":"旁路、去耦和储能电容有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>术语常有重叠：去耦/旁路电容为高频电流提供就近回路、降低电源噪声；储能/大容量电容应对较低频负载变化和输入跌落。布局和回路面积往往比名义容量更关键。</p>"},{"id":"hardware-2.8","bankId":"hardware","number":"2.8","title":"电解电容和陶瓷电容如何选择？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>电解容量大、适合低频储能但有极性、ESR 和寿命问题；陶瓷 ESR/ESL 小、适合高频但容量随偏压下降，过低 ESR 也可能影响某些稳压器稳定性。</p>"},{"id":"hardware-2.9","bankId":"hardware","number":"2.9","title":"选电感要看哪些参数？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>电感量、容差、饱和电流、温升电流、DCR、损耗、屏蔽结构和自谐振频率。开关电源中不能只看电感量，必须同时验证峰值电流和温升。</p>"},{"id":"hardware-2.10","bankId":"hardware","number":"2.10","title":"磁珠和电感有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>磁珠主要在高频呈损耗性阻抗，把噪声能量转为热；电感主要储能。磁珠选型要看阻抗曲线、直流偏置和额定电流，不能只看“100 MHz 时 600Ω”。</p>"},{"id":"hardware-2.11","bankId":"hardware","number":"2.11","title":"普通二极管、肖特基和稳压二极管如何区分？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>普通二极管用于整流/钳位；肖特基正向压降低、恢复快但漏电较大、耐压通常较低；稳压二极管在反向击穿区稳压或钳位，需要限流并校核功耗。</p>"},{"id":"hardware-2.12","bankId":"hardware","number":"2.12","title":"TVS 与稳压二极管有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>TVS 针对短时高能瞬态，强调浪涌功率、响应和钳位电压；普通稳压管多用于稳压或低能量钳位。接口防护要核对工作电压、反向关断电压、击穿与钳位电压。</p>"},{"id":"hardware-2.13","bankId":"hardware","number":"2.13","title":"二极管反向恢复是什么？","stars":3,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>二极管从导通切换到反向截止时需清除存储电荷，短时间产生反向电流。高频开关电路中会增加损耗和 EMI，因此常用快恢复或肖特基器件。</p>"},{"id":"hardware-2.14","bankId":"hardware","number":"2.14","title":"LED 限流电阻如何计算？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p><code>R = (Vsupply - Vf) / Iled</code>，再校核电阻功率和最坏参数。Vf 随颜色、温度和电流变化，应留余量；多个 LED 并联不能简单共用一个电阻而不考虑电流均分。</p>\n<p>---</p>"},{"id":"hardware-3.1","bankId":"hardware","number":"3.1","title":"BJT 的三个工作区是什么？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>截止区、放大区、饱和区。做开关时工作在截止和饱和，基极电流要足以保证饱和；做放大时需设置合适静态工作点。</p>"},{"id":"hardware-3.2","bankId":"hardware","number":"3.2","title":"NPN 三极管驱动负载如何计算基极电阻？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>先由负载电流选择强迫放大倍数，估算 <code>Ib</code>，再用 <code>(Vdrive - Vbe)/Ib</code> 计算基极电阻并校核 GPIO 驱动能力。不能直接用数据手册最大 β 作为饱和设计依据。</p>"},{"id":"hardware-3.3","bankId":"hardware","number":"3.3","title":"MOSFET 的栅极是否消耗电流？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>稳态理想上几乎不消耗直流电流，但切换时需对栅极电荷充放电，产生瞬态驱动电流和开关损耗。高频或大 MOS 管需要专用栅极驱动器。</p>"},{"id":"hardware-3.4","bankId":"hardware","number":"3.4","title":"MOSFET 的 `Vgs(th)` 是完全导通电压吗？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>不是。阈值电压只表示在很小测试电流下刚开始导通。应查看目标 <code>Vgs</code> 下的 <code>Rds(on)</code>，并考虑温度与批次；3.3 V GPIO 要选择真正适合低栅压驱动的器件。</p>"},{"id":"hardware-3.5","bankId":"hardware","number":"3.5","title":"选 MOSFET 要看哪些参数？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p><code>Vds</code>、连续/脉冲电流、目标 <code>Vgs</code> 下的 <code>Rds(on)</code>、总栅电荷 Qg、功耗与热阻、SOA、体二极管、雪崩能力和封装。额定电流常受理想散热条件限制，不能直接照抄。</p>"},{"id":"hardware-3.6","bankId":"hardware","number":"3.6","title":"MOSFET 导通损耗和开关损耗如何估算？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>导通损耗近似 <code>I²Rds(on)</code>；开关损耗与电压、电流、开关时间和频率相关，粗略可按每次电压电流重叠面积估计。还要计入栅极驱动和体二极管损耗。</p>"},{"id":"hardware-3.7","bankId":"hardware","number":"3.7","title":"高边开关和低边开关区别？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>低边开关器件位于负载与地之间，驱动简单但负载地不再固定；高边开关位于电源与负载之间，便于保持共地，但 N-MOS 常需升压驱动，或使用 P-MOS/专用负载开关。</p>"},{"id":"hardware-3.8","bankId":"hardware","number":"3.8","title":"P-MOS 与 N-MOS 如何选择？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>同等级下 N-MOS 通常导通电阻更低、性能更好；P-MOS 高边驱动简单但损耗通常更大。根据电压、电流、效率和驱动复杂度选择。</p>"},{"id":"hardware-3.9","bankId":"hardware","number":"3.9","title":"栅极串联电阻和下拉电阻分别做什么？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>串联电阻限制栅极充放电峰值、抑制振铃并控制开关速度；下拉/上拉确保控制端悬空或上电时 MOSFET 保持确定状态。阻值要在 EMI 与开关损耗间权衡。</p>"},{"id":"hardware-3.10","bankId":"hardware","number":"3.10","title":"驱动继电器、电机或电磁阀为什么要续流？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>感性负载关断时电流不能突变，会产生高压。续流二极管、TVS 或 RCD 为电流提供路径并限制电压。普通二极管钳位低但释放慢，TVS 钳位高而释放快。</p>"},{"id":"hardware-3.11","bankId":"hardware","number":"3.11","title":"MOSFET 为什么会发热？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>导通电阻损耗、开关过慢、驱动电压不足、高频切换、线性区工作、散热不足、浪涌或负载过流。要用示波器同时观察 Vgs、Vds 和电流，并测温升。</p>"},{"id":"hardware-3.12","bankId":"hardware","number":"3.12","title":"什么是米勒平台？","stars":3,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>MOSFET 切换过程中，栅漏电容充放电使 Vgs 暂时停留在平台，期间 Vds 主要变化。平台长度与驱动电流影响开关时间和损耗。</p>"},{"id":"hardware-3.13","bankId":"hardware","number":"3.13","title":"H 桥的直通是什么？如何避免？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>上下桥臂同时导通形成电源到地的低阻通路。通过死区时间、互锁驱动、合理栅极电阻和硬件保护避免，同时检查米勒效应导致的误导通。</p>\n<p>---</p>"},{"id":"hardware-4.1","bankId":"hardware","number":"4.1","title":"理想运放有哪些假设？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>开环增益无穷大、输入阻抗无穷大、输出阻抗为零、带宽无穷大、失调为零。负反馈且未饱和时可用“虚短、虚断”分析，但这不是任何情况下都成立。</p>"},{"id":"hardware-4.2","bankId":"hardware","number":"4.2","title":"反相和同相放大器增益是多少？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>反相：<code>Av = -Rf/Rin</code>；同相：<code>Av = 1 + Rf/Rg</code>。还要检查输入共模范围、输出摆幅、带宽、稳定性和供电。</p>"},{"id":"hardware-4.3","bankId":"hardware","number":"4.3","title":"什么是虚短和虚断？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>虚短：在负反馈线性工作时两输入端电压近似相等；虚断：输入电流近似为零。运放饱和、开环比较、超出共模范围或不稳定振荡时不能直接套用。</p>"},{"id":"hardware-4.4","bankId":"hardware","number":"4.4","title":"运放选型看哪些参数？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>供电范围、输入共模范围、输出摆幅、输入失调和漂移、偏置电流、噪声、增益带宽积、压摆率、稳定增益、输入输出是否轨到轨、负载能力和封装。</p>"},{"id":"hardware-4.5","bankId":"hardware","number":"4.5","title":"增益带宽积和压摆率分别限制什么？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>增益带宽积限制小信号闭环带宽；压摆率限制大信号电压变化速度。输出正弦波不失真的最低压摆率约为 <code>2πfVpeak</code>。</p>"},{"id":"hardware-4.6","bankId":"hardware","number":"4.6","title":"轨到轨输入/输出意味着真的能到电源轨吗？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>不一定。输入共模和输出摆幅通常仍与负载、电源和温度有关，规格书会给出距离电源轨的余量。必须按实际供电和输出电流核对。</p>"},{"id":"hardware-4.7","bankId":"hardware","number":"4.7","title":"运放为什么会振荡？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>相位裕量不足、容性负载、反馈布局过长、电源去耦不良、增益低于稳定要求等。用示波器观察振铃/振荡，按手册增加隔离电阻、补偿网络或更换合适运放。</p>"},{"id":"hardware-4.8","bankId":"hardware","number":"4.8","title":"运放和比较器能互换吗？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>通常不建议。比较器为开环快速翻转设计，输出可能为开漏；运放为负反馈线性工作设计，过驱恢复可能慢。按目标功能使用对应器件。</p>"},{"id":"hardware-4.9","bankId":"hardware","number":"4.9","title":"比较器为什么需要迟滞？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>输入在阈值附近有噪声或变化缓慢时，输出可能反复翻转。正反馈形成两个阈值，提供迟滞，提高抗噪能力；要会根据电阻网络计算上下阈值。</p>"},{"id":"hardware-4.10","bankId":"hardware","number":"4.10","title":"单电源系统如何测双极性信号？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>可将信号偏置到中点参考电压，再放大/滤波；或使用支持负输入的前端/双电源。中点参考必须具有足够驱动能力和低噪声，不能只用高阻分压直接带复杂负载。</p>"},{"id":"hardware-4.11","bankId":"hardware","number":"4.11","title":"差分放大器和仪表放大器适合什么场景？","stars":3,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>用于提取两个输入之差并抑制共模。仪表放大器通常输入阻抗高、CMRR 高、增益易设置，适合传感器小信号；电阻匹配和输入共模范围很关键。</p>"},{"id":"hardware-4.12","bankId":"hardware","number":"4.12","title":"ADC 前端为什么常加 RC？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>限制带宽、抗混叠、降低高频噪声并为采样瞬间提供局部电荷。但电阻过大会影响 ADC 采样保持电容充电，需结合采样时间和驱动能力设计。</p>"},{"id":"hardware-4.13","bankId":"hardware","number":"4.13","title":"什么是共模抑制比 CMRR？","stars":3,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>衡量差分放大器抑制共模信号的能力，通常以 dB 表示。实际 CMRR 会受电阻匹配、频率、布局和输入范围影响。</p>"},{"id":"hardware-4.14","bankId":"hardware","number":"4.14","title":"模拟信号出现 50/60 Hz 干扰如何排查？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>检查接地回路、屏蔽、探头接法、输入阻抗、线缆和电源耦合；使用差分测量、双绞线、合理单点连接和共模抑制；滤波应建立在找到耦合路径之后。</p>\n<p>---</p>"},{"id":"hardware-5.1","bankId":"hardware","number":"5.1","title":"组合逻辑和时序逻辑区别？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>组合逻辑输出只与当前输入有关；时序逻辑还与历史状态有关，通常由触发器和时钟保存状态。</p>"},{"id":"hardware-5.2","bankId":"hardware","number":"5.2","title":"建立时间、保持时间是什么？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>数据在采样时钟边沿前必须稳定的最短时间称建立时间，边沿后需继续稳定的最短时间称保持时间。违反可能导致亚稳态或采样错误。</p>"},{"id":"hardware-5.3","bankId":"hardware","number":"5.3","title":"什么是亚稳态？如何降低风险？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>异步信号在时钟采样窗口附近变化时，触发器输出可能暂时处于不确定状态。单比特跨时钟域常用两级同步器降低传播概率；多位总线需握手、异步 FIFO 或编码协议。</p>"},{"id":"hardware-5.4","bankId":"hardware","number":"5.4","title":"TTL 与 CMOS 电平有什么区别？","stars":3,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>输入阈值、输出电平和驱动能力不同。接口兼容不能只看供电电压，要核对 <code>VIH/VIL/VOH/VOL</code>、输入容限和电流。</p>"},{"id":"hardware-5.5","bankId":"hardware","number":"5.5","title":"3.3 V 与 5 V 系统如何电平转换？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>先确认器件是否 5 V 容忍；单向信号可用分压、缓冲器或晶体管，双向开漏信号可用 MOS 管电平转换，推挽高速总线用专用转换芯片。分压不适合所有高速或双向场景。</p>"},{"id":"hardware-5.6","bankId":"hardware","number":"5.6","title":"开漏与推挽输出区别？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>推挽可主动拉高和拉低，速度快；开漏只能主动拉低，需上拉，可实现多设备线与、双向总线和电平转换。开漏上升沿由上拉与总线电容决定。</p>"},{"id":"hardware-5.7","bankId":"hardware","number":"5.7","title":"施密特触发输入有什么作用？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>具有不同的上升和下降阈值，可抑制慢边沿和噪声引起的多次翻转，适合按键、长线或波形整形。</p>"},{"id":"hardware-5.8","bankId":"hardware","number":"5.8","title":"为什么悬空 CMOS 输入危险？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>电平不确定，容易受干扰并可能使上下管同时部分导通，增加功耗。未使用输入应按手册上拉、下拉或配置为确定状态。</p>"},{"id":"hardware-5.9","bankId":"hardware","number":"5.9","title":"时钟信号为什么特别关注完整性？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>时钟边沿决定系统采样，反射、过冲、串扰或慢边沿会造成重复触发、抖动和时序裕量下降。需控制回流路径、阻抗、端接和远离噪声源。</p>"},{"id":"hardware-5.10","bankId":"hardware","number":"5.10","title":"GPIO 驱动能力怎么看？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>查看单引脚和端口总电流限制，以及规定电流下的 <code>VOH/VOL</code>，不能只看“最大 20 mA”。大负载应加驱动器，且同时考虑封装总功耗。</p>"},{"id":"hardware-5.11","bankId":"hardware","number":"5.11","title":"按键硬件消抖如何设计？","stars":3,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>RC 滤波配合施密特输入，或专用消抖芯片。RC 常数要兼顾抖动持续时间和响应，且检查上电状态与 GPIO 阈值。</p>"},{"id":"hardware-5.12","bankId":"hardware","number":"5.12","title":"晶振不起振可能是什么原因？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>负载电容不合适、布局过长/不对称、焊接问题、器件参数或驱动能力不匹配、探头负载过大、供电/地噪声、配置错误。测量应使用低电容探头或测时钟输出，避免普通探头改变振荡条件。</p>"},{"id":"hardware-5.13","bankId":"hardware","number":"5.13","title":"晶体负载电容如何估算？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>近似 <code>CL = (C1×C2)/(C1+C2) + Cstray</code>；若两侧相等，则每只外部电容通常约为 <code>2(CL-Cstray)</code>。实际需结合芯片内部电容、板级寄生和频偏调试。</p>\n<p>---</p>"},{"id":"hardware-6.1","bankId":"hardware","number":"6.1","title":"MCU 最小系统包括什么？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>稳定电源与每组去耦、复位、时钟或内部时钟配置、启动模式配置、下载调试接口，以及芯片要求的模拟电源/参考和电源时序。还要预留测试点。</p>"},{"id":"hardware-6.2","bankId":"hardware","number":"6.2","title":"MCU 每个 VDD 附近都需要去耦吗？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>通常需要按手册为每组电源引脚就近配置去耦，电容到电源脚和地回路要短而小。不能因为原理图上并联等效就把电容集中放在远处。</p>"},{"id":"hardware-6.3","bankId":"hardware","number":"6.3","title":"复位电路如何设计？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>满足复位低/高电平时间、上电电源爬升和噪声要求；可使用内部 POR/BOR、RC、复位监控器和按键。RC 方案简单，但对慢上电、快速掉电重启和阈值容差可能不可靠。</p>"},{"id":"hardware-6.4","bankId":"hardware","number":"6.4","title":"BOOT 引脚如何处理？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>通过上拉/下拉设置默认启动源，并预留跳帽、测试点或按键进入系统 Bootloader；阻值和状态需满足采样时刻要求，不能悬空。</p>"},{"id":"hardware-6.5","bankId":"hardware","number":"6.5","title":"SWD/JTAG 接口需要注意什么？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>信号、电源参考、地、复位和连接器定义；走线短、参考连续；避免外部电路强驱动复用引脚；预留串联电阻或测试点；确认下载器电平与目标板一致。</p>"},{"id":"hardware-6.6","bankId":"hardware","number":"6.6","title":"UART、I²C、SPI 的硬件差异是什么？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>UART 异步点对点、线少；I²C 两线开漏、需上拉、支持寻址多设备；SPI 同步全双工、速度高但片选和引脚多。选择还要考虑距离、抗干扰、吞吐和电平。</p>"},{"id":"hardware-6.7","bankId":"hardware","number":"6.7","title":"I²C 上拉阻值如何确定？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>上限由总线电容和允许上升时间决定，下限由器件低电平灌电流及 <code>VOL</code> 决定。在两者之间选择，并验证最坏温度、电压和并联上拉后的等效阻值。</p>"},{"id":"hardware-6.8","bankId":"hardware","number":"6.8","title":"SPI 串联电阻放在哪里？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>源端串联端接应靠近驱动端放置，以减缓边沿并吸收反射；时钟通常优先考虑。双向数据线的驱动端会变化，需结合拓扑和速率处理。</p>"},{"id":"hardware-6.9","bankId":"hardware","number":"6.9","title":"UART 外接接口为什么要确认电平标准？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>MCU UART 通常是 CMOS/TTL 电平，不能直接连接 RS-232；RS-485 也需要收发器。必须确认电压、极性、共地、连接器定义和 ESD 防护。</p>"},{"id":"hardware-6.10","bankId":"hardware","number":"6.10","title":"RS-485 硬件设计要点？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>差分收发器、总线两端终端、适当偏置、菊链拓扑、短支线、方向控制、共模范围、隔离需求和 TVS/共模电感等保护。不能每个节点都并 120Ω。</p>"},{"id":"hardware-6.11","bankId":"hardware","number":"6.11","title":"CAN 硬件设计要点？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>收发器供电与待机控制、两端 120Ω 终端、差分成对布线、短支线、共模和 ESD 防护、连接器与地参考；汽车环境还要关注浪涌、反接与共模扼流圈选型。</p>"},{"id":"hardware-6.12","bankId":"hardware","number":"6.12","title":"USB 2.0 硬件设计注意什么？","stars":3,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>90Ω 差分阻抗、等长与连续参考面、少过孔、连接器附近 ESD、VBUS 检测/供电规则、器件端串联电阻按参考设计、避免在差分对下方切割地平面。</p>"},{"id":"hardware-6.13","bankId":"hardware","number":"6.13","title":"ADC 参考电压为什么重要？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>ADC 结果与参考电压直接相关。参考源的噪声、精度、温漂和负载稳定性会影响测量；需合理去耦、模拟地回路和源阻抗，并可通过校准改善系统误差。</p>"},{"id":"hardware-6.14","bankId":"hardware","number":"6.14","title":"未使用 MCU 引脚如何处理？","stars":3,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>按芯片手册设置为模拟输入、带上下拉的输入或其他低功耗安全状态；避免悬空和误驱动。特殊引脚不能一概而论。</p>\n<p>---</p>"},{"id":"hardware-7.1","bankId":"hardware","number":"7.1","title":"LDO 和 Buck 如何选择？","stars":5,"section":"7. 电源设计","answerHtml":"<p>LDO 简单、噪声低，但效率约为 <code>Vout/Vin</code>，压差大发热明显；Buck 效率高、适合大压差/大电流，但纹波、EMI 和布局更复杂。依据压差、电流、噪声、热与成本综合选择。</p>"},{"id":"hardware-7.2","bankId":"hardware","number":"7.2","title":"LDO 的压差、静态电流和 PSRR 是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>压差是维持稳压所需最小输入输出差；静态电流影响轻载功耗；PSRR 表示对输入纹波的抑制能力，随频率和输出电容变化。选型还要看稳定性要求和瞬态响应。</p>"},{"id":"hardware-7.3","bankId":"hardware","number":"7.3","title":"LDO 发热如何计算？","stars":5,"section":"7. 电源设计","answerHtml":"<p>近似 <code>P=(Vin-Vout)×Iout + Vin×Iq</code>。结温估算 <code>Tj≈Ta+P×θJA</code>，实际还受铜皮、封装、气流影响。必须在最高输入、最大负载、最高环境温度下校核。</p>"},{"id":"hardware-7.4","bankId":"hardware","number":"7.4","title":"Buck 的基本工作原理是什么？","stars":5,"section":"7. 电源设计","answerHtml":"<p>开关管周期性把输入能量传给电感，续流路径在关断期间维持电感电流，LC 滤波得到较低输出。占空比理想近似 <code>D≈Vout/Vin</code>，实际受损耗和控制方式影响。</p>"},{"id":"hardware-7.5","bankId":"hardware","number":"7.5","title":"Boost 的基本工作原理是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>开关闭合时电感储能，关断时电感电压与输入叠加向输出供能，从而升压。输出关断、启动浪涌、开关管电压应力和二极管/同步管选型需特别关注。</p>"},{"id":"hardware-7.6","bankId":"hardware","number":"7.6","title":"Buck 电感值如何影响纹波？","stars":4,"section":"7. 电源设计","answerHtml":"<p>电感越大，电流纹波通常越小，但体积、DCR 和动态响应可能变差。按输入输出、电流、频率和目标纹波计算，并确保峰值电流低于饱和电流且温升可接受。</p>"},{"id":"hardware-7.7","bankId":"hardware","number":"7.7","title":"输出电容如何影响稳压器？","stars":4,"section":"7. 电源设计","answerHtml":"<p>容量与 ESR 影响纹波、负载瞬态和环路稳定性。必须满足手册允许范围；不能简单认为越大越好，某些 LDO 需要特定 ESR，开关电源还需考虑纹波电流额定值。</p>"},{"id":"hardware-7.8","bankId":"hardware","number":"7.8","title":"什么是开关电源的热回路？","stars":5,"section":"7. 电源设计","answerHtml":"<p>包含快速脉冲电流的高 di/dt 回路，如输入电容—高侧开关—低侧开关/二极管回路。布局应使其面积最小，输入高频电容紧靠功率器件，开关节点铜皮不过度扩大。</p>"},{"id":"hardware-7.9","bankId":"hardware","number":"7.9","title":"开关节点 SW 为什么要小？","stars":5,"section":"7. 电源设计","answerHtml":"<p>SW 节点具有高 dv/dt，面积大时会通过寄生电容产生更强辐射和耦合噪声。但也要兼顾电流和散热，按芯片参考布局平衡。</p>"},{"id":"hardware-7.10","bankId":"hardware","number":"7.10","title":"电源纹波怎么测才正确？","stars":5,"section":"7. 电源设计","answerHtml":"<p>使用短地弹簧或同轴方式，探头靠近输出电容两端，开启合适带宽限制，避免长鳄鱼地线形成天线；同时区分真实纹波、探头拾噪和周期尖峰。</p>"},{"id":"hardware-7.11","bankId":"hardware","number":"7.11","title":"负载瞬态是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>负载电流快速变化导致输出电压偏移，恢复由输出电容、环路带宽和补偿决定。用电子负载阶跃测试上冲、下冲和恢复时间。</p>"},{"id":"hardware-7.12","bankId":"hardware","number":"7.12","title":"电源上电时序为什么重要？","stars":4,"section":"7. 电源设计","answerHtml":"<p>多电源芯片可能要求电压先后顺序、斜率和复位释放时机；违反可能锁死、闩锁、反向供电或损坏。使用 EN、PG、时序芯片或 MCU 控制，但 MCU 自身上电路径要可闭环。</p>"},{"id":"hardware-7.13","bankId":"hardware","number":"7.13","title":"什么是反向灌电？","stars":5,"section":"7. 电源设计","answerHtml":"<p>未供电器件通过信号引脚保护二极管或电源路径被其他已上电电路供电，导致异常、漏电甚至损坏。通过时序控制、串阻、隔离开关、支持掉电高阻的电平转换器等避免。</p>"},{"id":"hardware-7.14","bankId":"hardware","number":"7.14","title":"电源入口常见保护有哪些？","stars":5,"section":"7. 电源设计","answerHtml":"<p>保险丝/PTC、反接保护、TVS 浪涌钳位、输入滤波、过压/欠压、限流和浪涌电流控制。保护器件顺序要结合故障能量与失效模式设计。</p>"},{"id":"hardware-7.15","bankId":"hardware","number":"7.15","title":"反接保护如何实现？","stars":4,"section":"7. 电源设计","answerHtml":"<p>串联二极管简单但有压降；肖特基压降低；P-MOS/N-MOS 理想二极管方案压降低但需正确考虑体二极管方向、栅压限制和浪涌；高要求可用专用控制器。</p>"},{"id":"hardware-7.16","bankId":"hardware","number":"7.16","title":"电源效率如何测？","stars":4,"section":"7. 电源设计","answerHtml":"<p>在稳态下同时测输入、输出电压电流，<code>η=Pout/Pin</code>；使用四线测量或减小线损误差，并覆盖输入范围、轻载到满载和温度。示波器测动态开关损耗时注意探头延迟校准。</p>\n<p>---</p>"},{"id":"hardware-8.1","bankId":"hardware","number":"8.1","title":"PCB 设计前需要定义哪些约束？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>板框、层叠、铜厚、最小线宽线距、孔径、阻抗、差分规则、爬电间距、关键网络、电流能力、器件高度、接口位置和制造能力。</p>"},{"id":"hardware-8.2","bankId":"hardware","number":"8.2","title":"原理图和 PCB 评审重点是什么？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>电源域和时序、器件方向/封装/引脚、未连接网络、上拉下拉、保护、测试点、回流路径、关键布局、阻抗与差分、DRC/ERC、BOM 可得性及装配可制造性。</p>"},{"id":"hardware-8.3","bankId":"hardware","number":"8.3","title":"两层板和四层板怎么选？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>四层板可提供连续参考平面、更短回流路径、更好的电源完整性和 EMI 表现；两层板成本低但复杂高速板更难保证地平面连续。依据密度、边沿速度、EMC 和成本选择。</p>"},{"id":"hardware-8.4","bankId":"hardware","number":"8.4","title":"为什么要关注信号回流路径？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>电流必须形成闭合回路。高频回流倾向沿参考平面、紧贴信号路径流动；平面切割会迫使回流绕行，增大环路面积、串扰和辐射。</p>"},{"id":"hardware-8.5","bankId":"hardware","number":"8.5","title":"去耦电容如何布局？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>靠近对应电源引脚，电源脚—电容—地的高频回路最小；过孔靠近焊盘，避免先经过长线再到电容。大容量电容可相对远些，但仍应服务对应电源区域。</p>"},{"id":"hardware-8.6","bankId":"hardware","number":"8.6","title":"模拟地和数字地要不要分割？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>不能机械分割。重点是控制电流路径和功能分区，避免数字回流穿过敏感模拟区。低速混合信号板常保持完整地平面并合理布局；若确需分区连接，应有清晰的回流和系统分析。</p>"},{"id":"hardware-8.7","bankId":"hardware","number":"8.7","title":"电源线多宽才够？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>取决于铜厚、电流、允许温升、线长、层位置和过孔。使用 IPC 计算或仿真并留余量；高电流路径还要核算连接器、过孔、铜皮颈缩和焊盘。</p>"},{"id":"hardware-8.8","bankId":"hardware","number":"8.8","title":"差分对为什么要等长？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>减小两线到达时间差，保持差分关系和共模抑制。但差分阻抗、耦合、参考连续和整体长度通常同样重要，不要为极端等长制造大量蛇形和串扰。</p>"},{"id":"hardware-8.9","bankId":"hardware","number":"8.9","title":"蛇形等长有哪些风险？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>线段间耦合造成实际延时不如预期，并增加串扰和损耗。要保持足够间距、减少不必要弯折，并按接口时序预算设置等长容差。</p>"},{"id":"hardware-8.10","bankId":"hardware","number":"8.10","title":"过孔有什么寄生影响？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>过孔带来寄生电感、电容和阻抗不连续；高速差分换层时需就近放地回流过孔。高电流过孔要并联多个并核算孔铜能力。</p>"},{"id":"hardware-8.11","bankId":"hardware","number":"8.11","title":"直角走线一定不能用吗？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>在多数普通数字板中，直角并非决定性问题；45°或圆弧更利于工艺、一致性和高频阻抗控制。真正应优先关注回流、参考面、串扰和阻抗不连续。</p>"},{"id":"hardware-8.12","bankId":"hardware","number":"8.12","title":"晶振布局有哪些要求？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>晶体和负载电容靠近芯片，走线短、对称，回路小，远离高速/开关节点；下方参考按芯片建议处理，避免其他信号穿越；外壳接地方式按参考设计。</p>"},{"id":"hardware-8.13","bankId":"hardware","number":"8.13","title":"开关电源 PCB 布局优先级是什么？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>先放功率器件和高频输入电容，最小化热回路；再处理 SW、电感、输出电容和反馈；反馈从干净点采样、远离 SW；最后铺铜和热设计。优先照芯片数据手册推荐布局。</p>"},{"id":"hardware-8.14","bankId":"hardware","number":"8.14","title":"敏感模拟信号如何布线？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>远离时钟、SW、马达和大电流；保持参考连续和回路小；必要时差分、屏蔽/护环、RC 滤波；避免与噪声线长距离平行；传感器回流不要与功率回流共用狭窄路径。</p>"},{"id":"hardware-8.15","bankId":"hardware","number":"8.15","title":"连接器附近为什么放 ESD 器件？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>让瞬态电流在进入板内前就被钳位并通过短而低阻抗路径泄放。保护器件越远，冲击电流越可能沿长线耦合到内部电路。</p>"},{"id":"hardware-8.16","bankId":"hardware","number":"8.16","title":"什么是爬电距离和电气间隙？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>电气间隙是空气中的最短距离，爬电距离是沿绝缘表面的最短路径。要求取决于工作电压、污染等级、材料组和安规标准，高压设计必须按适用标准计算。</p>"},{"id":"hardware-8.17","bankId":"hardware","number":"8.17","title":"PCB 热设计有哪些方法？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>增大铜面积、热过孔、合理层叠、散热片和气流；把热源与敏感器件分开；依据功耗和热阻估算后用热像仪/热电偶验证。不能只凭“摸起来不热”。</p>\n<p>---</p>"},{"id":"hardware-9.1","bankId":"hardware","number":"9.1","title":"什么是反射？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>信号遇到阻抗不连续时部分能量被反射，造成过冲、下冲、振铃或多次跨越阈值。通过控制阻抗、连续参考和适当端接改善。</p>"},{"id":"hardware-9.2","bankId":"hardware","number":"9.2","title":"串联端接和并联端接如何选择？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>源端串联端接功耗低，适合点对点单向连接；接收端并联端接匹配效果直接但有直流功耗。实际还可使用戴维南、AC 端接等，依据拓扑和接口规范选择。</p>"},{"id":"hardware-9.3","bankId":"hardware","number":"9.3","title":"什么是串扰？如何降低？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>相邻走线通过电容和电感耦合。降低方法：增大间距、缩短平行长度、保持参考平面、调整层间距离、降低不必要边沿速度、敏感线与噪声线分层或正交。</p>"},{"id":"hardware-9.4","bankId":"hardware","number":"9.4","title":"为什么信号频率不高也可能有 SI 问题？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>决定传输线效应的是上升/下降时间，而不仅是重复频率。低频方波若边沿很快，仍包含丰富高频分量并产生反射与串扰。</p>"},{"id":"hardware-9.5","bankId":"hardware","number":"9.5","title":"EMI、EMS、EMC 分别是什么？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>EMI 是电磁干扰/发射，EMS 是抗扰度，EMC 是设备在环境中既不过度干扰别人、也能承受规定干扰而正常工作的能力。</p>"},{"id":"hardware-9.6","bankId":"hardware","number":"9.6","title":"传导发射和辐射发射区别？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>传导发射通过电源线、信号线传播；辐射发射通过空间耦合。两者可互相转化，线缆常成为共模天线。</p>"},{"id":"hardware-9.7","bankId":"hardware","number":"9.7","title":"共模干扰和差模干扰区别？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>差模电流在一对导体间反向流动；共模电流相对参考地同向流动，并通过寄生路径返回。共模电流虽小也可能因大环路/线缆产生强辐射。</p>"},{"id":"hardware-9.8","bankId":"hardware","number":"9.8","title":"共模电感与差模电感有什么区别？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>共模电感对同向共模电流呈高阻，而对正常差模电流磁通多相互抵消；差模电感直接抑制线路中的差模变化。选型要看工作电流、阻抗曲线、漏感和饱和。</p>"},{"id":"hardware-9.9","bankId":"hardware","number":"9.9","title":"ESD、EFT、Surge 有什么区别？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>ESD 上升快、能量相对较小，模拟人体/物体静电；EFT 是快速脉冲群；Surge 上升较慢但能量更大，模拟雷击/开关浪涌。不同测试需不同防护和布局策略。</p>"},{"id":"hardware-9.10","bankId":"hardware","number":"9.10","title":"TVS 如何选型？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>工作电压高于正常最大电压；击穿与钳位电压低于被保护器件承受能力；峰值功率满足测试；结电容适合信号速率；单向/双向和封装合适。还需核对在实际脉冲电流下的钳位电压。</p>"},{"id":"hardware-9.11","bankId":"hardware","number":"9.11","title":"为什么 ESD 保护布局比器件参数还重要？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>ESD 电流边沿极快，走线和过孔寄生电感会产生很高压降。TVS 要靠近入口，泄放路径短、宽、少过孔，避免保护后的线与未保护线再次耦合。</p>"},{"id":"hardware-9.12","bankId":"hardware","number":"9.12","title":"滤波器为什么有时反而变差？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>器件寄生、布局、源负载阻抗和谐振可能让某频段放大；滤波器必须与实际阻抗和频谱匹配，并通过测量验证，而不是盲目堆磁珠和电容。</p>"},{"id":"hardware-9.13","bankId":"hardware","number":"9.13","title":"如何降低开关电源 EMI？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>缩小热回路和 SW 面积、优化栅极速度、选择合适频率/扩频器件、输入输出滤波、屏蔽电感、RC snubber、良好接地与回流；先用近场探头和示波器定位主频及振铃源。</p>"},{"id":"hardware-9.14","bankId":"hardware","number":"9.14","title":"什么是地弹和电源弹跳？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>多个输出同时快速切换时，封装和回路电感上的 <code>L·di/dt</code> 产生瞬态电压，使局部地或电源参考偏移。通过去耦、完整平面、减小回路和控制边沿降低。</p>"},{"id":"hardware-9.15","bankId":"hardware","number":"9.15","title":"屏蔽层应该单端接地还是双端接地？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>没有一刀切答案。低频时单端可减少地环路，高频时双端/多点低阻连接通常屏蔽更有效；应结合频率、系统接地、共模电流和安规设计。</p>\n<p>---</p>"},{"id":"hardware-10.1","bankId":"hardware","number":"10.1","title":"万用表能测什么？有哪些限制？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>电压、电流、电阻、通断、二极管等；但带宽低，无法观察瞬态、纹波和高速波形。测电流必须串联并注意表内保险丝和档位，不能把电流档直接并到电源上。</p>"},{"id":"hardware-10.2","bankId":"hardware","number":"10.2","title":"示波器带宽和采样率如何选择？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>为了保留边沿，带宽通常需明显高于目标最高有效频率；采样率需满足波形重建和存储时间。探头带宽、输入电容、接地方式与示波器同样重要。</p>"},{"id":"hardware-10.3","bankId":"hardware","number":"10.3","title":"10× 探头为什么常用？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>相比 1× 探头输入电容更小、带宽更高、对电路扰动更小，但信号衰减十倍。使用前应补偿校准，并确认示波器通道衰减设置一致。</p>"},{"id":"hardware-10.4","bankId":"hardware","number":"10.4","title":"为什么不能用长地线测高速波形？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>长地线形成较大环路和寄生电感，会拾取噪声并产生虚假振铃。使用地弹簧、短
