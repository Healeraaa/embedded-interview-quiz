<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="嵌入式软件与硬件秋招面试题练习工具">
  <title>嵌入式面试题练习</title>
  <style>
    :root { --bg:#f4f6f8; --paper:#fffdfa; --ink:#172033; --muted:#667085; --line:#e3e7ed; --blue:#2563eb; --orange:#e76f51; --green:#16805a; --shadow:0 18px 55px rgba(30,42,70,.11); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 15% 0%,#e7efff 0,transparent 28rem),radial-gradient(circle at 100% 100%,#fff0e8 0,transparent 25rem),var(--bg); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; min-height:100vh; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:34px 0 56px; }
    header { display:flex; gap:22px; align-items:flex-end; justify-content:space-between; margin-bottom:24px; }
    .eyebrow { color:var(--blue); font-weight:800; letter-spacing:.14em; font-size:12px; }
    h1 { margin:6px 0 5px; font-size:clamp(28px,5vw,46px); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); }
    .progress-box { min-width:220px; text-align:right; }
    .progress-label { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:8px; }
    .progress-track { height:9px; border-radius:99px; background:#dfe4eb; overflow:hidden; }
    .progress-fill { height:100%; width:0; background:linear-gradient(90deg,var(--blue),#65a2ff); transition:width .25s; }
    .layout { display:grid; grid-template-columns:280px minmax(0,1fr); gap:22px; align-items:start; }
    [hidden] { display:none!important; }
    .panel,.card { background:rgba(255,253,250,.94); border:1px solid rgba(255,255,255,.8); border-radius:22px; box-shadow:var(--shadow); }
    .panel { padding:20px; position:sticky; top:18px; }
    .field { margin-bottom:17px; }
    .field label { display:block; font-size:12px; font-weight:800; color:#536077; margin:0 0 7px; }
    select,input[type="search"] { width:100%; border:1px solid var(--line); border-radius:11px; padding:10px 11px; color:var(--ink); background:white; outline:none; }
    select:focus,input:focus { border-color:#8ab0fb; box-shadow:0 0 0 3px #dce8ff; }
    .bank-tabs { display:grid; gap:8px; }
    .bank-tab { text-align:left; border:1px solid var(--line); border-radius:12px; background:#fff; padding:11px 12px; color:#465066; font-weight:700; }
    .bank-tab.active { color:#fff; border-color:transparent; background:var(--accent); }
    .summary { font-size:13px; line-height:1.7; color:var(--muted); border-top:1px solid var(--line); padding-top:14px; margin-top:4px; }
    .card { min-height:580px; padding:clamp(24px,5vw,56px); display:flex; flex-direction:column; }
    #quiz { min-height:470px; display:flex; flex:1; flex-direction:column; }
    .meta { display:flex; align-items:center; flex-wrap:wrap; gap:9px; color:var(--muted); font-size:13px; }
    .tag { padding:5px 9px; border-radius:99px; background:#edf2fa; color:#40516e; font-weight:700; }
    .stars { color:#e9a31b; letter-spacing:.04em; }
    .question { font-size:clamp(24px,3.3vw,38px); line-height:1.35; letter-spacing:-.025em; margin:28px 0; }
    .reveal { align-self:flex-start; border:0; border-radius:13px; padding:13px 20px; background:var(--ink); color:white; font-weight:800; box-shadow:0 7px 18px rgba(23,32,51,.18); }
    .answer { display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--line); font-size:16px; line-height:1.85; animation:fade .2s ease; }
    .answer.open { display:block; }
    .answer p:first-child { margin-top:0; }
    .answer code { font-family:Consolas,monospace; background:#eff2f5; border-radius:5px; padding:.12em .32em; font-size:.92em; }
    .answer pre { overflow:auto; padding:16px; color:#e7edf7; background:#172033; border-radius:12px; line-height:1.55; }
    .answer pre code { background:transparent; padding:0; }
    .answer blockquote { margin:1em 0; padding:10px 16px; border-left:4px solid #9db9ed; background:#f2f6fd; color:#44516a; }
    .answer li { margin:.35em 0; }
    .spacer { flex:1; min-height:28px; }
    .rating { display:none; margin-top:22px; gap:9px; flex-wrap:wrap; }
    .rating.open { display:flex; }
    .rate { border:1px solid var(--line); border-radius:10px; padding:9px 14px; background:white; color:#465066; }
    .rate.selected { color:white; border-color:transparent; }
    .rate[data-value="again"].selected { background:#c2413a; }
    .rate[data-value="fuzzy"].selected { background:#c48413; }
    .rate[data-value="know"].selected { background:var(--green); }
    .nav { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
    .nav button { border:1px solid var(--line); border-radius:11px; padding:10px 15px; background:white; color:var(--ink); font-weight:700; }
    .nav button:hover,.rate:hover { border-color:#aeb9ca; }
    .nav button:disabled { opacity:.4; cursor:not-allowed; }
    .position { margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
    .empty { margin:auto; text-align:center; color:var(--muted); }
    .kbd { border:1px solid #cfd5de; border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:#fff; color:#606b7e; font-size:11px; }
    @keyframes fade { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:none } }
    @media (max-width:780px) { .app{width:min(100% - 20px,680px);padding-top:20px} header{align-items:flex-start;flex-direction:column}.progress-box{width:100%;text-align:left}.layout{grid-template-columns:1fr}.panel{position:static}.bank-tabs{grid-template-columns:1fr 1fr}.card{min-height:520px;padding:24px;border-radius:18px}.question{margin:23px 0}.position{margin-left:0;width:100%;order:-1}.nav{flex-wrap:wrap}.nav button{flex:1}.nav .random{flex-basis:100%} }
    @media print { body{background:white}.panel,header,.nav,.reveal,.rating{display:none!important}.layout{display:block}.card{box-shadow:none;border:0;padding:0}.answer{display:block}.question{font-size:24px} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><div class="eyebrow">INTERVIEW DRILL</div><h1>嵌入式面试题练习</h1><p class="subtitle">先在心里作答，再点击查看参考答案。</p></div>
      <div class="progress-box"><div class="progress-label"><span>已掌握进度</span><strong id="progressText">0 / 382</strong></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
    </header>
    <div class="layout">
      <aside class="panel">
        <div class="field"><label>题库</label><div class="bank-tabs" id="bankTabs"></div></div>
        <div class="field"><label for="sectionSelect">章节</label><select id="sectionSelect"></select></div>
        <div class="field"><label for="starSelect">重要程度</label><select id="starSelect"><option value="0">全部星级</option><option value="5">★★★★★ 五星必问</option><option value="4">★★★★ 四星高频</option><option value="3">★★★ 三星常见</option><option value="2">★★ 两星</option><option value="1">★ 一星</option></select></div>
        <div class="field"><label for="statusSelect">掌握状态</label><select id="statusSelect"><option value="all">全部状态</option><option value="unrated">尚未标记</option><option value="again">不会</option><option value="fuzzy">模糊</option><option value="know">会</option></select></div>
        <div class="field"><label for="searchInput">搜索题目和答案</label><input id="searchInput" type="search" placeholder="例如：优先级反转"></div>
        <div class="summary" id="filterSummary"></div>
      </aside>
      <section class="card" id="card" aria-live="polite">
        <div id="quiz">
          <div class="meta"><span class="tag" id="sectionTag"></span><span id="bankName"></span><span class="stars" id="stars"></span></div>
          <h2 class="question" id="question"></h2>
          <button class="reveal" id="revealButton" type="button">查看答案 <span class="kbd">空格</span></button>
          <div class="answer" id="answer"></div>
          <div class="rating" id="rating"><button class="rate" data-value="again">不会</button><button class="rate" data-value="fuzzy">模糊</button><button class="rate" data-value="know">会</button></div>
          <div class="spacer"></div>
          <nav class="nav"><button id="previousButton">← 上一题</button><button id="nextButton">下一题 →</button><button class="random" id="randomButton">随机一题</button><span class="position" id="position"></span></nav>
        </div>
        <div class="empty" id="empty" hidden><h2>没有匹配的题目</h2><p>请调整章节、星级、状态或搜索词。</p></div>
      </section>
    </div>
  </main>
  <script>
    const BANKS = [{"id":"software","name":"嵌入式软件","file":"嵌入式软件工程师秋招面试题库_FreeRTOS.md","accent":"#2563eb","questions":[{"id":"software-0.1","bankId":"software","number":"0.1","title":"一分钟自我介绍怎么讲？","stars":5,"section":"0. 自我介绍与项目总览","answerHtml":"<p>建议结构：学校/专业 → 嵌入式技术栈 → 最有代表性的项目与个人职责 → 一个量化结果或难点 → 求职方向。</p>\n<p>不要只报课程和工具名。示例骨架：</p>\n<blockquote>我主要做 MCU 嵌入式开发，熟悉 C、STM32 常用外设和 FreeRTOS。项目中负责过……，通过……解决了……问题，最终实现……。我希望应聘偏底层驱动、RTOS 和设备通信方向的嵌入式软件岗位。</blockquote>"},{"id":"software-0.2","bankId":"software","number":"0.2","title":"介绍一个最能代表你的项目。","stars":5,"section":"0. 自我介绍与项目总览","answerHtml":"<p>必须覆盖：</p>\n<ul>\n<li>项目要解决什么问题；</li>\n<li>硬件平台、软件架构和通信方式；</li>\n<li>你独立负责的部分，避免一直说“我们”；</li>\n<li>最难的问题、定位过程、最终方案；</li>\n<li>有数据的结果：周期、时延、丢包率、内存占用、功耗、稳定运行时间等；</li>\n<li>如果重做一次会如何改进。</li>\n</ul>"},{"id":"software-0.3","bankId":"software","number":"0.3","title":"项目中为什么使用 FreeRTOS，而不是裸机？","stars":5,"section":"0. 自我介绍与项目总览","answerHtml":"<p>答题点：项目存在多个并发活动、不同实时性要求和阻塞等待；RTOS 能用任务划分、优先级调度、同步通信和软件定时器降低状态机复杂度。也要说明代价：RAM/ROM 和调度开销增加，存在竞态、死锁、优先级反转等问题。简单单功能系统未必需要 RTOS。</p>"},{"id":"software-0.4","bankId":"software","number":"0.4","title":"你的软件分层和模块边界如何设计？","stars":4,"section":"0. 自我介绍与项目总览","answerHtml":"<p>建议回答：BSP/驱动层 → 服务或中间件层 → 业务应用层；上层尽量不直接操作寄存器；通过接口、回调、消息队列隔离模块；说明初始化顺序、数据流和错误处理方式。</p>"},{"id":"software-0.5","bankId":"software","number":"0.5","title":"项目最大的 Bug 是什么，如何定位？","stars":5,"section":"0. 自我介绍与项目总览","answerHtml":"<p>按“现象 → 复现条件 → 假设 → 证据 → 根因 → 修复 → 回归验证”回答。要说出工具：断点、Watch、串口日志、逻辑分析仪、示波器、HardFault 栈回溯、map 文件等。</p>\n<p>---</p>"},{"id":"software-1.1","bankId":"software","number":"1.1","title":"`static` 有哪些作用？","stars":5,"section":"1. C 语言基础","answerHtml":"<ul>\n<li>修饰局部变量：静态存储期，只初始化一次，作用域仍在函数内；</li>\n<li>修饰全局变量：限制为当前源文件内部链接；</li>\n<li>修饰函数：限制函数只能在当前源文件使用。</li>\n</ul>\n<p>追问：静态局部变量通常位于 <code>.data</code> 或 <code>.bss</code>，不在普通栈帧中。</p>"},{"id":"software-1.2","bankId":"software","number":"1.2","title":"`const` 的作用是什么？`const` 变量一定在只读区吗？","stars":5,"section":"1. C 语言基础","answerHtml":"<p><code>const</code> 表示通过该标识符不能修改对象，有助于接口约束和编译检查；存放位置取决于对象类型、链接方式和链接脚本，不应简单等同于“必然在 Flash/只读区”。还要会区分：</p>\n<pre><code class=\"language-c\">const int *p;        // 指向常量的指针：不能通过 p 改值\nint * const p2 = 0; // 常量指针：p2 本身不能改指向\nconst int * const p3 = 0;</code></pre>"},{"id":"software-1.3","bankId":"software","number":"1.3","title":"`volatile` 有什么作用？什么时候必须用？","stars":5,"section":"1. C 语言基础","answerHtml":"<p>告诉编译器每次都要按抽象机规则访问该对象，不能把值长期缓存或消除必要访问。典型场景：硬件寄存器、被 ISR 和主程序共同访问的标志、被其他执行上下文异步改变的数据。</p>\n<p>关键陷阱：<code>volatile</code> 不保证原子性，不提供互斥，不等价于内存屏障，也不能单独解决多线程竞态。</p>"},{"id":"software-1.4","bankId":"software","number":"1.4","title":"`sizeof` 和 `strlen` 有什么区别？","stars":5,"section":"1. C 语言基础","answerHtml":"<p><code>sizeof</code> 是运算符，求对象/类型占用字节数，多数情况下编译期确定；<code>strlen</code> 是库函数，遍历到字符串的 <code>\\0</code>，返回字符数且不包含终止符。数组传参后会退化为指针，函数内 <code>sizeof(param)</code> 得到的是指针大小。</p>"},{"id":"software-1.5","bankId":"software","number":"1.5","title":"数组与指针有什么区别？数组什么时候退化为指针？","stars":5,"section":"1. C 语言基础","answerHtml":"<p>数组是连续对象集合，数组名不是可修改左值；在大多数表达式中转换为首元素指针，但作为 <code>sizeof</code>、一元 <code>&amp;</code> 的操作数以及字符串字面量初始化数组等场景不会发生该转换。</p>"},{"id":"software-1.6","bankId":"software","number":"1.6","title":"指针数组与数组指针有什么区别？","stars":4,"section":"1. C 语言基础","answerHtml":"<pre><code class=\"language-c\">int *a[10];    // 含 10 个 int* 的数组\nint (*p)[10];  // 指向“含 10 个 int 的数组”的指针</code></pre>"},{"id":"software-1.7","bankId":"software","number":"1.7","title":"函数指针有什么用？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>典型用途：回调函数、中断向量、状态机、驱动接口表、协议解析分发表。要会声明和调用，并说明回调的参数、生命周期和执行上下文约束。</p>"},{"id":"software-1.8","bankId":"software","number":"1.8","title":"结构体为什么会有内存对齐？如何计算大小？","stars":5,"section":"1. C 语言基础","answerHtml":"<p>成员按各自对齐要求放置，结构体整体大小通常补齐为最大对齐值的整数倍，以提高访问效率并满足处理器要求。要会手算含 <code>char</code>、<code>short</code>、<code>int</code>、指针、数组和嵌套结构体的大小。</p>\n<p>追问：<code>#pragma pack</code> 或 packed 属性可减小空间，但可能造成非对齐访问、性能下降甚至硬件异常；协议帧解析不应随意把缓冲区强转为 packed 结构体。</p>"},{"id":"software-1.9","bankId":"software","number":"1.9","title":"大端和小端是什么？如何判断？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>大端：高有效字节放低地址；小端：低有效字节放低地址。网络字节序通常为大端。可用 <code>uint16_t x = 1</code> 后读取最低地址字节判断，但实际项目优先使用明确的字节编解码函数。</p>"},{"id":"software-1.10","bankId":"software","number":"1.10","title":"宏和内联函数有什么区别？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>宏是预处理文本替换，无类型检查，参数可能被重复求值；内联函数有类型和作用域规则，是否真正内联由编译器决定。宏参数与整体表达式必须加括号，避免优先级问题。</p>"},{"id":"software-1.11","bankId":"software","number":"1.11","title":"写一个安全的 `MAX` 宏要注意什么？","stars":3,"section":"1. C 语言基础","answerHtml":"<p>普通宏即使加括号也会重复计算参数，例如 <code>MAX(i++, j++)</code>。在标准 C 中更推荐类型明确的 <code>static inline</code> 函数；若用编译器扩展，需要明确可移植性。</p>"},{"id":"software-1.12","bankId":"software","number":"1.12","title":"`typedef` 与 `#define` 的区别？","stars":3,"section":"1. C 语言基础","answerHtml":"<p><code>typedef</code> 由编译器处理并遵循类型系统，可正确表达指针别名；宏只是预处理替换。经典陷阱：<code>#define P int<em></code> 后 <code>P a,b;</code> 只有 <code>a</code> 是指针，而 <code>typedef int</em> P; P a,b;</code> 两者都是指针。</p>"},{"id":"software-1.13","bankId":"software","number":"1.13","title":"`extern` 的作用是什么？头文件中如何组织声明？","stars":4,"section":"1. C 语言基础","answerHtml":"<p><code>extern</code> 声明对象或函数在其他翻译单元定义。头文件放声明，某一个 <code>.c</code> 文件放唯一的定义；使用 include guard，避免在头文件中定义普通全局变量。</p>"},{"id":"software-1.14","bankId":"software","number":"1.14","title":"`inline` 的含义是什么？","stars":2,"section":"1. C 语言基础","answerHtml":"<p>它主要是对编译器的优化建议，还涉及 C 语言链接语义；不保证消除函数调用。嵌入式项目常用 <code>static inline</code> 在头文件中定义短小、频繁调用的函数。</p>"},{"id":"software-1.15","bankId":"software","number":"1.15","title":"`switch`、状态机和大量 `if-else` 如何取舍？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>状态明显、转移清晰时使用显式有限状态机，便于处理超时、异常和事件；不要用阻塞延时把所有流程串死。回答时最好结合通信协议或设备控制项目画出状态转移。</p>"},{"id":"software-1.16","bankId":"software","number":"1.16","title":"有符号与无符号混合运算有什么风险？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>整型提升和通常算术转换可能把负数转为很大的无符号数；长度、下标比较中特别常见。还要注意溢出：无符号溢出按模运算，有符号溢出属于未定义行为。</p>"},{"id":"software-1.17","bankId":"software","number":"1.17","title":"`memcpy` 与 `memmove` 有什么区别？","stars":4,"section":"1. C 语言基础","answerHtml":"<p><code>memcpy</code> 要求源和目标不重叠；<code>memmove</code> 支持重叠区域，通常根据地址决定复制方向。两者都不负责字符串终止或对象深拷贝。</p>"},{"id":"software-1.18","bankId":"software","number":"1.18","title":"`strcpy`、`sprintf` 有什么风险？","stars":4,"section":"1. C 语言基础","answerHtml":"<p>可能发生缓冲区溢出。使用有边界的接口并正确检查返回值，如 <code>snprintf</code>；<code>strncpy</code> 也可能不补 <code>\\0</code>，不能机械替换。嵌入式还要考虑格式化函数的栈和代码体积开销。</p>"},{"id":"software-1.19","bankId":"software","number":"1.19","title":"什么是未定义行为？举例。","stars":3,"section":"1. C 语言基础","answerHtml":"<p>例如越界访问、使用已释放内存、空指针解引用、有符号溢出、修改字符串字面量、未加同步的数据竞争等。编译器可以基于“未定义行为不会发生”进行激进优化。</p>"},{"id":"software-1.20","bankId":"software","number":"1.20","title":"如何实现环形缓冲区？","stars":5,"section":"1. C 语言基础","answerHtml":"<p>核心字段：缓冲区、读索引、写索引，可选计数；要定义空/满判定（牺牲一个槽位或额外计数/标志）。考虑索引回绕、并发访问、DMA 写入、覆盖策略。若容量为 2 的幂，可在满足无符号条件下用掩码优化取模。</p>"},{"id":"software-1.21","bankId":"software","number":"1.21","title":"如何写一个位操作：置位、清零、翻转、读取？","stars":5,"section":"1. C 语言基础","answerHtml":"<pre><code class=\"language-c\">x |=  (1u &lt;&lt; n);       // 置位\nx &amp;= ~(1u &lt;&lt; n);       // 清零\nx ^=  (1u &lt;&lt; n);       // 翻转\nb = (x &gt;&gt; n) &amp; 1u;     // 读取</code></pre>\n<p>注意位宽、移位越界、符号扩展和 <code>1u</code> 的类型。</p>"},{"id":"software-1.22","bankId":"software","number":"1.22","title":"如何判断一个数是否是 2 的幂？","stars":3,"section":"1. C 语言基础","answerHtml":"<p>在无符号且 <code>x != 0</code> 时：<code>(x &amp; (x - 1u)) == 0u</code>。</p>"},{"id":"software-1.23","bankId":"software","number":"1.23","title":"递归为什么通常不适合资源受限 MCU？","stars":3,"section":"1. C 语言基础","answerHtml":"<p>栈消耗难界定，深度失控会栈溢出，执行时间也难分析。能改为迭代或显式栈时通常更适合实时系统。</p>"},{"id":"software-1.24","bankId":"software","number":"1.24","title":"浮点运算在 MCU 上有什么注意事项？","stars":3,"section":"1. C 语言基础","answerHtml":"<p>确认是否有 FPU、ABI 和编译选项是否匹配；中断/任务切换是否需要保存浮点上下文；格式化输出浮点可能显著增大固件；实时路径可考虑定点数，但要分析范围、精度和溢出。</p>\n<p>---</p>"},{"id":"software-2.1","bankId":"software","number":"2.1","title":"MCU 程序常见内存段有哪些？","stars":5,"section":"2. 指针、内存与编译链接","answerHtml":"<ul>\n<li><code>.text</code>：代码和只读内容，通常在 Flash；</li>\n<li><code>.rodata</code>：只读常量，通常在 Flash；</li>\n<li><code>.data</code>：有非零初值的全局/静态变量，初值在 Flash，启动时复制到 RAM；</li>\n<li><code>.bss</code>：零初始化或未显式初始化的全局/静态变量，启动时清零；</li>\n<li>heap：动态分配区；</li>\n<li>stack：函数栈帧、局部变量、保存现场等。</li>\n</ul>"},{"id":"software-2.2","bankId":"software","number":"2.2","title":"栈和堆有什么区别？","stars":5,"section":"2. 指针、内存与编译链接","answerHtml":"<p>栈通常按调用自动分配回收，速度快但容量有限；堆由分配器管理，生命周期灵活，但可能碎片化、失败且执行时间不确定。RTOS 中还要区分每个任务栈与 FreeRTOS heap。</p>"},{"id":"software-2.3","bankId":"software","number":"2.3","title":"野指针、悬空指针和内存泄漏分别是什么？","stars":5,"section":"2. 指针、内存与编译链接","answerHtml":"<p>野指针：未正确初始化、指向未知地址；悬空指针：所指对象生命周期已结束；内存泄漏：分配的内存失去可达引用而无法释放。措施包括初始化为 <code>NULL</code>、明确所有权、释放后置空、减少动态分配、静态分析。</p>"},{"id":"software-2.4","bankId":"software","number":"2.4","title":"为什么嵌入式项目常避免运行期 `malloc/free`？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>可能碎片化、分配耗时不确定、失败路径难覆盖、线程安全和长期稳定性风险。并非绝对不能用，可在初始化阶段统一分配、使用内存池/固定块分配、监控剩余空间并禁止在关键实时路径分配。</p>"},{"id":"software-2.5","bankId":"software","number":"2.5","title":"什么是内存碎片？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>外部碎片：总空闲足够但缺少足够大的连续块；内部碎片：分配块内部因对齐或固定粒度产生浪费。固定块内存池可减少外部碎片并提供确定时间。</p>"},{"id":"software-2.6","bankId":"software","number":"2.6","title":"深拷贝和浅拷贝有什么区别？","stars":3,"section":"2. 指针、内存与编译链接","answerHtml":"<p>浅拷贝只复制指针值，多个对象共享底层资源；深拷贝复制其拥有的数据。必须明确资源所有权、释放责任以及并发修改规则。</p>"},{"id":"software-2.7","bankId":"software","number":"2.7","title":"空指针与 `void *` 是什么？","stars":3,"section":"2. 指针、内存与编译链接","answerHtml":"<p>空指针不指向有效对象；<code>void *</code> 是通用对象指针，可与其他对象指针转换，但解引用前必须转成具体类型。函数指针与对象指针不应默认可移植地互转。</p>"},{"id":"software-2.8","bankId":"software","number":"2.8","title":"指针越界为什么危险？","stars":5,"section":"2. 指针、内存与编译链接","answerHtml":"<p>可能破坏栈、控制块、函数返回地址或外设映射区，导致延迟性随机故障。防护：边界检查、长度与缓冲区绑定、编译器告警、栈保护、MPU、静态分析和压力测试。</p>"},{"id":"software-2.9","bankId":"software","number":"2.9","title":"从源文件到可执行固件经历哪些步骤？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>预处理 → 编译 → 汇编 → 链接 → 生成 ELF，再转换为 bin/hex。链接器负责符号解析和段布局；启动文件负责复位入口、栈、向量表和运行时初始化。</p>"},{"id":"software-2.10","bankId":"software","number":"2.10","title":"map 文件有什么用？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>查看段地址与大小、符号所在位置、RAM/Flash 占用、谁引入了大对象或库函数、栈堆配置等，是分析内存超限和固件体积的重要依据。</p>"},{"id":"software-2.11","bankId":"software","number":"2.11","title":"链接脚本做什么？","stars":3,"section":"2. 指针、内存与编译链接","answerHtml":"<p>描述存储区域和各段放置规则，定义入口和相关符号。Bootloader、App 分区、向量表偏移、RAM 函数和特殊保留区都常通过链接脚本实现。</p>"},{"id":"software-2.12","bankId":"software","number":"2.12","title":"什么是内存映射 I/O？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>外设寄存器被映射到处理器地址空间，通过指针读写。寄存器定义通常需要 <code>volatile</code>，还要遵循位宽、访问顺序、读改写副作用和硬件手册要求。</p>"},{"id":"software-2.13","bankId":"software","number":"2.13","title":"如何估算和检测栈使用量？","stars":5,"section":"2. 指针、内存与编译链接","answerHtml":"<p>静态看调用深度、局部大对象、中断嵌套和库函数；运行时可用填充水位法、FreeRTOS <code>uxTaskGetStackHighWaterMark()</code>、栈溢出钩子。注意高水位表示历史最小剩余量而非当前使用量，且要留足最坏情况余量。</p>"},{"id":"software-2.14","bankId":"software","number":"2.14","title":"为什么不要在栈上放很大的数组？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>任务栈通常很小，大数组会快速耗尽并可能破坏相邻内存。可改用静态缓冲区、受控内存池或共享缓冲区，但同时处理好可重入性和并发访问。</p>"},{"id":"software-2.15","bankId":"software","number":"2.15","title":"什么是原子操作？","stars":4,"section":"2. 指针、内存与编译链接","answerHtml":"<p>从其他执行上下文观察时不可分割的操作。某个宽度的对齐读写是否原子取决于架构；<code>i++</code> 通常是读-改-写，不是原子。可使用临界区、架构原子指令或 RTOS 同步原语。</p>\n<p>---</p>"},{"id":"software-3.1","bankId":"software","number":"3.1","title":"MCU 上电后程序如何运行到 `main()`？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>处理器从向量表取得初始 MSP 和 Reset_Handler；复位处理函数完成时钟/底层初始化，复制 <code>.data</code>、清零 <code>.bss</code>，可能执行 C/C++ 运行时初始化，然后调用 <code>main()</code>。具体顺序以启动文件和工具链为准。</p>"},{"id":"software-3.2","bankId":"software","number":"3.2","title":"中断发生时硬件和软件做了什么？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>以 Cortex-M 为例：完成当前指令后，硬件自动压入部分寄存器并根据向量表进入 ISR；ISR 处理并清除中断源，异常返回时恢复现场。还应说明优先级、屏蔽、嵌套和尾链等概念。</p>"},{"id":"software-3.3","bankId":"software","number":"3.3","title":"中断服务函数中应避免做什么？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>避免长时间执行、阻塞等待、普通互斥锁、动态内存、复杂格式化打印和不可重入函数。ISR 应快速获取/清除事件，把后续工作通过标志、队列、任务通知等交给任务。</p>"},{"id":"software-3.4","bankId":"software","number":"3.4","title":"为什么进入中断后要清中断标志？何时清？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>不清可能退出后立即再次进入。清除时机和方式必须看芯片手册：有些写 1 清除，有些读特定寄存器后再读数据清除，有些建议先清再处理以避免漏事件；不能套用统一规则。</p>"},{"id":"software-3.5","bankId":"software","number":"3.5","title":"中断优先级数值越大优先级越高吗？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>在 Cortex-M NVIC 中通常优先级数值越小、逻辑优先级越高。需区分抢占优先级与子优先级，并说明优先级位数由芯片实现。</p>"},{"id":"software-3.6","bankId":"software","number":"3.6","title":"FreeRTOS 中断优先级为什么容易配置错？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>能调用 <code>...FromISR()</code> API 的中断，其优先级必须处在 FreeRTOS 允许管理的范围内；高于该阈值的超高优先级中断不能调用这些 API。要分清 <code>configMAX_SYSCALL_INTERRUPT_PRIORITY</code>、库优先级数值与 NVIC 左移后的寄存器表示。</p>"},{"id":"software-3.7","bankId":"software","number":"3.7","title":"ISR 和任务共享变量如何保护？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>先判断数据访问是否原子；简单事件优先用任务通知、队列、流缓冲区；短小共享状态可用适合 ISR 的临界区或短暂屏蔽中断。仅加 <code>volatile</code> 不够。不可在 ISR 使用会阻塞的普通 API。</p>"},{"id":"software-3.8","bankId":"software","number":"3.8","title":"什么是中断延迟和响应时间？","stars":4,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>中断延迟是从事件发生到开始执行 ISR 的时间，受关中断区间、更高优先级 ISR、当前指令等影响；完整响应时间还包括 ISR 和后续任务被调度执行的时间。优化要控制临界区和 ISR 最坏执行时间。</p>"},{"id":"software-3.9","bankId":"software","number":"3.9","title":"轮询和中断如何选择？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>低频、异步、需及时响应的事件通常适合中断；极高频或处理成本很低时，中断风暴可能反而更差，可采用轮询、DMA 或批处理。简单、固定周期读取也可在任务中轮询。选择依据是实时性、CPU 占用和复杂度。</p>"},{"id":"software-3.10","bankId":"software","number":"3.10","title":"什么是 HardFault？如何定位？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>可能来自非法地址、未对齐、栈溢出、错误函数指针、除零或总线错误等。定位步骤：保存现场；判断使用 MSP/PSP；读取堆栈中的 PC/LR；查看 CFSR、HFSR、BFAR、MMFAR；结合 map/反汇编定位源码；检查栈水位和最近内存写入。</p>"},{"id":"software-3.11","bankId":"software","number":"3.11","title":"看门狗有什么作用？独立看门狗和窗口看门狗区别？","stars":4,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>看门狗用于系统失控时复位。独立看门狗通常使用独立低速时钟；窗口看门狗要求在指定窗口内喂狗，过早和过晚都可能触发。喂狗应代表系统健康，不能由一个永远运行的高优先级任务无条件喂。</p>"},{"id":"software-3.12","bankId":"software","number":"3.12","title":"SysTick 有什么作用？","stars":4,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>常作为系统节拍来源，为 HAL 延时或 RTOS tick 提供时间基准。使用 RTOS 后要理解 HAL tick 与 RTOS tick 的优先级、时间源和冲突问题。</p>"},{"id":"software-3.13","bankId":"software","number":"3.13","title":"什么是临界区？为什么越短越好？","stars":5,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>临界区是访问共享资源、不能被并发打断的代码区。实现可能是关调度或屏蔽一定范围中断；过长会增加中断延迟和任务响应抖动，破坏实时性。</p>"},{"id":"software-3.14","bankId":"software","number":"3.14","title":"中断嵌套的条件是什么？","stars":3,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>硬件支持嵌套、优先级分组和屏蔽状态允许，且新中断具有更高抢占优先级。设计时要考虑共享资源、栈最坏占用和执行时间。</p>"},{"id":"software-3.15","bankId":"software","number":"3.15","title":"Cortex-M 的 MSP 和 PSP 有什么区别？","stars":3,"section":"3. MCU、启动、中断与异常","answerHtml":"<p>MSP 常用于复位后和异常处理；PSP 可用于线程模式，FreeRTOS 通常让任务使用各自基于 PSP 的栈，而异常进入后使用 MSP。具体实现看端口层。</p>\n<p>---</p>"},{"id":"software-4.1","bankId":"software","number":"4.1","title":"I²C 的基本信号和特点是什么？","stars":5,"section":"4. I²C","answerHtml":"<p>两根线 SDA/SCL、同步、半双工、多主多从、开漏输出，需要上拉电阻。空闲时两线为高；设备通过地址识别。</p>"},{"id":"software-4.2","bankId":"software","number":"4.2","title":"I²C 的起始和停止条件是什么？","stars":5,"section":"4. I²C","answerHtml":"<p>SCL 为高时 SDA 从高到低是 START；SCL 为高时 SDA 从低到高是 STOP。数据位通常在 SCL 高电平期间保持稳定。</p>"},{"id":"software-4.3","bankId":"software","number":"4.3","title":"ACK/NACK 如何工作？","stars":5,"section":"4. I²C","answerHtml":"<p>每传 8 位后，第 9 个时钟由接收方应答。拉低 SDA 表示 ACK，保持高表示 NACK。主机读最后一个字节时通常发送 NACK，再产生 STOP 或重复起始。</p>"},{"id":"software-4.4","bankId":"software","number":"4.4","title":"7 位地址和 8 位“地址”为什么容易混淆？","stars":5,"section":"4. I²C","answerHtml":"<p>总线传输的首字节通常由 7 位从机地址左移一位再加 R/W 位组成。有些数据手册给的是已左移的读写地址。驱动 API 需要哪一种必须看文档，不能凭习惯。</p>"},{"id":"software-4.5","bankId":"software","number":"4.5","title":"什么是重复起始条件？","stars":4,"section":"4. I²C","answerHtml":"<p>主机不释放总线，直接再次发 START，常用于“先写寄存器地址、再读数据”，避免中间被其他主机占用，并保持一次原子事务。</p>"},{"id":"software-4.6","bankId":"software","number":"4.6","title":"I²C 为什么需要上拉？阻值如何选择？","stars":4,"section":"4. I²C","answerHtml":"<p>开漏器件只能主动拉低，释放后靠上拉变高。阻值要在灌电流能力和 RC 上升时间之间权衡；线长、电容、速率越高，通常需要更强上拉，但不能超过器件低电平电流规格。</p>"},{"id":"software-4.7","bankId":"software","number":"4.7","title":"I²C 总线被拉死怎么办？","stars":4,"section":"4. I²C","answerHtml":"<p>先判断 SDA/SCL 谁被拉低；复位控制器并重配 GPIO；若从机卡在传输中，可按器件建议手动产生若干 SCL 脉冲（常见为 9 个）并生成 STOP；必要时复位或断电从机。必须加入超时，不能永久等待 BUSY。</p>"},{"id":"software-4.8","bankId":"software","number":"4.8","title":"什么是时钟拉伸和多主仲裁？","stars":3,"section":"4. I²C","answerHtml":"<p>从机可拉低 SCL 延迟主机，称时钟拉伸；多主同时发送时，通过监测 SDA 实现逐位仲裁，发送高却读到低的一方退出。确认 MCU 外设和驱动是否支持。</p>"},{"id":"software-4.9","bankId":"software","number":"4.9","title":"I²C 通信错误如何调试？","stars":5,"section":"4. I²C","answerHtml":"<p>检查供电、共地、上拉、地址、速率与时序；用逻辑分析仪看 START、地址、ACK、寄存器地址和数据；区分地址 NACK、数据 NACK、超时、仲裁丢失和总线错误；降低频率并交叉验证设备手册。</p>"},{"id":"software-4.10","bankId":"software","number":"4.10","title":"硬件 I²C 与软件模拟 I²C 如何选择？","stars":3,"section":"4. I²C","answerHtml":"<p>硬件 I²C 占 CPU 少、可配合 DMA/中断，但外设状态机和异常恢复可能复杂；软件模拟灵活、便于特殊时序和换引脚，但占 CPU、实时性依赖中断和延时准确性。</p>\n<p>---</p>"},{"id":"software-5.1","bankId":"software","number":"5.1","title":"SPI 的信号和特点是什么？","stars":5,"section":"5. SPI","answerHtml":"<p>常见四线：SCLK、MOSI、MISO、CS；同步、全双工、主从式、无统一地址和应答机制，速度通常高于 I²C。多个从机一般各用独立 CS，或采用菊链。</p>"},{"id":"software-5.2","bankId":"software","number":"5.2","title":"CPOL 和 CPHA 是什么？四种模式如何理解？","stars":5,"section":"5. SPI","answerHtml":"<p>CPOL 决定时钟空闲电平；CPHA 决定在第一个还是第二个有效边沿采样。主从模式必须一致。不要只背编号，要能根据器件时序图判断在哪个边沿改变和采样数据。</p>"},{"id":"software-5.3","bankId":"software","number":"5.3","title":"SPI 为什么“发送才能接收”？","stars":5,"section":"5. SPI","answerHtml":"<p>SPI 每个时钟边沿同时移出和移入一位；主机要提供时钟，因此读取时也要发送 dummy 数据。写操作期间接收到的数据可能无意义，但接收寄存器仍需按硬件要求处理。</p>"},{"id":"software-5.4","bankId":"software","number":"5.4","title":"SPI 没有 ACK，如何保证通信可靠？","stars":4,"section":"5. SPI","answerHtml":"<p>由上层协议或器件机制保证：状态寄存器、校验/CRC、帧头帧长、序号、超时重试、读回校验和错误引脚等。</p>"},{"id":"software-5.5","bankId":"software","number":"5.5","title":"CS 时序有什么常见坑？","stars":4,"section":"5. SPI","answerHtml":"<p>器件常规定 CS 建立/保持时间、字节间是否允许抬高、一次事务包含多少字节。使用 DMA 时不能在 DMA 尚未完成就抬高 CS，还要等待 SPI 移位寄存器真正空闲，而不只是 DMA 完成。</p>"},{"id":"software-5.6","bankId":"software","number":"5.6","title":"SPI 收到的数据整体错一位或全是 `0xFF/0x00` 怎么查？","stars":5,"section":"5. SPI","answerHtml":"<p>检查 CPOL/CPHA、位序、数据宽度、CS、MISO 是否浮空、主从是否共地、频率是否过高；逻辑分析仪对照数据手册时序。全 <code>0xFF</code> 常见于线路被上拉/从机未驱动，全 <code>0x00</code> 可能是被拉低或器件未工作，但要以波形为准。</p>"},{"id":"software-5.7","bankId":"software","number":"5.7","title":"SPI、I²C、UART 如何选型？","stars":5,"section":"5. SPI","answerHtml":"<p>从吞吐量、引脚数量、距离、设备数量、全双工需求、错误检测、布线和软件复杂度权衡。不要只回答“SPI 快、I²C 省线、UART 简单”，要结合实际设备和速率。</p>"},{"id":"software-5.8","bankId":"software","number":"5.8","title":"QSPI/OSPI 是什么？","stars":2,"section":"5. SPI","answerHtml":"<p>通过多条数据线提高吞吐，可连接外部 Flash，并可能支持内存映射执行 XIP。需考虑缓存、一致性、擦写期间不可读和时序校准。</p>\n<p>---</p>"},{"id":"software-6.1","bankId":"software","number":"6.1","title":"UART 一帧包含什么？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>空闲电平、起始位、数据位、可选校验位、停止位。通信双方必须匹配波特率、数据位、校验和停止位。</p>"},{"id":"software-6.2","bankId":"software","number":"6.2","title":"波特率和比特率有什么区别？","stars":4,"section":"6. UART 与 CAN","answerHtml":"<p>波特率是每秒符号数，比特率是每秒比特数；二进制 UART 中通常数值相同。计算有效吞吐时要把起始、校验和停止位开销算进去。</p>"},{"id":"software-6.3","bankId":"software","number":"6.3","title":"UART 为什么会出现乱码？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>波特率或帧格式不匹配、时钟误差、地线/电平标准错误、线路干扰、缓冲区溢出、数据解析边界错误、并发打印交叉等。先看物理波形和原始字节，再看协议解析。</p>"},{"id":"software-6.4","bankId":"software","number":"6.4","title":"TTL UART、RS-232、RS-485 有什么区别？","stars":4,"section":"6. UART 与 CAN","answerHtml":"<p>UART 是数据帧/控制器概念；TTL/CMOS UART 使用单端逻辑电平；RS-232 是不同电平和极性标准；RS-485 使用差分信号，适合较远距离、多节点，常见半双工并需要方向控制和终端匹配。</p>"},{"id":"software-6.5","bankId":"software","number":"6.5","title":"UART 不定长数据怎么接收？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>常见方案：逐字节中断 + 环形缓冲；DMA 循环接收 + 空闲线 IDLE；协议层用帧头、长度、超时、帧尾或转义确定边界。必须处理半包、粘包、噪声、溢出和重新同步。</p>"},{"id":"software-6.6","bankId":"software","number":"6.6","title":"UART DMA + IDLE 的处理流程是什么？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>DMA 接收数据，IDLE 或 DMA 半满/满事件触发处理；通过 DMA 剩余计数计算新数据区间，将数据写入环形缓冲或通知解析任务；清标志并继续接收。要考虑事件竞争、缓冲回绕、缓存一致性及处理不及时导致覆盖。</p>"},{"id":"software-6.7","bankId":"software","number":"6.7","title":"如何设计健壮的串口协议？","stars":4,"section":"6. UART 与 CAN","answerHtml":"<p>帧头/同步字、版本、命令、长度、序号、负载、CRC；规定字节序、最大长度、超时和异常恢复；解析器先做长度与边界检查，再校验；遇错能重新寻找同步点。</p>"},{"id":"software-6.8","bankId":"software","number":"6.8","title":"校验和与 CRC 有什么区别？","stars":4,"section":"6. UART 与 CAN","answerHtml":"<p>简单校验和成本低但检错能力有限；CRC 对突发错误等具有更强检出能力。双方必须一致约定多项式、初值、输入/输出反射、结果异或和字节顺序。</p>"},{"id":"software-6.9","bankId":"software","number":"6.9","title":"CAN 的主要特点是什么？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>多主、广播、差分物理层、基于标识符的优先级仲裁、强错误检测与自动重发。经典 CAN 数据场最多 8 字节；CAN FD 支持更长数据和数据阶段更高速率。</p>"},{"id":"software-6.10","bankId":"software","number":"6.10","title":"CAN 是按节点地址通信吗？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>不是传统点对点地址模式。报文 ID 描述消息含义并参与仲裁，所有节点可接收，再由硬件过滤器和软件决定是否处理。</p>"},{"id":"software-6.11","bankId":"software","number":"6.11","title":"CAN 仲裁为什么不会破坏报文？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>显性位覆盖隐性位。节点边发送边监测总线；发送隐性却读到显性的节点失去仲裁并停止发送，胜出节点的报文保持完整。ID 数值越小通常优先级越高。</p>"},{"id":"software-6.12","bankId":"software","number":"6.12","title":"CAN 总线为什么需要 120Ω 终端电阻？","stars":4,"section":"6. UART 与 CAN","answerHtml":"<p>在线缆两端匹配特性阻抗，减少信号反射。断电测 CAN_H 与 CAN_L 间通常约 60Ω，表示两只 120Ω 并联，但还应结合拓扑和设备内部终端判断。</p>"},{"id":"software-6.13","bankId":"software","number":"6.13","title":"CAN 的错误状态有哪些？","stars":3,"section":"6. UART 与 CAN","answerHtml":"<p>节点依据发送/接收错误计数进入 Error Active、Error Passive，严重时进入 Bus Off。工程上要设计 Bus Off 恢复、告警和故障记录，不能只自动重启掩盖问题。</p>"},{"id":"software-6.14","bankId":"software","number":"6.14","title":"CAN 收不到数据如何排查？","stars":5,"section":"6. UART 与 CAN","answerHtml":"<p>检查收发器供电/使能、共地、终端电阻、CAN_H/L、波特率和采样点、过滤器、ID 类型、引脚复用和中断；用示波器/分析仪确认是否有帧和错误帧；查看控制器错误计数与状态。</p>"},{"id":"software-6.15","bankId":"software","number":"6.15","title":"CAN 标准帧和扩展帧区别？","stars":3,"section":"6. UART 与 CAN","answerHtml":"<p>标准 ID 为 11 位，扩展 ID 为 29 位；仲裁字段与开销不同。配置过滤器和发送邮箱时要同时确认 IDE、RTR 等字段。</p>\n<p>---</p>"},{"id":"software-7.1","bankId":"software","number":"7.1","title":"什么是实时系统？硬实时和软实时区别？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>实时性强调在截止时间内完成，而不只是平均速度快。硬实时错过截止时间不可接受；软实时偶尔超时会降低质量但通常不造成灾难。分析要关注最坏执行时间和最坏响应时间。</p>"},{"id":"software-7.2","bankId":"software","number":"7.2","title":"FreeRTOS 任务有哪些主要状态？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>Running、Ready、Blocked、Suspended；一些资料还单列 Deleted/终止等待回收。Blocked 是在等待时间或事件，时间/事件满足后回 Ready；Suspended 不会因超时自动恢复。</p>"},{"id":"software-7.3","bankId":"software","number":"7.3","title":"FreeRTOS 如何进行任务调度？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>固定优先级抢占调度为常见配置：最高优先级的 Ready 任务运行；同优先级任务可按时间片轮转，具体由配置决定。阻塞、ISR 唤醒更高优先级任务或 tick 到来都可能触发切换。</p>"},{"id":"software-7.4","bankId":"software","number":"7.4","title":"任务切换保存了什么？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>保存当前任务上下文并恢复下一个任务上下文，包括需要保留的 CPU 寄存器、栈指针及端口相关状态。Cortex-M 端口通常利用 PendSV；部分寄存器由异常机制自动保存，部分由端口代码保存。</p>"},{"id":"software-7.5","bankId":"software","number":"7.5","title":"FreeRTOS 为什么常用 SysTick、PendSV 和 SVC？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>SysTick 提供节拍；PendSV 设为很低优先级，延后执行上下文切换；SVC 可用于启动首个任务或特权服务。要结合具体 FreeRTOS 端口回答。</p>"},{"id":"software-7.6","bankId":"software","number":"7.6","title":"抢占式调度与协作式调度区别？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>抢占式可在更高优先级任务就绪时立即切换，响应快但并发复杂；协作式依赖任务主动让出 CPU，简单但一个任务不让出就会拖住系统。</p>"},{"id":"software-7.7","bankId":"software","number":"7.7","title":"`vTaskDelay()` 与 `vTaskDelayUntil()` 区别？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p><code>vTaskDelay()</code> 是从调用时刻开始相对延时，循环执行时间会累积造成漂移；<code>vTaskDelayUntil()</code> 以固定基准周期唤醒，更适合周期任务。任务唤醒只是变为 Ready，何时真正运行还受优先级影响。</p>"},{"id":"software-7.8","bankId":"software","number":"7.8","title":"为什么不能用忙等延时代替任务阻塞？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>忙等持续占用 CPU，低优先级任务无法运行，也不利于低功耗。任务等待事件或时间时应进入 Blocked，让调度器运行其他任务或进入空闲/低功耗。</p>"},{"id":"software-7.9","bankId":"software","number":"7.9","title":"如何划分任务？任务越多越好吗？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>按独立并发活动、不同实时性和清晰职责划分；过少会形成巨型任务和复杂状态机，过多会增加栈、切换、同步和调试成本。避免把每个小函数都做成任务。</p>"},{"id":"software-7.10","bankId":"software","number":"7.10","title":"如何设置任务优先级？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>依据截止时间、响应要求和阻塞关系，而不是“功能重要性”。高优先级任务应短、常阻塞；CPU 密集任务不应长期占最高优先级。验证最坏负载下所有任务都能满足时序。</p>"},{"id":"software-7.11","bankId":"software","number":"7.11","title":"高优先级任务一直运行会怎样？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>低优先级任务会饥饿，包括 Idle 任务；若删除任务依赖 Idle 回收资源，也可能无法回收。高优先级任务必须在无事时阻塞、延时或等待通知。</p>"},{"id":"software-7.12","bankId":"software","number":"7.12","title":"Idle 任务做什么？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>保证始终有任务可运行，回收已删除任务的内存；可执行 Idle Hook，但钩子不能阻塞。Tickless Idle 等低功耗机制也常基于空闲时间。</p>"},{"id":"software-7.13","bankId":"software","number":"7.13","title":"FreeRTOS tick 越高越好吗？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>高 tick 提高时间粒度，但增加周期中断和调度开销、功耗；低 tick 减少开销但延时粒度变粗。tick 不等于任务执行频率，也不能保证绝对精准的微秒级定时。</p>"},{"id":"software-7.14","bankId":"software","number":"7.14","title":"`portTICK_PERIOD_MS` 和 `pdMS_TO_TICKS()` 有何注意？","stars":3,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>优先用 <code>pdMS_TO_TICKS()</code> 转换；注意整数截断、超长时间溢出和 0 tick 结果。超时逻辑还要正确处理 tick 计数回绕，优先使用 FreeRTOS 提供的阻塞/超时接口。</p>"},{"id":"software-7.15","bankId":"software","number":"7.15","title":"动态创建与静态创建任务如何选？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>动态创建方便，但依赖 heap；静态创建由调用者提供 TCB 和栈，内存可控、适合高可靠场景。无论哪种都要检查创建结果和栈水位。</p>"},{"id":"software-7.16","bankId":"software","number":"7.16","title":"删除任务后内存何时释放？","stars":3,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>动态创建任务被删除后，相关内存通常由 Idle 任务清理，因此 Idle 必须获得运行机会。任务持有的其他资源不会被内核自动正确归还，删除前要有明确清理协议。</p>"},{"id":"software-7.17","bankId":"software","number":"7.17","title":"FreeRTOS 的 `heap_1` 到 `heap_5` 有何区别？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<ul>\n<li><code>heap_1</code>：只分配不释放，简单确定；</li>\n<li><code>heap_2</code>：可释放但不合并相邻空闲块，易碎片；</li>\n<li><code>heap_3</code>：封装标准 <code>malloc/free</code>，加调度保护；</li>\n<li><code>heap_4</code>：可释放并合并相邻空闲块，最常见；</li>\n<li><code>heap_5</code>：类似 heap_4，支持多个不连续内存区域。</li>\n</ul>"},{"id":"software-7.18","bankId":"software","number":"7.18","title":"如何检查 FreeRTOS 内存是否足够？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>检查创建 API 返回值、<code>xPortGetFreeHeapSize()</code> 和历史最小剩余堆、每个任务栈高水位；启用 malloc failed hook 和 stack overflow hook；在最坏业务负载、最长运行和通信突发下测试。</p>"},{"id":"software-7.19","bankId":"software","number":"7.19","title":"软件定时器回调在哪执行？能阻塞吗？","stars":5,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>在 Timer Service/Daemon Task 上下文执行，不是硬件 ISR。回调应短小且不能长时间阻塞，否则会延迟其他定时器命令与回调。其队列长度、任务优先级和栈大小需要配置。</p>"},{"id":"software-7.20","bankId":"software","number":"7.20","title":"软件定时器与任务延时如何选？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>少量短小的周期/一次性回调适合软件定时器；需要阻塞、复杂处理或独立优先级的功能适合任务。高精度硬实时定时通常依赖硬件定时器，而非 RTOS tick。</p>"},{"id":"software-7.21","bankId":"software","number":"7.21","title":"什么是 Tickless Idle？","stars":3,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>系统预计一段时间无任务需要运行时抑制周期 tick，并进入低功耗，唤醒后补偿系统时间。需处理低功耗定时源精度、最大睡眠时间、外设唤醒和调试影响。</p>"},{"id":"software-7.22","bankId":"software","number":"7.22","title":"FreeRTOS 的临界区与挂起调度器有何区别？","stars":4,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>临界区通常屏蔽一定范围中断，保护极短操作；挂起调度器阻止任务切换，但中断仍可能运行，不能保护与 ISR 共享的数据。恢复调度时可能立即发生切换。</p>"},{"id":"software-7.23","bankId":"software","number":"7.23","title":"`taskYIELD()` 的作用是什么？","stars":3,"section":"7. FreeRTOS 基础与任务管理","answerHtml":"<p>主动请求调度，让同优先级就绪任务获得机会；它不会使当前任务进入 Blocked，因此如果没有同优先级任务，当前任务可能马上继续运行。</p>\n<p>---</p>"},{"id":"software-8.1","bankId":"software","number":"8.1","title":"队列、二值信号量、计数信号量、互斥量如何选？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<ul>\n<li>队列：传递有类型的数据副本；</li>\n<li>二值信号量：事件通知或同步，不表达所有权；</li>\n<li>计数信号量：累计多个事件或管理同类资源数量；</li>\n<li>互斥量：保护共享资源，有所有者并支持优先级继承；</li>\n<li>任务通知：面向单个任务的轻量通知，可表达位、计数或值。</li>\n</ul>"},{"id":"software-8.2","bankId":"software","number":"8.2","title":"队列传的是指针还是数据？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>FreeRTOS 队列按创建时指定的 item size 复制数据。若队列元素是指针，只复制指针值，必须确保底层对象在接收方使用期间仍有效，并明确缓冲区所有权和释放者。</p>"},{"id":"software-8.3","bankId":"software","number":"8.3","title":"为什么互斥量不能在 ISR 中使用？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>互斥量有任务所有权和优先级继承语义，而 ISR 不是任务且不能阻塞。ISR 与任务同步应使用队列、二值/计数信号量、任务通知、流缓冲等对应的 <code>FromISR</code> API。</p>"},{"id":"software-8.4","bankId":"software","number":"8.4","title":"什么是优先级反转？如何解决？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>低优先级任务持有锁，高优先级任务等待该锁，中优先级任务不断抢占低优先级任务，导致高优先级任务被间接长期阻塞。互斥量的优先级继承可缓解：临时提升锁持有者优先级，让其尽快释放锁。还可缩短临界区、调整架构或使用优先级上限思想。</p>"},{"id":"software-8.5","bankId":"software","number":"8.5","title":"什么是死锁？四个必要条件是什么？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>互斥、占有且等待、不可抢占、循环等待。避免方法：统一加锁顺序、一次性申请、设置超时与失败回退、减少嵌套锁、使用消息传递。超时只是让系统能逃脱，不代表状态一定正确。</p>"},{"id":"software-8.6","bankId":"software","number":"8.6","title":"什么是竞态条件？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>结果依赖多个执行上下文的不可控交错。典型表现是“偶现”。解决前先明确共享状态和不变量，再选择互斥、原子操作、临界区或单所有者消息模型。</p>"},{"id":"software-8.7","bankId":"software","number":"8.7","title":"任务通知为什么高效？限制是什么？","stars":4,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>通知状态直接放在任务控制块中，不需要独立队列对象，内存和执行开销较小。通常是发送方通知指定接收任务，不适合多个接收者竞争同一消息，也不替代需要排队保存多个结构体的队列。</p>"},{"id":"software-8.8","bankId":"software","number":"8.8","title":"Event Group 适合什么场景？","stars":4,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>用多个 bit 表示多个条件或事件，任务可等待任一或全部 bit。它适合状态组合，不携带复杂数据；要注意清零时机、多个等待者语义以及 ISR API 限制。</p>"},{"id":"software-8.9","bankId":"software","number":"8.9","title":"Stream Buffer 和 Message Buffer 区别？","stars":3,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>Stream Buffer 传字节流，不保留消息边界；Message Buffer 在其上提供变长消息边界。默认设计通常面向单写者、单读者；多写者或多读者需要外部串行化并核对版本文档。</p>"},{"id":"software-8.10","bankId":"software","number":"8.10","title":"ISR 唤醒高优先级任务后如何立即切换？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>使用对应 <code>...FromISR()</code> API，传入 <code>xHigherPriorityTaskWoken</code>；若其变为真，在退出 ISR 前调用端口宏请求上下文切换。变量应按官方示例初始化为 <code>pdFALSE</code>。</p>"},{"id":"software-8.11","bankId":"software","number":"8.11","title":"队列满或空时怎么办？","stars":5,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>任务 API 可设置阻塞超时；ISR API 不能阻塞。系统设计必须定义过载策略：丢最新、丢最旧、覆盖、反压、报警或增大处理能力。仅把队列加大可能只是延后故障。</p>"},{"id":"software-8.12","bankId":"software","number":"8.12","title":"为什么不建议多个任务直接同时打印日志？","stars":4,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>输出会交叉，格式化耗时且串口驱动可能不可重入。可用日志队列交给单独任务发送，定义等级、时间戳和丢弃策略；崩溃路径则准备独立的最小化输出方式。</p>"},{"id":"software-8.13","bankId":"software","number":"8.13","title":"共享全局变量、队列与消息传递怎样取舍？","stars":4,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>简单只读配置可共享；频繁可变状态优先单所有者 + 消息传递，降低锁复杂度；大数据可传指针或零拷贝，但必须建立清晰的缓冲区所有权协议。</p>"},{"id":"software-8.14","bankId":"software","number":"8.14","title":"二值信号量会累计多次事件吗？","stars":4,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>不会，它最多表示一个待处理状态；在被取走前多次 give 可能合并。需要准确累计事件次数时使用计数信号量、队列或任务通知计数，但也要考虑计数上限。</p>"},{"id":"software-8.15","bankId":"software","number":"8.15","title":"互斥量和递归互斥量区别？","stars":3,"section":"8. FreeRTOS 同步与通信","answerHtml":"<p>普通互斥量被同一任务重复获取可能死锁；递归互斥量允许同一任务多次获取，但必须以相同次数释放。递归锁可能掩盖设计问题，不应滥用。</p>\n<p>---</p>"},{"id":"software-9.1","bankId":"software","number":"9.1","title":"DMA 的基本原理是什么？","stars":5,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>DMA 在外设与内存或内存之间搬运数据，减少 CPU 逐字节操作。CPU 负责配置源、目标、方向、长度和触发，DMA 完成或半完成后通过中断通知。</p>"},{"id":"software-9.2","bankId":"software","number":"9.2","title":"DMA 是否完全不占总线和 CPU？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>不是。DMA 会与 CPU/其他总线主设备争用总线；CPU 仍需配置、处理完成事件和缓冲区。高带宽 DMA 可能影响 CPU 访问时延。</p>"},{"id":"software-9.3","bankId":"software","number":"9.3","title":"DMA 正常模式与循环模式区别？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>正常模式传完指定长度停止；循环模式到末尾后自动从头继续，适合 ADC 连续采样和串口连续接收。循环模式必须处理读写指针与覆盖问题。</p>"},{"id":"software-9.4","bankId":"software","number":"9.4","title":"什么是 DMA 双缓冲/乒乓缓冲？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>DMA 填充缓冲 A 时 CPU 处理 B，随后交换，使采集和处理并行。必须确保 CPU 在 DMA 再次写入前处理完成，并正确同步缓冲区所有权。</p>"},{"id":"software-9.5","bankId":"software","number":"9.5","title":"有 Cache 的 MCU 使用 DMA 要注意什么？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>CPU Cache 与 DMA 看到的数据可能不一致。发送前可能要 clean cache，接收后可能要 invalidate；缓冲区按 cache line 对齐并处理长度边界，或放到非缓存区。具体顺序依据芯片和 SDK。</p>"},{"id":"software-9.6","bankId":"software","number":"9.6","title":"定时器的预分频和自动重装如何计算？","stars":5,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>一般先确认定时器输入时钟，再按芯片公式计算计数频率与周期。常见形式为：</p>\n<p><code>更新频率 = 定时器时钟 / ((PSC + 1) × (ARR + 1))</code></p>\n<p>但时钟树中 APB 分频可能导致定时器时钟倍频，必须看参考手册。</p>"},{"id":"software-9.7","bankId":"software","number":"9.7","title":"PWM 的频率和占空比如何设置？","stars":5,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>频率由定时器时钟、PSC、ARR 决定；占空比由比较寄存器相对 ARR 的比例决定。还要考虑计数模式、极性、分辨率和边界值。</p>"},{"id":"software-9.8","bankId":"software","number":"9.8","title":"输入捕获和输出比较有什么用途？","stars":3,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>输入捕获在外部边沿到来时锁存计数值，可测频率、周期、脉宽；输出比较在计数值匹配时产生事件或改变引脚，用于精确定时输出。</p>"},{"id":"software-9.9","bankId":"software","number":"9.9","title":"ADC 的分辨率、参考电压和采样时间是什么？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>理想量化步长与参考电压和位数有关；实际精度还受噪声、参考源、输入阻抗、采样保持时间、布局和校准影响。高阻源需要更长采样时间或运放缓冲。</p>"},{"id":"software-9.10","bankId":"software","number":"9.10","title":"ADC 数据如何滤波？","stars":3,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>移动平均、中值、一阶低通、限幅等。选择依据噪声类型、响应速度和计算成本；不能只追求“平滑”，还要分析相位延迟和异常点。</p>"},{"id":"software-9.11","bankId":"software","number":"9.11","title":"GPIO 上拉、下拉、推挽、开漏分别是什么？","stars":5,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>上拉/下拉为输入提供默认电平；推挽可主动输出高低；开漏只能主动拉低，需要外部或内部上拉，便于线与和电平转换。具体电气限制看数据手册。</p>"},{"id":"software-9.12","bankId":"software","number":"9.12","title":"按键为什么会抖动？如何消抖？","stars":4,"section":"9. 定时器、DMA 与常用外设","answerHtml":"<p>机械触点在短时间内反复变化。可用 RC/施密特硬件消抖，或软件定时采样、稳定计数、状态机消抖；不要在外部中断里长时间阻塞延时。</p>\n<p>---</p>"},{"id":"software-10.1","bankId":"software","number":"10.1","title":"MCU 常见低功耗模式有什么区别？","stars":4,"section":"10. 低功耗与电源管理","answerHtml":"<p>通常从 Sleep 到 Stop/Standby，关闭的时钟和电源域逐渐增多，功耗降低但唤醒延迟增加、保留状态减少。具体名称和行为以芯片手册为准。</p>"},{"id":"software-10.2","bankId":"software","number":"10.2","title":"进入低功耗前要做哪些事？","stars":4,"section":"10. 低功耗与电源管理","answerHtml":"<p>确认没有待处理工作；配置唤醒源；处理外设和引脚状态；保存必要上下文；避免浮空输入和外设漏电；处理调试器影响；进入后验证实际电流。</p>"},{"id":"software-10.3","bankId":"software","number":"10.3","title":"FreeRTOS 下如何做低功耗？","stars":4,"section":"10. 低功耗与电源管理","answerHtml":"<p>让任务无事时阻塞，利用 Idle/Tickless Idle 进入睡眠；统计下一个到期事件；正确补偿 tick；协调 UART/DMA/定时器等唤醒源。不能仅在 Idle Hook 中随意执行深睡而不检查内核条件。</p>"},{"id":"software-10.4","bankId":"software","number":"10.4","title":"为什么测得的低功耗电流比手册高？","stars":5,"section":"10. 低功耗与电源管理","answerHtml":"<p>常见原因：调试器连接、板载 LED/稳压器/USB 芯片、外设未关时钟、GPIO 浮空或反向供电、传感器未休眠、唤醒过于频繁、测量仪器连接错误。要分离 MCU 与整板功耗。</p>"},{"id":"software-10.5","bankId":"software","number":"10.5","title":"如何在功耗、响应时间与吞吐量之间权衡？","stars":3,"section":"10. 低功耗与电源管理","answerHtml":"<p>批量处理可以减少唤醒次数但增加延迟；降低频率省动态功耗但任务运行更久；深睡功耗更低但唤醒慢。应根据业务截止时间测量能量，而非只看瞬时电流。</p>"},{"id":"software-10.6","bankId":"software","number":"10.6","title":"时钟门控和动态调频是什么？","stars":2,"section":"10. 低功耗与电源管理","answerHtml":"<p>时钟门控停止不用模块的时钟以减少动态功耗；动态调频/调压根据负载调整性能与能耗。切换时要处理外设时钟、波特率、定时基准和 Flash 等待周期。</p>\n<p>---</p>"},{"id":"software-11.1","bankId":"software","number":"11.1","title":"Bootloader 的作用是什么？","stars":5,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>完成基础硬件初始化、检查升级条件、接收与验证固件、选择并跳转到应用程序；可支持回滚、版本管理和安全校验。</p>"},{"id":"software-11.2","bankId":"software","number":"11.2","title":"Bootloader 跳转到 App 前要做什么？","stars":5,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>验证 App 向量表和入口合法；关闭/复位已启用外设与中断；停止 SysTick；清除相关中断挂起；设置向量表偏移；加载 App 初始 MSP；跳转 Reset_Handler。实际还要考虑 Cache、MPU、时钟和 RTOS 状态。</p>"},{"id":"software-11.3","bankId":"software","number":"11.3","title":"IAP 与 ISP 区别？","stars":3,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>ISP 常指使用芯片固化的系统 Bootloader 或专用接口在系统编程；IAP 是应用内编程，通过自身软件接收并写入固件。不同厂商术语可能略有差异。</p>"},{"id":"software-11.4","bankId":"software","number":"11.4","title":"固件升级如何防止断电变砖？","stars":5,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>常用 A/B 双分区或下载区 + 运行区；新固件完整写入并校验后再原子更新启动标志；启动失败计数和看门狗触发回滚；关键元数据采用冗余、版本号和 CRC，并设计断电安全写入顺序。</p>"},{"id":"software-11.5","bankId":"software","number":"11.5","title":"CRC、哈希、数字签名分别解决什么问题？","stars":4,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>CRC 主要检出传输/存储错误，不具备防伪能力；哈希用于完整性摘要，但单独使用不能证明来源；数字签名可验证完整性与发布者身份。加密解决保密性，不能替代签名。</p>"},{"id":"software-11.6","bankId":"software","number":"11.6","title":"Flash 擦写有什么限制？","stars":4,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>通常按页/扇区擦除，写入粒度受限，位一般只能从 1 写为 0，恢复需擦除；擦写次数有限；擦写期间有些器件不能从同一 Bank 取指。参数存储要做磨损均衡、掉电保护和校验。</p>"},{"id":"software-11.7","bankId":"software","number":"11.7","title":"如何设计参数掉电保存？","stars":4,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>记录版本、长度、序号和 CRC；使用双页/日志式追加，写新记录成功后再使其生效；启动时选择最新有效记录；空间满后垃圾回收。不要在每次小变化时立刻擦 Flash。</p>"},{"id":"software-11.8","bankId":"software","number":"11.8","title":"为什么 App 地址改了还需要改链接脚本？","stars":4,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>应用代码必须链接到其实际 Flash 起始位置，向量表和绝对地址才能正确；同时 Bootloader 与 App 的分区、擦写范围和向量表偏移必须一致。</p>"},{"id":"software-11.9","bankId":"software","number":"11.9","title":"OTA 升级流程如何描述？","stars":4,"section":"11. Bootloader、升级与系统启动","answerHtml":"<p>检查版本/策略 → 分块下载 → 每块校验与断点续传 → 整包哈希/签名验证 → 标记待试运行 → 重启切换 → 健康确认 → 正式提交；失败则回滚。要说明密钥保护与防降级策略。</p>\n<p>---</p>"},{"id":"software-12.1","bankId":"software","number":"12.1","title":"嵌入式常用调试手段有哪些？","stars":5,"section":"12. 调试、性能与工程质量","answerHtml":"<p>SWD/JTAG 断点与 Watch、串口/RTT 日志、GPIO 打点 + 示波器、逻辑分析仪、总线分析仪、HardFault 寄存器、map/反汇编、静态分析、单元测试和压力测试。面试时要说明不同工具各自解决什么问题。</p>"},{"id":"software-12.2","bankId":"software","number":"12.2","title":"断点会对实时系统造成什么影响？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>暂停 CPU 时外设、看门狗或其他总线节点可能继续运行，导致超时、数据溢出和时序改变；某些调试配置会冻结部分外设。实时问题更适合无侵入日志、追踪或 GPIO 打点。</p>"},{"id":"software-12.3","bankId":"software","number":"12.3","title":"如何定位“偶现死机”？","stars":5,"section":"12. 调试、性能与工程质量","answerHtml":"<p>先提高可观测性：复位原因、最后日志、任务状态、栈水位、堆最小值、异常寄存器、看门狗现场；构造高负载和边界条件复现；检查数组越界、竞态、栈溢出、ISR 优先级、DMA 缓冲生命周期和供电干扰。</p>"},{"id":"software-12.4","bankId":"software","number":"12.4","title":"如何定位内存被踩？","stars":5,"section":"12. 调试、性能与工程质量","answerHtml":"<p>使用 MPU/数据观察点、缓冲区前后哨兵、栈填充、编译器 sanitizer（在可运行的平台上）、缩小写入范围、检查 DMA 目标和长度；从第一次损坏位置向写入者追踪，而不是只看最终崩溃点。</p>"},{"id":"software-12.5","bankId":"software","number":"12.5","title":"如何测量一段代码执行时间？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>GPIO 前后翻转后用示波器/逻辑分析仪测量；使用 CPU 周期计数器或硬件定时器；多次统计最坏值。日志打时间戳适合较粗测量，但本身有扰动。</p>"},{"id":"software-12.6","bankId":"software","number":"12.6","title":"优化代码前应该做什么？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>先定义指标并测量热点，再优化算法、数据搬运、阻塞与任务架构，最后才是局部指令级优化；同时验证可读性、代码体积、最坏时间和正确性没有退化。</p>"},{"id":"software-12.7","bankId":"software","number":"12.7","title":"Debug 和 Release 表现不同的常见原因？","stars":5,"section":"12. 调试、性能与工程质量","answerHtml":"<p>未初始化变量、越界/未定义行为、竞态与时序变化、<code>volatile</code> 缺失、栈布局变化、优化消除无副作用循环、断言或日志改变执行时间。不要用关闭优化作为最终修复。</p>"},{"id":"software-12.8","bankId":"software","number":"12.8","title":"如何设计日志系统？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>等级、模块、时间戳、任务/中断上下文、固定格式；异步队列发送；限制格式化和带宽；过载时有丢弃策略；保留崩溃前关键环形日志；发布版可编译裁剪敏感信息和低等级日志。</p>"},{"id":"software-12.9","bankId":"software","number":"12.9","title":"什么是可重入函数？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>函数在尚未完成时可被另一个上下文再次调用且结果仍正确。通常不依赖可变静态/全局状态，或对共享状态有正确同步；不返回共享静态缓冲区。线程安全与可重入相关但不完全等同。</p>"},{"id":"software-12.10","bankId":"software","number":"12.10","title":"单元测试在嵌入式中怎么做？","stars":3,"section":"12. 调试、性能与工程质量","answerHtml":"<p>把纯逻辑与硬件访问分离；通过接口和 fake/mock 替换驱动；在主机上跑大量边界测试，在目标板做集成和硬件在环测试。协议解析、状态机、算法和错误处理最适合先做单测。</p>"},{"id":"software-12.11","bankId":"software","number":"12.11","title":"代码评审重点看什么？","stars":3,"section":"12. 调试、性能与工程质量","answerHtml":"<p>边界和错误路径、资源生命周期、并发访问、ISR 限制、超时、整数溢出、缓冲区长度、返回值、硬件寄存器副作用、日志和可测试性。</p>"},{"id":"software-12.12","bankId":"software","number":"12.12","title":"什么是 MISRA C？","stars":2,"section":"12. 调试、性能与工程质量","answerHtml":"<p>面向安全关键/高可靠 C 开发的一组编码规则，减少语言中危险或含糊用法。不是“使用后绝对没有 Bug”，通常配合静态分析、偏差记录、评审和测试。</p>"},{"id":"software-12.13","bankId":"software","number":"12.13","title":"Git 面试常问什么？","stars":3,"section":"12. 调试、性能与工程质量","answerHtml":"<p>工作区/暂存区/提交；branch、merge、rebase 的区别；如何解决冲突；如何撤销但保留历史；如何定位引入 Bug 的提交。项目回答中强调小步提交、清晰信息和评审流程。</p>"},{"id":"software-12.14","bankId":"software","number":"12.14","title":"编译器告警应该如何处理？","stars":4,"section":"12. 调试、性能与工程质量","answerHtml":"<p>提高告警等级并尽量零告警；理解告警根因，不能用强制类型转换或全局关闭掩盖问题；第三方库告警可隔离管理。重点关注符号转换、截断、未初始化、越界和格式字符串。</p>\n<p>---</p>"},{"id":"software-13.1","bankId":"software","number":"13.1","title":"进程和线程有什么区别？","stars":3,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>通用 OS 中进程拥有独立地址空间和资源，线程共享进程资源但有各自执行上下文和栈。FreeRTOS 的 task 更接近轻量执行线程，但通常没有进程级虚拟地址空间隔离。</p>"},{"id":"software-13.2","bankId":"software","number":"13.2","title":"上下文切换为什么有开销？","stars":4,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>需要保存/恢复寄存器和调度状态，还会影响 Cache、流水线与时间确定性；任务过多或过度唤醒会增加开销。优化重点常是减少无意义切换和共享竞争。</p>"},{"id":"software-13.3","bankId":"software","number":"13.3","title":"时间复杂度与空间复杂度是什么？","stars":3,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>描述输入规模增长时资源消耗的数量级。嵌入式还要关心常数项、最坏情况、内存上限和确定性，平均很快但最坏不可控的算法可能不适合实时路径。</p>"},{"id":"software-13.4","bankId":"software","number":"13.4","title":"链表与数组如何选择？","stars":4,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>数组连续、缓存友好、随机访问 O(1)，但中间插删可能搬移；链表节点分散、插删在已知位置可 O(1)，但查找 O(n)、有指针开销和碎片风险。MCU 中固定数组/对象池通常更可控。</p>"},{"id":"software-13.5","bankId":"software","number":"13.5","title":"如何实现生产者—消费者模型？","stars":4,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>任务间可用有限长度队列；生产者入队，消费者阻塞取队列；设计容量、超时、反压和关停协议。ISR 作为生产者时使用 <code>FromISR</code> API，并尽快把工作交给任务。</p>"},{"id":"software-13.6","bankId":"software","number":"13.6","title":"常见排序和查找算法需要掌握到什么程度？","stars":3,"section":"13. 操作系统与基础算法补充","answerHtml":"<p>会分析冒泡、插入、快速排序的时间/空间与最坏情况；理解二分查找的前提和边界；能写无溢出的中点及正确循环条件。校招笔试还常考链表、栈、队列、位运算。</p>\n<p>---</p>"},{"id":"software-14.1","bankId":"software","number":"14.1","title":"反转单链表。","stars":4,"section":"14. 高频手写题与代码题","answerHtml":"<p>掌握迭代三指针 <code>prev/current/next</code>；处理空链表和单节点；能分析 O(n) 时间、O(1) 额外空间。</p>"},{"id":"software-14.2","bankId":"software","number":"14.2","title":"判断链表是否有环。","stars":3,"section":"14. 高频手写题与代码题","answerHtml":"<p>快慢指针；相遇说明有环。追问可能要求找入环点和计算环长。</p>"},{"id":"software-14.3","bankId":"software","number":"14.3","title":"实现 `strlen`、`strcpy` 或 `memcpy`。","stars":4,"section":"14. 高频手写题与代码题","answerHtml":"<p>先澄清接口约束；处理空指针策略、终止符、长度和区域重叠。若要求工程安全版本，要接收目标容量并返回错误。</p>"},{"id":"software-14.4","bankId":"software","number":"14.4","title":"实现环形队列。","stars":5,"section":"14. 高频手写题与代码题","answerHtml":"<p>说明空满判定、索引回绕、容量类型、并发模型；再写入队出队。面试官往往比代码本身更关注边界和线程安全。</p>"},{"id":"software-14.5","bankId":"software","number":"14.5","title":"实现按位统计 1 的个数。","stars":3,"section":"14. 高频手写题与代码题","answerHtml":"<p>循环执行 <code>x &amp;= x - 1</code>，每次清除最低位的一个 1；复杂度与 1 的个数相关。</p>"},{"id":"software-14.6","bankId":"software","number":"14.6","title":"不用临时变量交换两个数是否值得做？","stars":2,"section":"14. 高频手写题与代码题","answerHtml":"<p>异或交换有别名风险且可读性差，加减交换有溢出风险。工程上优先临时变量，面试中应指出技巧的局限。</p>"},{"id":"software-14.7","bankId":"software","number":"14.7","title":"写一个非阻塞按键消抖状态机。","stars":4,"section":"14. 高频手写题与代码题","answerHtml":"<p>状态可包含稳定释放、确认按下、稳定按下、确认释放；周期采样并记录时间，不使用长阻塞延时；输出按下、释放、长按等事件。</p>"},{"id":"software-14.8","bankId":"software","number":"14.8","title":"写一个 UART 帧解析状态机。","stars":5,"section":"14. 高频手写题与代码题","answerHtml":"<p>按同步头 → 固定头 → 长度 → 负载 → CRC 解析；每步检查最大长度和超时；错误后能从当前数据中重新同步；输入可能任意分片。</p>"},{"id":"software-14.9","bankId":"software","number":"14.9","title":"两任务安全访问同一个 I²C/SPI 设备怎么办？","stars":5,"section":"14. 高频手写题与代码题","answerHtml":"<p>方案一：互斥量保护完整事务，锁内保持 CS/重复起始等原子语义；方案二：单独总线管理任务 + 请求队列。还要处理超时、优先级反转、设备状态和错误恢复。</p>"},{"id":"software-14.10","bankId":"software","number":"14.10","title":"设计一个“中断采样、任务处理”的数据通路。","stars":5,"section":"14. 高频手写题与代码题","answerHtml":"<p>ISR 只读取必要状态或确认 DMA 缓冲，随后用任务通知/队列唤醒处理任务；处理任务解析、滤波并传给业务任务；明确双缓冲、所有权、队列满策略和最坏吞吐。</p>\n<p>---</p>"},{"id":"software-16.1","bankId":"software","number":"16.1","title":"串口高速接收时偶尔丢包，你如何排查？","stars":5,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>推荐回答顺序：</p>\n<ol>\n<li>量化波特率、包长、到达突发性和丢包位置；</li>\n<li>检查物理层和串口错误标志；</li>\n<li>检查 ISR 延迟、DMA/环形缓冲、队列是否溢出；</li>\n<li>统计各级缓冲高水位和处理耗时；</li>\n<li>用 DMA 循环 + IDLE/半满满事件、扩大合理缓冲、批处理或提升消费者能力；</li>\n<li>明确定义过载策略并做长时间压力测试。</li>\n</ol>"},{"id":"software-16.2","bankId":"software","number":"16.2","title":"系统运行几小时后卡死，重启恢复，怎么办？","stars":5,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>记录复位原因与卡死现场；看任务列表、运行时间、栈高水位、堆最小值、锁持有情况和队列状态；排查泄漏、碎片、栈溢出、死锁、计数溢出、tick 回绕、DMA 越界与电源问题；用看门狗恢复但不能以复位代替根因修复。</p>"},{"id":"software-16.3","bankId":"software","number":"16.3","title":"高优先级任务响应变慢，可能是什么原因？","stars":5,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>长时间关中断/临界区、更高优先级 ISR、等待低优先级持有的资源、优先级反转、调度器被挂起、Cache/总线争用、错误阻塞超时、任务本身执行变长。用时间戳/追踪/GPIO 测量各阶段延迟。</p>"},{"id":"software-16.4","bankId":"software","number":"16.4","title":"I²C 设备偶发无响应，如何让产品自动恢复？","stars":4,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>所有事务设置超时；记录错误类型；先复位 I²C 外设，必要时 GPIO 模式恢复总线和生成 STOP；复位/重上电从机；采用有限次数退避重试；持续失败上报并隔离设备，避免整个系统永久阻塞。</p>"},{"id":"software-16.5","bankId":"software","number":"16.5","title":"两个任务互相等待导致死锁，如何定位？","stars":4,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>记录锁获取/释放和任务状态；查看两个任务阻塞对象及锁所有者；构造锁依赖图；修复为统一锁顺序、减少嵌套或单任务拥有资源；加入超时和诊断，但不要把超时当唯一修复。</p>"},{"id":"software-16.6","bankId":"software","number":"16.6","title":"采样频率固定，但处理偶尔来不及，如何设计？","stars":4,"section":"16. 场景题：面试官更看重思路","answerHtml":"<p>硬件定时器触发 ADC + DMA，使用双缓冲；处理任务由半满/满事件唤醒；分析最坏处理时间必须小于缓冲覆盖周期；过载时定义降采样、丢块或报警策略；避免在 ISR 中做算法。</p>\n<p>---</p>"}]},{"id":"hardware","name":"嵌入式硬件","file":"硬件工程师秋招面试题库.md","accent":"#e76f51","questions":[{"id":"hardware-0.1","bankId":"hardware","number":"0.1","title":"一分钟自我介绍怎么讲？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>建议结构：学校与专业 → 硬件技术栈 → 最有代表性的板卡/项目 → 自己负责的工作 → 一个量化结果或典型问题 → 求职方向。</p>\n<p>示例骨架：</p>\n<blockquote>我主要做嵌入式硬件开发，熟悉 MCU 最小系统、电源、常见接口及两/四层板设计流程。项目中负责过器件选型、原理图、PCB 检查、焊接调试和联调，曾通过……定位并解决……，最终实现……。我希望应聘控制板、物联网或工控方向的硬件工程师岗位。</blockquote>"},{"id":"hardware-0.2","bankId":"hardware","number":"0.2","title":"如何介绍一个硬件项目？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>必须覆盖：</p>\n<ul>\n<li>需求、应用场景和关键指标；</li>\n<li>系统框图：输入电源、主控、传感器、通信、执行器；</li>\n<li>你独立负责的原理图、PCB 或调试部分；</li>\n<li>关键器件为什么这样选；</li>\n<li>最难的问题、测量证据和定位过程；</li>\n<li>功耗、纹波、温升、通信距离、EMC、良率等结果；</li>\n<li>如果重做一次会如何改版。</li>\n</ul>"},{"id":"hardware-0.3","bankId":"hardware","number":"0.3","title":"为什么想做硬件工程师？","stars":4,"section":"0. 自我介绍与项目表达","answerHtml":"<p>回答要落到真实经历：喜欢把需求变为可测量的电路、愿意看手册和波形、能耐心定位板级问题；不要只说“喜欢焊板子”。</p>"},{"id":"hardware-0.4","bankId":"hardware","number":"0.4","title":"原理图到量产通常经历哪些阶段？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>需求与指标 → 系统方案 → 器件选型与风险评估 → 原理图 → 评审与 ERC → PCB 约束/布局布线 → DRC/可制造性检查 → 打样 → 焊接与上电 → 单元测试 → 系统联调 → 环境/EMC/可靠性测试 → 试产和量产问题闭环。</p>"},{"id":"hardware-0.5","bankId":"hardware","number":"0.5","title":"项目中最严重的硬件故障是什么？","stars":5,"section":"0. 自我介绍与项目表达","answerHtml":"<p>按“现象 → 复现条件 → 分块隔离 → 测量证据 → 根因 → 修改 → 回归验证”回答。必须说出使用的工具和具体波形/数值，避免只说“查资料后解决了”。</p>\n<p>---</p>"},{"id":"hardware-1.1","bankId":"hardware","number":"1.1","title":"欧姆定律、KCL、KVL 分别是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<ul>\n<li>欧姆定律：在线性电阻条件下 <code>V = IR</code>；</li>\n<li>KCL：节点流入电流代数和等于流出电流代数和；</li>\n<li>KVL：闭合回路电压代数和为零。</li>\n</ul>\n<p>回答时注意它们成立的模型和参考方向。</p>"},{"id":"hardware-1.2","bankId":"hardware","number":"1.2","title":"戴维南等效和诺顿等效是什么？","stars":4,"section":"1. 电路基础","answerHtml":"<p>线性二端网络可等效为理想电压源串联电阻，或理想电流源并联电阻。常用于分析负载、分压器输出阻抗和最大功率传输。</p>"},{"id":"hardware-1.3","bankId":"hardware","number":"1.3","title":"RC 电路充放电规律是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<p>时间常数 <code>τ = RC</code>；一阶响应经过 1τ 达到最终变化量约 63.2%，约 5τ 可视为基本稳定。要能分析上电复位、按键滤波、软启动和延时电路。</p>"},{"id":"hardware-1.4","bankId":"hardware","number":"1.4","title":"电容和电感的基本特性是什么？","stars":5,"section":"1. 电路基础","answerHtml":"<p>理想电容电压不能突变，<code>i = C·dv/dt</code>；理想电感电流不能突变，<code>v = L·di/dt</code>。真实器件存在 ESR、ESL、额定电压/电流、自谐振和温度特性。</p>"},{"id":"hardware-1.5","bankId":"hardware","number":"1.5","title":"容抗和感抗如何计算？","stars":4,"section":"1. 电路基础","answerHtml":"<p><code>|Xc| = 1/(2πfC)</code>，频率越高容抗越低；<code>|Xl| = 2πfL</code>，频率越高感抗越高。实际高频下寄生参数会使规律在自谐振点附近改变。</p>"},{"id":"hardware-1.6","bankId":"hardware","number":"1.6","title":"一阶 RC 低通和高通如何判断？","stars":5,"section":"1. 电路基础","answerHtml":"<p>低通通常串 R、对地 C，从电容两端取输出；高通通常串 C、对地 R，从电阻两端取输出。截止频率 <code>fc = 1/(2πRC)</code>，在截止点幅度约下降 3 dB。</p>"},{"id":"hardware-1.7","bankId":"hardware","number":"1.7","title":"分贝 dB 如何计算？","stars":4,"section":"1. 电路基础","answerHtml":"<p>功率比用 <code>10log10(P2/P1)</code>；相同阻抗下电压或电流幅值比用 <code>20log10(V2/V1)</code>。3 dB 约对应功率 2 倍，20 dB 对应幅值 10 倍。</p>"},{"id":"hardware-1.8","bankId":"hardware","number":"1.8","title":"有功功率、无功功率和视在功率是什么？","stars":2,"section":"1. 电路基础","answerHtml":"<p>交流系统中有功功率完成净能量传递，无功功率在储能元件与电源间交换，视在功率综合电压电流有效值；功率因数反映有功与视在功率关系。</p>"},{"id":"hardware-1.9","bankId":"hardware","number":"1.9","title":"电阻串并联如何计算？","stars":5,"section":"1. 电路基础","answerHtml":"<p>串联电阻相加；并联满足倒数相加。两电阻并联为 <code>R1R2/(R1+R2)</code>。还要能算分压器输出及负载接入后的误差。</p>"},{"id":"hardware-1.10","bankId":"hardware","number":"1.10","title":"上拉和下拉电阻有什么作用？阻值如何选？","stars":5,"section":"1. 电路基础","answerHtml":"<p>提供默认逻辑电平，避免输入悬空；阻值要在功耗、抗干扰、上升时间、漏电流和驱动能力间权衡。I²C 等开漏总线还需根据总线电容和速率计算上升时间。</p>"},{"id":"hardware-1.11","bankId":"hardware","number":"1.11","title":"什么是阻抗匹配？什么时候必须考虑？","stars":4,"section":"1. 电路基础","answerHtml":"<p>当互连的传播延时相对信号上升时间不可忽略时，走线应按传输线处理，通过源端、端接或差分阻抗控制减少反射。不能只依据时钟频率判断，高速边沿的低频信号也可能需要。</p>"},{"id":"hardware-1.12","bankId":"hardware","number":"1.12","title":"什么是谐振？串联和并联谐振有何特点？","stars":3,"section":"1. 电路基础","answerHtml":"<p>理想 LC 谐振频率 <code>f0 = 1/(2π√LC)</code>。串联谐振阻抗最低，并联谐振阻抗最高；实际品质因数和损耗由寄生电阻决定。</p>\n<p>---</p>"},{"id":"hardware-2.1","bankId":"hardware","number":"2.1","title":"选电阻要看哪些参数？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>阻值、精度、额定功率、温漂、最大工作电压、封装、脉冲承受能力和噪声。功率应按最坏电压/电流计算并留降额余量。</p>"},{"id":"hardware-2.2","bankId":"hardware","number":"2.2","title":"电阻额定功率如何计算与降额？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>使用 <code>P=I²R=V²/R=VI</code>。额定功率是在规定环境温度和散热条件下给出，高温时需要按曲线降额；浪涌场景还要看脉冲能量，不能只看平均功率。</p>"},{"id":"hardware-2.3","bankId":"hardware","number":"2.3","title":"0Ω 电阻有什么用途？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>配置选择、跨接、调试隔离、预留电流测量位置、单点连接或兼容不同版本。它并非真正零阻抗，也有额定电流和寄生电感。</p>"},{"id":"hardware-2.4","bankId":"hardware","number":"2.4","title":"选电容要看哪些参数？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>容量、耐压、介质、容差、温度范围、ESR/ESL、纹波电流、漏电和寿命。MLCC 还要特别关注直流偏压导致的有效容量下降。</p>"},{"id":"hardware-2.5","bankId":"hardware","number":"2.5","title":"X7R、X5R、C0G/NP0 有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>C0G/NP0 稳定性好、损耗低、容量较小，适合精密和高频；X7R/X5R 容量大但随偏压、温度和时间变化。X7R 温度上限通常高于 X5R，具体以规格书为准。</p>"},{"id":"hardware-2.6","bankId":"hardware","number":"2.6","title":"为什么去耦常用 0.1 μF？所有芯片都固定这样吗？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>0.1 μF 是常见经验值，在一定频段提供局部瞬态电流，但不是万能值。应依据芯片手册、电源阻抗目标、封装寄生和频段组合不同容量，并把小电容尽量靠近电源引脚。</p>"},{"id":"hardware-2.7","bankId":"hardware","number":"2.7","title":"旁路、去耦和储能电容有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>术语常有重叠：去耦/旁路电容为高频电流提供就近回路、降低电源噪声；储能/大容量电容应对较低频负载变化和输入跌落。布局和回路面积往往比名义容量更关键。</p>"},{"id":"hardware-2.8","bankId":"hardware","number":"2.8","title":"电解电容和陶瓷电容如何选择？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>电解容量大、适合低频储能但有极性、ESR 和寿命问题；陶瓷 ESR/ESL 小、适合高频但容量随偏压下降，过低 ESR 也可能影响某些稳压器稳定性。</p>"},{"id":"hardware-2.9","bankId":"hardware","number":"2.9","title":"选电感要看哪些参数？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>电感量、容差、饱和电流、温升电流、DCR、损耗、屏蔽结构和自谐振频率。开关电源中不能只看电感量，必须同时验证峰值电流和温升。</p>"},{"id":"hardware-2.10","bankId":"hardware","number":"2.10","title":"磁珠和电感有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>磁珠主要在高频呈损耗性阻抗，把噪声能量转为热；电感主要储能。磁珠选型要看阻抗曲线、直流偏置和额定电流，不能只看“100 MHz 时 600Ω”。</p>"},{"id":"hardware-2.11","bankId":"hardware","number":"2.11","title":"普通二极管、肖特基和稳压二极管如何区分？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>普通二极管用于整流/钳位；肖特基正向压降低、恢复快但漏电较大、耐压通常较低；稳压二极管在反向击穿区稳压或钳位，需要限流并校核功耗。</p>"},{"id":"hardware-2.12","bankId":"hardware","number":"2.12","title":"TVS 与稳压二极管有什么区别？","stars":4,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>TVS 针对短时高能瞬态，强调浪涌功率、响应和钳位电压；普通稳压管多用于稳压或低能量钳位。接口防护要核对工作电压、反向关断电压、击穿与钳位电压。</p>"},{"id":"hardware-2.13","bankId":"hardware","number":"2.13","title":"二极管反向恢复是什么？","stars":3,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p>二极管从导通切换到反向截止时需清除存储电荷，短时间产生反向电流。高频开关电路中会增加损耗和 EMI，因此常用快恢复或肖特基器件。</p>"},{"id":"hardware-2.14","bankId":"hardware","number":"2.14","title":"LED 限流电阻如何计算？","stars":5,"section":"2. 电阻、电容、电感与二极管","answerHtml":"<p><code>R = (Vsupply - Vf) / Iled</code>，再校核电阻功率和最坏参数。Vf 随颜色、温度和电流变化，应留余量；多个 LED 并联不能简单共用一个电阻而不考虑电流均分。</p>\n<p>---</p>"},{"id":"hardware-3.1","bankId":"hardware","number":"3.1","title":"BJT 的三个工作区是什么？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>截止区、放大区、饱和区。做开关时工作在截止和饱和，基极电流要足以保证饱和；做放大时需设置合适静态工作点。</p>"},{"id":"hardware-3.2","bankId":"hardware","number":"3.2","title":"NPN 三极管驱动负载如何计算基极电阻？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>先由负载电流选择强迫放大倍数，估算 <code>Ib</code>，再用 <code>(Vdrive - Vbe)/Ib</code> 计算基极电阻并校核 GPIO 驱动能力。不能直接用数据手册最大 β 作为饱和设计依据。</p>"},{"id":"hardware-3.3","bankId":"hardware","number":"3.3","title":"MOSFET 的栅极是否消耗电流？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>稳态理想上几乎不消耗直流电流，但切换时需对栅极电荷充放电，产生瞬态驱动电流和开关损耗。高频或大 MOS 管需要专用栅极驱动器。</p>"},{"id":"hardware-3.4","bankId":"hardware","number":"3.4","title":"MOSFET 的 `Vgs(th)` 是完全导通电压吗？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>不是。阈值电压只表示在很小测试电流下刚开始导通。应查看目标 <code>Vgs</code> 下的 <code>Rds(on)</code>，并考虑温度与批次；3.3 V GPIO 要选择真正适合低栅压驱动的器件。</p>"},{"id":"hardware-3.5","bankId":"hardware","number":"3.5","title":"选 MOSFET 要看哪些参数？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p><code>Vds</code>、连续/脉冲电流、目标 <code>Vgs</code> 下的 <code>Rds(on)</code>、总栅电荷 Qg、功耗与热阻、SOA、体二极管、雪崩能力和封装。额定电流常受理想散热条件限制，不能直接照抄。</p>"},{"id":"hardware-3.6","bankId":"hardware","number":"3.6","title":"MOSFET 导通损耗和开关损耗如何估算？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>导通损耗近似 <code>I²Rds(on)</code>；开关损耗与电压、电流、开关时间和频率相关，粗略可按每次电压电流重叠面积估计。还要计入栅极驱动和体二极管损耗。</p>"},{"id":"hardware-3.7","bankId":"hardware","number":"3.7","title":"高边开关和低边开关区别？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>低边开关器件位于负载与地之间，驱动简单但负载地不再固定；高边开关位于电源与负载之间，便于保持共地，但 N-MOS 常需升压驱动，或使用 P-MOS/专用负载开关。</p>"},{"id":"hardware-3.8","bankId":"hardware","number":"3.8","title":"P-MOS 与 N-MOS 如何选择？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>同等级下 N-MOS 通常导通电阻更低、性能更好；P-MOS 高边驱动简单但损耗通常更大。根据电压、电流、效率和驱动复杂度选择。</p>"},{"id":"hardware-3.9","bankId":"hardware","number":"3.9","title":"栅极串联电阻和下拉电阻分别做什么？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>串联电阻限制栅极充放电峰值、抑制振铃并控制开关速度；下拉/上拉确保控制端悬空或上电时 MOSFET 保持确定状态。阻值要在 EMI 与开关损耗间权衡。</p>"},{"id":"hardware-3.10","bankId":"hardware","number":"3.10","title":"驱动继电器、电机或电磁阀为什么要续流？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>感性负载关断时电流不能突变，会产生高压。续流二极管、TVS 或 RCD 为电流提供路径并限制电压。普通二极管钳位低但释放慢，TVS 钳位高而释放快。</p>"},{"id":"hardware-3.11","bankId":"hardware","number":"3.11","title":"MOSFET 为什么会发热？","stars":5,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>导通电阻损耗、开关过慢、驱动电压不足、高频切换、线性区工作、散热不足、浪涌或负载过流。要用示波器同时观察 Vgs、Vds 和电流，并测温升。</p>"},{"id":"hardware-3.12","bankId":"hardware","number":"3.12","title":"什么是米勒平台？","stars":3,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>MOSFET 切换过程中，栅漏电容充放电使 Vgs 暂时停留在平台，期间 Vds 主要变化。平台长度与驱动电流影响开关时间和损耗。</p>"},{"id":"hardware-3.13","bankId":"hardware","number":"3.13","title":"H 桥的直通是什么？如何避免？","stars":4,"section":"3. 二极管、三极管与 MOSFET","answerHtml":"<p>上下桥臂同时导通形成电源到地的低阻通路。通过死区时间、互锁驱动、合理栅极电阻和硬件保护避免，同时检查米勒效应导致的误导通。</p>\n<p>---</p>"},{"id":"hardware-4.1","bankId":"hardware","number":"4.1","title":"理想运放有哪些假设？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>开环增益无穷大、输入阻抗无穷大、输出阻抗为零、带宽无穷大、失调为零。负反馈且未饱和时可用“虚短、虚断”分析，但这不是任何情况下都成立。</p>"},{"id":"hardware-4.2","bankId":"hardware","number":"4.2","title":"反相和同相放大器增益是多少？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>反相：<code>Av = -Rf/Rin</code>；同相：<code>Av = 1 + Rf/Rg</code>。还要检查输入共模范围、输出摆幅、带宽、稳定性和供电。</p>"},{"id":"hardware-4.3","bankId":"hardware","number":"4.3","title":"什么是虚短和虚断？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>虚短：在负反馈线性工作时两输入端电压近似相等；虚断：输入电流近似为零。运放饱和、开环比较、超出共模范围或不稳定振荡时不能直接套用。</p>"},{"id":"hardware-4.4","bankId":"hardware","number":"4.4","title":"运放选型看哪些参数？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>供电范围、输入共模范围、输出摆幅、输入失调和漂移、偏置电流、噪声、增益带宽积、压摆率、稳定增益、输入输出是否轨到轨、负载能力和封装。</p>"},{"id":"hardware-4.5","bankId":"hardware","number":"4.5","title":"增益带宽积和压摆率分别限制什么？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>增益带宽积限制小信号闭环带宽；压摆率限制大信号电压变化速度。输出正弦波不失真的最低压摆率约为 <code>2πfVpeak</code>。</p>"},{"id":"hardware-4.6","bankId":"hardware","number":"4.6","title":"轨到轨输入/输出意味着真的能到电源轨吗？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>不一定。输入共模和输出摆幅通常仍与负载、电源和温度有关，规格书会给出距离电源轨的余量。必须按实际供电和输出电流核对。</p>"},{"id":"hardware-4.7","bankId":"hardware","number":"4.7","title":"运放为什么会振荡？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>相位裕量不足、容性负载、反馈布局过长、电源去耦不良、增益低于稳定要求等。用示波器观察振铃/振荡，按手册增加隔离电阻、补偿网络或更换合适运放。</p>"},{"id":"hardware-4.8","bankId":"hardware","number":"4.8","title":"运放和比较器能互换吗？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>通常不建议。比较器为开环快速翻转设计，输出可能为开漏；运放为负反馈线性工作设计，过驱恢复可能慢。按目标功能使用对应器件。</p>"},{"id":"hardware-4.9","bankId":"hardware","number":"4.9","title":"比较器为什么需要迟滞？","stars":5,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>输入在阈值附近有噪声或变化缓慢时，输出可能反复翻转。正反馈形成两个阈值，提供迟滞，提高抗噪能力；要会根据电阻网络计算上下阈值。</p>"},{"id":"hardware-4.10","bankId":"hardware","number":"4.10","title":"单电源系统如何测双极性信号？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>可将信号偏置到中点参考电压，再放大/滤波；或使用支持负输入的前端/双电源。中点参考必须具有足够驱动能力和低噪声，不能只用高阻分压直接带复杂负载。</p>"},{"id":"hardware-4.11","bankId":"hardware","number":"4.11","title":"差分放大器和仪表放大器适合什么场景？","stars":3,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>用于提取两个输入之差并抑制共模。仪表放大器通常输入阻抗高、CMRR 高、增益易设置，适合传感器小信号；电阻匹配和输入共模范围很关键。</p>"},{"id":"hardware-4.12","bankId":"hardware","number":"4.12","title":"ADC 前端为什么常加 RC？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>限制带宽、抗混叠、降低高频噪声并为采样瞬间提供局部电荷。但电阻过大会影响 ADC 采样保持电容充电，需结合采样时间和驱动能力设计。</p>"},{"id":"hardware-4.13","bankId":"hardware","number":"4.13","title":"什么是共模抑制比 CMRR？","stars":3,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>衡量差分放大器抑制共模信号的能力，通常以 dB 表示。实际 CMRR 会受电阻匹配、频率、布局和输入范围影响。</p>"},{"id":"hardware-4.14","bankId":"hardware","number":"4.14","title":"模拟信号出现 50/60 Hz 干扰如何排查？","stars":4,"section":"4. 运算放大器与模拟信号链","answerHtml":"<p>检查接地回路、屏蔽、探头接法、输入阻抗、线缆和电源耦合；使用差分测量、双绞线、合理单点连接和共模抑制；滤波应建立在找到耦合路径之后。</p>\n<p>---</p>"},{"id":"hardware-5.1","bankId":"hardware","number":"5.1","title":"组合逻辑和时序逻辑区别？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>组合逻辑输出只与当前输入有关；时序逻辑还与历史状态有关，通常由触发器和时钟保存状态。</p>"},{"id":"hardware-5.2","bankId":"hardware","number":"5.2","title":"建立时间、保持时间是什么？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>数据在采样时钟边沿前必须稳定的最短时间称建立时间，边沿后需继续稳定的最短时间称保持时间。违反可能导致亚稳态或采样错误。</p>"},{"id":"hardware-5.3","bankId":"hardware","number":"5.3","title":"什么是亚稳态？如何降低风险？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>异步信号在时钟采样窗口附近变化时，触发器输出可能暂时处于不确定状态。单比特跨时钟域常用两级同步器降低传播概率；多位总线需握手、异步 FIFO 或编码协议。</p>"},{"id":"hardware-5.4","bankId":"hardware","number":"5.4","title":"TTL 与 CMOS 电平有什么区别？","stars":3,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>输入阈值、输出电平和驱动能力不同。接口兼容不能只看供电电压，要核对 <code>VIH/VIL/VOH/VOL</code>、输入容限和电流。</p>"},{"id":"hardware-5.5","bankId":"hardware","number":"5.5","title":"3.3 V 与 5 V 系统如何电平转换？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>先确认器件是否 5 V 容忍；单向信号可用分压、缓冲器或晶体管，双向开漏信号可用 MOS 管电平转换，推挽高速总线用专用转换芯片。分压不适合所有高速或双向场景。</p>"},{"id":"hardware-5.6","bankId":"hardware","number":"5.6","title":"开漏与推挽输出区别？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>推挽可主动拉高和拉低，速度快；开漏只能主动拉低，需上拉，可实现多设备线与、双向总线和电平转换。开漏上升沿由上拉与总线电容决定。</p>"},{"id":"hardware-5.7","bankId":"hardware","number":"5.7","title":"施密特触发输入有什么作用？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>具有不同的上升和下降阈值，可抑制慢边沿和噪声引起的多次翻转，适合按键、长线或波形整形。</p>"},{"id":"hardware-5.8","bankId":"hardware","number":"5.8","title":"为什么悬空 CMOS 输入危险？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>电平不确定，容易受干扰并可能使上下管同时部分导通，增加功耗。未使用输入应按手册上拉、下拉或配置为确定状态。</p>"},{"id":"hardware-5.9","bankId":"hardware","number":"5.9","title":"时钟信号为什么特别关注完整性？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>时钟边沿决定系统采样，反射、过冲、串扰或慢边沿会造成重复触发、抖动和时序裕量下降。需控制回流路径、阻抗、端接和远离噪声源。</p>"},{"id":"hardware-5.10","bankId":"hardware","number":"5.10","title":"GPIO 驱动能力怎么看？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>查看单引脚和端口总电流限制，以及规定电流下的 <code>VOH/VOL</code>，不能只看“最大 20 mA”。大负载应加驱动器，且同时考虑封装总功耗。</p>"},{"id":"hardware-5.11","bankId":"hardware","number":"5.11","title":"按键硬件消抖如何设计？","stars":3,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>RC 滤波配合施密特输入，或专用消抖芯片。RC 常数要兼顾抖动持续时间和响应，且检查上电状态与 GPIO 阈值。</p>"},{"id":"hardware-5.12","bankId":"hardware","number":"5.12","title":"晶振不起振可能是什么原因？","stars":5,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>负载电容不合适、布局过长/不对称、焊接问题、器件参数或驱动能力不匹配、探头负载过大、供电/地噪声、配置错误。测量应使用低电容探头或测时钟输出，避免普通探头改变振荡条件。</p>"},{"id":"hardware-5.13","bankId":"hardware","number":"5.13","title":"晶体负载电容如何估算？","stars":4,"section":"5. 数字电路与逻辑接口","answerHtml":"<p>近似 <code>CL = (C1×C2)/(C1+C2) + Cstray</code>；若两侧相等，则每只外部电容通常约为 <code>2(CL-Cstray)</code>。实际需结合芯片内部电容、板级寄生和频偏调试。</p>\n<p>---</p>"},{"id":"hardware-6.1","bankId":"hardware","number":"6.1","title":"MCU 最小系统包括什么？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>稳定电源与每组去耦、复位、时钟或内部时钟配置、启动模式配置、下载调试接口，以及芯片要求的模拟电源/参考和电源时序。还要预留测试点。</p>"},{"id":"hardware-6.2","bankId":"hardware","number":"6.2","title":"MCU 每个 VDD 附近都需要去耦吗？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>通常需要按手册为每组电源引脚就近配置去耦，电容到电源脚和地回路要短而小。不能因为原理图上并联等效就把电容集中放在远处。</p>"},{"id":"hardware-6.3","bankId":"hardware","number":"6.3","title":"复位电路如何设计？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>满足复位低/高电平时间、上电电源爬升和噪声要求；可使用内部 POR/BOR、RC、复位监控器和按键。RC 方案简单，但对慢上电、快速掉电重启和阈值容差可能不可靠。</p>"},{"id":"hardware-6.4","bankId":"hardware","number":"6.4","title":"BOOT 引脚如何处理？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>通过上拉/下拉设置默认启动源，并预留跳帽、测试点或按键进入系统 Bootloader；阻值和状态需满足采样时刻要求，不能悬空。</p>"},{"id":"hardware-6.5","bankId":"hardware","number":"6.5","title":"SWD/JTAG 接口需要注意什么？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>信号、电源参考、地、复位和连接器定义；走线短、参考连续；避免外部电路强驱动复用引脚；预留串联电阻或测试点；确认下载器电平与目标板一致。</p>"},{"id":"hardware-6.6","bankId":"hardware","number":"6.6","title":"UART、I²C、SPI 的硬件差异是什么？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>UART 异步点对点、线少；I²C 两线开漏、需上拉、支持寻址多设备；SPI 同步全双工、速度高但片选和引脚多。选择还要考虑距离、抗干扰、吞吐和电平。</p>"},{"id":"hardware-6.7","bankId":"hardware","number":"6.7","title":"I²C 上拉阻值如何确定？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>上限由总线电容和允许上升时间决定，下限由器件低电平灌电流及 <code>VOL</code> 决定。在两者之间选择，并验证最坏温度、电压和并联上拉后的等效阻值。</p>"},{"id":"hardware-6.8","bankId":"hardware","number":"6.8","title":"SPI 串联电阻放在哪里？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>源端串联端接应靠近驱动端放置，以减缓边沿并吸收反射；时钟通常优先考虑。双向数据线的驱动端会变化，需结合拓扑和速率处理。</p>"},{"id":"hardware-6.9","bankId":"hardware","number":"6.9","title":"UART 外接接口为什么要确认电平标准？","stars":5,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>MCU UART 通常是 CMOS/TTL 电平，不能直接连接 RS-232；RS-485 也需要收发器。必须确认电压、极性、共地、连接器定义和 ESD 防护。</p>"},{"id":"hardware-6.10","bankId":"hardware","number":"6.10","title":"RS-485 硬件设计要点？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>差分收发器、总线两端终端、适当偏置、菊链拓扑、短支线、方向控制、共模范围、隔离需求和 TVS/共模电感等保护。不能每个节点都并 120Ω。</p>"},{"id":"hardware-6.11","bankId":"hardware","number":"6.11","title":"CAN 硬件设计要点？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>收发器供电与待机控制、两端 120Ω 终端、差分成对布线、短支线、共模和 ESD 防护、连接器与地参考；汽车环境还要关注浪涌、反接与共模扼流圈选型。</p>"},{"id":"hardware-6.12","bankId":"hardware","number":"6.12","title":"USB 2.0 硬件设计注意什么？","stars":3,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>90Ω 差分阻抗、等长与连续参考面、少过孔、连接器附近 ESD、VBUS 检测/供电规则、器件端串联电阻按参考设计、避免在差分对下方切割地平面。</p>"},{"id":"hardware-6.13","bankId":"hardware","number":"6.13","title":"ADC 参考电压为什么重要？","stars":4,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>ADC 结果与参考电压直接相关。参考源的噪声、精度、温漂和负载稳定性会影响测量；需合理去耦、模拟地回路和源阻抗，并可通过校准改善系统误差。</p>"},{"id":"hardware-6.14","bankId":"hardware","number":"6.14","title":"未使用 MCU 引脚如何处理？","stars":3,"section":"6. MCU 最小系统与常见接口","answerHtml":"<p>按芯片手册设置为模拟输入、带上下拉的输入或其他低功耗安全状态；避免悬空和误驱动。特殊引脚不能一概而论。</p>\n<p>---</p>"},{"id":"hardware-7.1","bankId":"hardware","number":"7.1","title":"LDO 和 Buck 如何选择？","stars":5,"section":"7. 电源设计","answerHtml":"<p>LDO 简单、噪声低，但效率约为 <code>Vout/Vin</code>，压差大发热明显；Buck 效率高、适合大压差/大电流，但纹波、EMI 和布局更复杂。依据压差、电流、噪声、热与成本综合选择。</p>"},{"id":"hardware-7.2","bankId":"hardware","number":"7.2","title":"LDO 的压差、静态电流和 PSRR 是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>压差是维持稳压所需最小输入输出差；静态电流影响轻载功耗；PSRR 表示对输入纹波的抑制能力，随频率和输出电容变化。选型还要看稳定性要求和瞬态响应。</p>"},{"id":"hardware-7.3","bankId":"hardware","number":"7.3","title":"LDO 发热如何计算？","stars":5,"section":"7. 电源设计","answerHtml":"<p>近似 <code>P=(Vin-Vout)×Iout + Vin×Iq</code>。结温估算 <code>Tj≈Ta+P×θJA</code>，实际还受铜皮、封装、气流影响。必须在最高输入、最大负载、最高环境温度下校核。</p>"},{"id":"hardware-7.4","bankId":"hardware","number":"7.4","title":"Buck 的基本工作原理是什么？","stars":5,"section":"7. 电源设计","answerHtml":"<p>开关管周期性把输入能量传给电感，续流路径在关断期间维持电感电流，LC 滤波得到较低输出。占空比理想近似 <code>D≈Vout/Vin</code>，实际受损耗和控制方式影响。</p>"},{"id":"hardware-7.5","bankId":"hardware","number":"7.5","title":"Boost 的基本工作原理是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>开关闭合时电感储能，关断时电感电压与输入叠加向输出供能，从而升压。输出关断、启动浪涌、开关管电压应力和二极管/同步管选型需特别关注。</p>"},{"id":"hardware-7.6","bankId":"hardware","number":"7.6","title":"Buck 电感值如何影响纹波？","stars":4,"section":"7. 电源设计","answerHtml":"<p>电感越大，电流纹波通常越小，但体积、DCR 和动态响应可能变差。按输入输出、电流、频率和目标纹波计算，并确保峰值电流低于饱和电流且温升可接受。</p>"},{"id":"hardware-7.7","bankId":"hardware","number":"7.7","title":"输出电容如何影响稳压器？","stars":4,"section":"7. 电源设计","answerHtml":"<p>容量与 ESR 影响纹波、负载瞬态和环路稳定性。必须满足手册允许范围；不能简单认为越大越好，某些 LDO 需要特定 ESR，开关电源还需考虑纹波电流额定值。</p>"},{"id":"hardware-7.8","bankId":"hardware","number":"7.8","title":"什么是开关电源的热回路？","stars":5,"section":"7. 电源设计","answerHtml":"<p>包含快速脉冲电流的高 di/dt 回路，如输入电容—高侧开关—低侧开关/二极管回路。布局应使其面积最小，输入高频电容紧靠功率器件，开关节点铜皮不过度扩大。</p>"},{"id":"hardware-7.9","bankId":"hardware","number":"7.9","title":"开关节点 SW 为什么要小？","stars":5,"section":"7. 电源设计","answerHtml":"<p>SW 节点具有高 dv/dt，面积大时会通过寄生电容产生更强辐射和耦合噪声。但也要兼顾电流和散热，按芯片参考布局平衡。</p>"},{"id":"hardware-7.10","bankId":"hardware","number":"7.10","title":"电源纹波怎么测才正确？","stars":5,"section":"7. 电源设计","answerHtml":"<p>使用短地弹簧或同轴方式，探头靠近输出电容两端，开启合适带宽限制，避免长鳄鱼地线形成天线；同时区分真实纹波、探头拾噪和周期尖峰。</p>"},{"id":"hardware-7.11","bankId":"hardware","number":"7.11","title":"负载瞬态是什么？","stars":4,"section":"7. 电源设计","answerHtml":"<p>负载电流快速变化导致输出电压偏移，恢复由输出电容、环路带宽和补偿决定。用电子负载阶跃测试上冲、下冲和恢复时间。</p>"},{"id":"hardware-7.12","bankId":"hardware","number":"7.12","title":"电源上电时序为什么重要？","stars":4,"section":"7. 电源设计","answerHtml":"<p>多电源芯片可能要求电压先后顺序、斜率和复位释放时机；违反可能锁死、闩锁、反向供电或损坏。使用 EN、PG、时序芯片或 MCU 控制，但 MCU 自身上电路径要可闭环。</p>"},{"id":"hardware-7.13","bankId":"hardware","number":"7.13","title":"什么是反向灌电？","stars":5,"section":"7. 电源设计","answerHtml":"<p>未供电器件通过信号引脚保护二极管或电源路径被其他已上电电路供电，导致异常、漏电甚至损坏。通过时序控制、串阻、隔离开关、支持掉电高阻的电平转换器等避免。</p>"},{"id":"hardware-7.14","bankId":"hardware","number":"7.14","title":"电源入口常见保护有哪些？","stars":5,"section":"7. 电源设计","answerHtml":"<p>保险丝/PTC、反接保护、TVS 浪涌钳位、输入滤波、过压/欠压、限流和浪涌电流控制。保护器件顺序要结合故障能量与失效模式设计。</p>"},{"id":"hardware-7.15","bankId":"hardware","number":"7.15","title":"反接保护如何实现？","stars":4,"section":"7. 电源设计","answerHtml":"<p>串联二极管简单但有压降；肖特基压降低；P-MOS/N-MOS 理想二极管方案压降低但需正确考虑体二极管方向、栅压限制和浪涌；高要求可用专用控制器。</p>"},{"id":"hardware-7.16","bankId":"hardware","number":"7.16","title":"电源效率如何测？","stars":4,"section":"7. 电源设计","answerHtml":"<p>在稳态下同时测输入、输出电压电流，<code>η=Pout/Pin</code>；使用四线测量或减小线损误差，并覆盖输入范围、轻载到满载和温度。示波器测动态开关损耗时注意探头延迟校准。</p>\n<p>---</p>"},{"id":"hardware-8.1","bankId":"hardware","number":"8.1","title":"PCB 设计前需要定义哪些约束？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>板框、层叠、铜厚、最小线宽线距、孔径、阻抗、差分规则、爬电间距、关键网络、电流能力、器件高度、接口位置和制造能力。</p>"},{"id":"hardware-8.2","bankId":"hardware","number":"8.2","title":"原理图和 PCB 评审重点是什么？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>电源域和时序、器件方向/封装/引脚、未连接网络、上拉下拉、保护、测试点、回流路径、关键布局、阻抗与差分、DRC/ERC、BOM 可得性及装配可制造性。</p>"},{"id":"hardware-8.3","bankId":"hardware","number":"8.3","title":"两层板和四层板怎么选？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>四层板可提供连续参考平面、更短回流路径、更好的电源完整性和 EMI 表现；两层板成本低但复杂高速板更难保证地平面连续。依据密度、边沿速度、EMC 和成本选择。</p>"},{"id":"hardware-8.4","bankId":"hardware","number":"8.4","title":"为什么要关注信号回流路径？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>电流必须形成闭合回路。高频回流倾向沿参考平面、紧贴信号路径流动；平面切割会迫使回流绕行，增大环路面积、串扰和辐射。</p>"},{"id":"hardware-8.5","bankId":"hardware","number":"8.5","title":"去耦电容如何布局？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>靠近对应电源引脚，电源脚—电容—地的高频回路最小；过孔靠近焊盘，避免先经过长线再到电容。大容量电容可相对远些，但仍应服务对应电源区域。</p>"},{"id":"hardware-8.6","bankId":"hardware","number":"8.6","title":"模拟地和数字地要不要分割？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>不能机械分割。重点是控制电流路径和功能分区，避免数字回流穿过敏感模拟区。低速混合信号板常保持完整地平面并合理布局；若确需分区连接，应有清晰的回流和系统分析。</p>"},{"id":"hardware-8.7","bankId":"hardware","number":"8.7","title":"电源线多宽才够？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>取决于铜厚、电流、允许温升、线长、层位置和过孔。使用 IPC 计算或仿真并留余量；高电流路径还要核算连接器、过孔、铜皮颈缩和焊盘。</p>"},{"id":"hardware-8.8","bankId":"hardware","number":"8.8","title":"差分对为什么要等长？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>减小两线到达时间差，保持差分关系和共模抑制。但差分阻抗、耦合、参考连续和整体长度通常同样重要，不要为极端等长制造大量蛇形和串扰。</p>"},{"id":"hardware-8.9","bankId":"hardware","number":"8.9","title":"蛇形等长有哪些风险？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>线段间耦合造成实际延时不如预期，并增加串扰和损耗。要保持足够间距、减少不必要弯折，并按接口时序预算设置等长容差。</p>"},{"id":"har
