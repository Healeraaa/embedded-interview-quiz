接地或同轴连接。</p>"},{"id":"hardware-10.5","bankId":"hardware","number":"10.5","title":"示波器地夹为什么可能造成短路？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>台式示波器通道地通常与保护地相连，把地夹接到非地高电位节点会短路。测市电、高边或浮地节点应采用合规差分探头/隔离方案，不能随意剪地线。</p>"},{"id":"hardware-10.6","bankId":"hardware","number":"10.6","title":"逻辑分析仪与示波器如何选择？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>逻辑分析仪适合多通道数字时序和协议解码，但看不到模拟电平质量；示波器可看过冲、噪声、边沿和时序，但通道少。复杂问题常结合使用。</p>"},{"id":"hardware-10.7","bankId":"hardware","number":"10.7","title":"电子负载有什么用途？","stars":3,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>可在恒流、恒阻、恒功率等模式下测试电源稳态和动态负载、过流保护及效率。设置瞬态时要考虑连线电感和远端采样。</p>"},{"id":"hardware-10.8","bankId":"hardware","number":"10.8","title":"新板第一次上电怎么做？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>目检与阻值检查 → 确认极性/焊接/短路 → 限流电源设置低电流 → 分电源域逐步上电 → 观察输入电流和温升 → 测各路电压、复位、时钟 → 再连接下载器与外设。不要一上来直接满压不限流。</p>"},{"id":"hardware-10.9","bankId":"hardware","number":"10.9","title":"板子电源短路如何定位？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>断电测阻并区分电容充电；分割 0Ω/磁珠/电感隔离电源域；低压限流注入，使用热像仪、酒精挥发或测压降找热点；注入电压必须低于该电源域安全值。</p>"},{"id":"hardware-10.10","bankId":"hardware","number":"10.10","title":"MCU 下载不了如何排查？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>检查供电、地、复位、SWD/JTAG 接线和电平、启动模式、时钟、下载器速度、引脚是否被外部电路占用；尝试复位下连接；最后考虑读保护、芯片焊接或损坏。</p>"},{"id":"hardware-10.11","bankId":"hardware","number":"10.11","title":"板子功耗异常如何排查？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>对比各电源域电流；检查反向灌电、GPIO 对打、未用输入悬空、器件未休眠、LDO 损耗、开关电源轻载模式和焊接短路；逐域断开并测温定位。</p>"},{"id":"hardware-10.12","bankId":"hardware","number":"10.12","title":"焊接 QFN/QFP 常见问题有哪些？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>连锡、虚焊、少锡、偏移、底部焊盘空洞或浮起。用显微镜、通断、电源限流、热风/烙铁返修；QFN 隐藏焊点可能需要 X-ray 或通过电气行为判断。</p>"},{"id":"hardware-10.13","bankId":"hardware","number":"10.13","title":"飞线修改时注意什么？","stars":3,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>线尽量短并固定，避免跨越敏感/高速区域；电源飞线按电流选择线径；差分/高速线飞线可能严重改变阻抗；修改要更新 ECO 和原理图记录。</p>"},{"id":"hardware-10.14","bankId":"hardware","number":"10.14","title":"如何判断问题来自硬件还是软件？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>先建立可观测边界：测电源、复位、时钟、总线物理波形和 MCU 引脚电平；用最小测试固件或已知良好外设替换；逐层隔离。不要仅凭“换代码后好了”就认定是软件问题。</p>\n<p>---</p>"},{"id":"hardware-11.1","bankId":"hardware","number":"11.1","title":"器件选型的完整维度有哪些？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>电气性能、最坏条件、封装与散热、环境温度、寿命与可靠性、供货周期、第二来源、成本、认证、可制造性、软件生态和厂商支持。</p>"},{"id":"hardware-11.2","bankId":"hardware","number":"11.2","title":"为什么不能只看绝对最大额定值设计？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>绝对最大值是不可长期接近的损坏边界，不是推荐工作条件。应按推荐范围设计，并考虑瞬态、温度、容差、老化与降额。</p>"},{"id":"hardware-11.3","bankId":"hardware","number":"11.3","title":"什么是降额设计？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>器件实际承受的电压、电流、功率和温度低于其额定极限，以提高可靠性并覆盖波动。不同器件和行业有不同降额规则。</p>"},{"id":"hardware-11.4","bankId":"hardware","number":"11.4","title":"数据手册最应该看哪些章节？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>推荐工作条件、绝对最大值、引脚定义、典型应用、时序、电气特性、封装与热、布局指南、勘误和应用笔记。典型值不能替代最小/最大保证值。</p>"},{"id":"hardware-11.5","bankId":"hardware","number":"11.5","title":"为什么要做最坏情况分析？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>器件容差、输入、电源、温度和老化同时变化时，典型设计可能失效。通过极限组合、蒙特卡洛或容差分析验证阈值、增益、功耗和时序仍满足要求。</p>"},{"id":"hardware-11.6","bankId":"hardware","number":"11.6","title":"如何做替代料评估？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>逐项比对引脚、封装、电气规格、时序、控制逻辑、热性能、寿命与认证；不能只看“功能相同”。替换后需做样机和关键测试回归。</p>"},{"id":"hardware-11.7","bankId":"hardware","number":"11.7","title":"BOM 成本优化的正确方式是什么？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>先满足性能和可靠性，再通过功能整合、规格合理化、通用料、减少独家料、优化封装和供应链降低成本。不能删除保护/去耦而不做验证。</p>"},{"id":"hardware-11.8","bankId":"hardware","number":"11.8","title":"什么是 DFM、DFA、DFT？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>DFM 面向制造，DFA 面向装配，DFT 面向测试。包括封装与间距、拼板、工艺边、器件方向、测试点、ICT/功能测试覆盖等。</p>"},{"id":"hardware-11.9","bankId":"hardware","number":"11.9","title":"可靠性测试常见有哪些？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>高低温、温循、湿热、振动、跌落、老化、插拔、ESD/EFT/浪涌、长时间满载等。选择依据产品环境和标准，并设置清晰通过判据。</p>"},{"id":"hardware-11.10","bankId":"hardware","number":"11.10","title":"连接器选型看什么？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>电压电流、接触电阻、针数、间距、插拔寿命、防呆、锁紧、防水、温度、振动、线束工艺和供应稳定性。电流能力需考虑针脚数量和温升降额。</p>"},{"id":"hardware-11.11","bankId":"hardware","number":"11.11","title":"保险丝与 PTC 如何选择？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>普通保险丝一次性熔断，PTC 可自恢复但动作与冷却特性不同。依据正常电流、浪涌、动作时间、环境温度、电压和最大故障电流选择。</p>"},{"id":"hardware-11.12","bankId":"hardware","number":"11.12","title":"FMEA 是什么？","stars":2,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>系统识别可能的失效模式、原因、后果和现有控制，评估风险并制定改进。硬件可分析短路、开路、参数漂移、器件失效和接口误接等。</p>\n<p>---</p>"},{"id":"hardware-12.1","bankId":"hardware","number":"12.1","title":"分压器输出电压怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>空载时 <code>Vout = Vin × Rbottom/(Rtop+Rbottom)</code>。接入负载后，底部电阻需与负载并联重算。ADC 分压还要考虑输入漏电、采样电容和保护电压。</p>"},{"id":"hardware-12.2","bankId":"hardware","number":"12.2","title":"RC 截止频率怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>一阶网络 <code>fc=1/(2πRC)</code>。面试中还要说明截止点约 -3 dB、相位变化和源负载阻抗可能改变实际值。</p>"},{"id":"hardware-12.3","bankId":"hardware","number":"12.3","title":"LED 限流电阻怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p><code>R=(Vs−Vf)/I</code>，再计算 <code>P=I²R</code> 并留余量，使用最坏电源和最低/最高 Vf 验证电流范围。</p>"},{"id":"hardware-12.4","bankId":"hardware","number":"12.4","title":"NTC 温度采样如何计算？","stars":3,"section":"12. 高频计算题","answerHtml":"<p>先由分压计算 NTC 电阻，再用 B 参数公式或查表换算温度；考虑 NTC 误差、参考电阻精度、ADC 参考和自热。</p>"},{"id":"hardware-12.5","bankId":"hardware","number":"12.5","title":"ADC 分辨率和量化电压怎么算？","stars":4,"section":"12. 高频计算题","answerHtml":"<p>N 位理想 ADC 有 <code>2^N</code> 个码，常用 LSB 近似 <code>Vref/2^N</code>。实际有效位数还受噪声、INL/DNL、参考和前端误差影响。</p>"},{"id":"hardware-12.6","bankId":"hardware","number":"12.6","title":"LDO 功耗与结温怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p><code>P≈(Vin−Vout)Iout</code>，<code>Tj≈Ta+PθJA</code>。实际 PCB 铜面积会改变热阻，最终需实测温升验证。</p>"},{"id":"hardware-12.7","bankId":"hardware","number":"12.7","title":"运放闭环增益怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>反相 <code>-Rf/Rin</code>，同相 <code>1+Rf/Rg</code>；进一步检查目标频率下开环增益是否足够、输出摆幅和压摆率是否满足。</p>"},{"id":"hardware-12.8","bankId":"hardware","number":"12.8","title":"MOSFET 导通功耗怎么算？","stars":4,"section":"12. 高频计算题","answerHtml":"<p><code>Pcond=Irms²×Rds(on)</code>，其中 Rds(on) 要用实际栅压和高温值，而不是只用 25°C 典型值。</p>"},{"id":"hardware-12.9","bankId":"hardware","number":"12.9","title":"PCB 走线压降如何估算？","stars":3,"section":"12. 高频计算题","answerHtml":"<p>先由铜电阻率、长度和截面积估算走线电阻，再用 <code>Vdrop=IR</code>。同时检查温升、过孔和连接器电阻。</p>"},{"id":"hardware-12.10","bankId":"hardware","number":"12.10","title":"电池续航如何粗估？","stars":4,"section":"12. 高频计算题","answerHtml":"<p>不能只用容量除平均电流。应按工作状态占空比求平均电流，并考虑电池有效容量、放电倍率、温度、转换效率、自放电和截止电压。</p>\n<p>---</p>"},{"id":"hardware-13.1","bankId":"hardware","number":"13.1","title":"新板 3.3 V 只有 1.8 V，如何排查？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>确认测量点和仪器 → 断电测负载阻值 → 看输入电压、EN、反馈和限流状态 → 限流电源观察输入电流与温升 → 隔离下游负载 → 检查稳压器外围、封装和焊接 → 用示波器判断是否启动打嗝或振荡。</p>"},{"id":"hardware-13.2","bankId":"hardware","number":"13.2","title":"MCU 偶发复位，如何排查？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>读取复位原因；同时监测 VDD、NRST、时钟和负载事件；检查电源跌落、BOR、看门狗、ESD、地弹、复位线干扰和软件异常；用示波器单次触发捕获复位前瞬态。</p>"},{"id":"hardware-13.3","bankId":"hardware","number":"13.3","title":"ADC 采样值跳动很大怎么办？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>检查参考电压、电源噪声、信号源阻抗、采样时间、接地与布局；对比短接输入/内部参考；用示波器观察原始信号；增加合理 RC、缓冲、平均或同步采样，但先定位噪声来源。</p>"},{"id":"hardware-13.4","bankId":"hardware","number":"13.4","title":"MOSFET 一带负载就烧毁，可能是什么原因？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>耐压/浪涌不足、栅压不够导致线性区、开关慢、无续流、SOA 不足、热设计差、直通、封装引脚错误或负载启动电流过大。捕获 Vgs、Vds、电流和温度，不只换更大额定电流器件。</p>"},{"id":"hardware-13.5","bankId":"hardware","number":"13.5","title":"I²C 偶发 NACK，硬件如何排查？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>用示波器看电平、上升时间、过冲和毛刺；检查上拉、总线电容、电平转换、供电时序、地址脚、线长和干扰；降低速率验证；确认从机是否在复位/忙状态。</p>"},{"id":"hardware-13.6","bankId":"hardware","number":"13.6","title":"SPI 高速时错误、降速正常，怎么办？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>检查时钟/数据边沿、模式、走线与回流、串联端接、探头测量和电平裕量；测 setup/hold、过冲与振铃；优化源端电阻、连续参考和布局，而不是只永久降速。</p>"},{"id":"hardware-13.7","bankId":"hardware","number":"13.7","title":"USB 插拔导致系统重启，怎么查？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>观察 VBUS、系统电源、复位和地电位；排查浪涌电流、ESD、反向灌电、连接器地先后、TVS 布局和固件 USB 状态处理；使用单次触发捕获插拔瞬态。</p>"},{"id":"hardware-13.8","bankId":"hardware","number":"13.8","title":"开关电源纹波很大，可能是什么问题？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>先确认测量方法；再检查电感/输出电容、环路稳定性、布局热回路、负载模式、二极管/同步整流、输入电源和焊接；区分开关基波、振铃尖峰和低频环路振荡。</p>"},{"id":"hardware-13.9","bankId":"hardware","number":"13.9","title":"EMC 辐射超标如何整改？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>先看超标频点与倍频关系，用近场探头定位源；识别噪声源—耦合路径—天线；分别从减小源强、切断路径、降低天线效率整改；常见措施包括缩小回路、端接、滤波、屏蔽、优化线缆共模路径，并逐项 A/B 验证。</p>"},{"id":"hardware-13.10","bankId":"hardware","number":"13.10","title":"板子高温下正常、低温下不起机，可能是什么？","stars":3,"section":"13. 高频场景排障题","answerHtml":"<p>晶振启动裕量、器件参数/ESR 随温度变化、焊点接触、复位时序、电池内阻、LDO/Buck 启动和元件容差。温箱内分阶段测电源、复位和时钟，避免只热风吹整板。</p>"},{"id":"hardware-13.11","bankId":"hardware","number":"13.11","title":"量产少量板子不工作，研发样机正常，如何处理？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>统计故障分布与批次；对比 BOM、PCB/钢网/工艺、器件日期码；建立好坏板 A/B 测量；检查设计裕量、焊接和容差；用边界条件复现。不要把偶发归因于“器件质量”而没有证据。</p>"},{"id":"hardware-13.12","bankId":"hardware","number":"13.12","title":"用示波器看到振铃，怎样判断是真实还是测量伪影？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>更换短地弹簧、不同探头和测量位置，调整带宽，做探头校准；若振铃随地线长度明显变化，多半包含测量环路伪影。也可用同轴或有源探头交叉验证。</p>\n<p>---</p>"},{"id":"hardware-15.1","bankId":"hardware","number":"15.1","title":"画一个 MCU 最小系统。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>至少包含：所有电源引脚与去耦、模拟电源、复位、晶振/时钟、BOOT 配置、SWD/JTAG、主电源入口和必要测试点。</p>"},{"id":"hardware-15.2","bankId":"hardware","number":"15.2","title":"画一个 N-MOS 低边驱动继电器电路。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>包括栅极串阻、栅极下拉、续流器件、负载电源和共地；进一步说明 GPIO 上电默认状态、MOS 选型和关断速度。</p>"},{"id":"hardware-15.3","bankId":"hardware","number":"15.3","title":"画一个运放同相/反相放大器并算增益。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>除公式外，还要检查供电、输入共模、输出范围、带宽、压摆率和去耦。</p>"},{"id":"hardware-15.4","bankId":"hardware","number":"15.4","title":"设计一个 12 V 转 3.3 V/100 mA 电源。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>先比较 LDO 功耗 <code>0.87 W</code> 与热条件，再决定是否用 Buck；说明输入保护、器件额定、电容、电感、反馈、布局和测试计划。</p>"},{"id":"hardware-15.5","bankId":"hardware","number":"15.5","title":"设计一个 5 V 到 3.3 V 的数字电平转换。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>先问信号方向、速率、推挽/开漏和是否双向，再选分压、MOS、缓冲器或专用转换器；不能不问条件直接给固定电路。</p>"},{"id":"hardware-15.6","bankId":"hardware","number":"15.6","title":"设计一个 0～10 V 信号接入 3.3 V ADC。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>分压、输入限流、钳位/保护、RC 滤波、源阻抗与采样时间、ADC 参考和容差分析；若工业接口还要考虑浪涌、误接和隔离。</p>"},{"id":"hardware-15.7","bankId":"hardware","number":"15.7","title":"设计一个按键输入。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>上拉/下拉、RC/施密特消抖、ESD（若外接）、上电默认状态和软件消抖配合。</p>"},{"id":"hardware-15.8","bankId":"hardware","number":"15.8","title":"画 RS-485/CAN 接口保护框图。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>收发器、终端/偏置、TVS、可选共模电感、连接器、接地/隔离。说明器件顺序和瞬态泄放路径。</p>\n<p>---</p>"},{"id":"hardware-20.1","bankId":"hardware","number":"20.1","title":"为什么电源芯片旁边要放去耦电容？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>数字芯片翻转时会在很短时间内需要脉冲电流。如果这些电流全部从远处电源沿长走线获取，走线和过孔的寄生电感会产生压降，导致芯片电源波动。去耦电容相当于放在芯片旁边的局部小电源，为瞬态负载提供短回路，同时把电源引脚上的高频噪声旁路到地。布局时比单纯容量更重要的是回路面积：电容要靠近对应 VDD，引脚到电容再到地的路径要短，过孔靠近焊盘。通常小容量陶瓷负责较高频段，大容量电容负责较低频负载变化，具体数值以芯片手册和电源阻抗要求为准。</p>\n<p><strong>常见追问：为什么常用 0.1 μF？</strong></p>\n<p>0.1 μF 是常见经验值，在典型封装寄生下能覆盖一部分高频范围，但不是固定答案。高速芯片可能需要 1 nF、10 nF、100 nF 和若干 μF 组合；MLCC 还要考虑直流偏压后的实际容量。</p>\n<p><strong>易错点：</strong>只回答“滤波”，却说不出瞬态电流回路和布局要求。</p>"},{"id":"hardware-20.2","bankId":"hardware","number":"20.2","title":"LDO 和 Buck 怎么选？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>我先看输入输出压差、最大电流、允许温升、噪声、效率、成本和板面积。LDO 电路简单、纹波和 EMI 较小，但损耗近似为 <code>(Vin-Vout)×Iout</code>，压差大或电流大时容易发热。Buck 通过开关储能实现降压，效率通常更高，但需要电感、输入输出电容，布局和 EMI 控制更复杂。例如 12 V 转 3.3 V、100 mA，如果使用 LDO，损耗约 0.87 W，对小封装通常过高，我会优先 Buck；如果是 3.6 V 转 3.3 V、20 mA 的低噪声模拟电源，LDO 更合适。最终还会按最高输入、最大负载和最高环境温度校核结温，并在样机上测纹波、效率和瞬态。</p>\n<p><strong>追问：能不能 Buck 后再接 LDO？</strong></p>\n<p>可以。Buck 先高效降到略高于目标电压，再由 LDO 降噪，但要保证 LDO 有足够压差，同时评估增加的成本和效率损失。</p>"},{"id":"hardware-20.3","bankId":"hardware","number":"20.3","title":"LDO 为什么发热，怎么判断会不会过热？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>LDO 相当于线性调整器，主要功耗约为 <code>(Vin-Vout)×Iout</code>，再加静态电流造成的损耗。先按最坏输入电压和最大负载算功耗，再用数据手册热阻粗估 <code>Tj=Ta+P×θJA</code>。不过 θJA 与 PCB 铜面积、层数和气流有关，所以这个结果只是初步判断。我会再看芯片降额曲线、热保护点，在实板最高环境温度和最坏负载下用热电偶或热像仪验证。若温升过高，可换 Buck、降低压差、换更低热阻封装或改善散热铜皮。</p>"},{"id":"hardware-20.4","bankId":"hardware","number":"20.4","title":"Buck 的布局为什么非常重要？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>Buck 中有高 di/dt 和高 dv/dt 节点。最关键的是输入电容、高侧开关和低侧开关或续流二极管组成的高频热回路，它的面积越大，寄生电感导致的尖峰和辐射越严重。因此输入高频电容必须紧贴功率引脚；SW 节点铜皮在满足电流和散热的前提下尽量小；电感和输出电容靠近；反馈从干净的输出点采样并远离 SW。我的原则是先按数据手册推荐布局放功率器件，再处理地、反馈和其他走线，不能先随意摆放再靠补电容解决。</p>"},{"id":"hardware-20.5","bankId":"hardware","number":"20.5","title":"电源纹波应该怎样正确测量？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>探头要直接在输出电容两端测，使用地弹簧或很短的接地连接，避免长鳄鱼夹形成天线拾取开关噪声。示波器通道设成合适带宽，例如按测试规范打开 20 MHz 限带，并使用 AC 耦合观察小纹波时确认不会掩盖低频成分。还要记录负载、输入电压和工作模式。测到尖峰后，我会换短地、同轴或不同探头交叉验证，先排除测量伪影，再判断是开关纹波、环路振荡还是寄生振铃。</p>"},{"id":"hardware-20.6","bankId":"hardware","number":"20.6","title":"MCU 最小系统包括哪些部分？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>至少包括所有数字和模拟电源及去耦、复位、时钟或内部时钟配置、BOOT/启动配置、SWD/JTAG 下载调试接口，以及芯片手册要求的参考电压、内部稳压电容等特殊引脚。我还会预留关键电源、复位、时钟和通信测试点。设计时逐个核对引脚，不能只画一组 VDD；上电前检查电源短路，限流启动后先测各路电源、复位和时钟，再下载最小测试程序。</p>"},{"id":"hardware-20.7","bankId":"hardware","number":"20.7","title":"MCU 每个电源脚都要放去耦吗？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>通常需要按照手册让每组 VDD/VSS 都有就近的高频去耦，因为封装内部不同区域的瞬态电流需要低阻抗回路。原理图上这些电容虽然并联，但 PCB 上如果集中放在远处，寄生电感会使它们无法有效提供高频电流。除每脚附近的小电容外，电源域入口通常还会放一颗较大的储能电容。模拟电源和参考电压则按芯片建议单独滤波和去耦。</p>"},{"id":"hardware-20.8","bankId":"hardware","number":"20.8","title":"晶振不起振怎么排查？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>先确认固件时钟源配置和芯片是否真的切换到外部晶振；再检查晶体频率、负载电容、封装和焊接；核对 PCB 是否靠近芯片、走线短且对称、是否被高速信号干扰。测量时普通 10× 探头的输入电容可能改变振荡条件，所以优先观察芯片时钟输出或使用低电容有源探头。也可以暂时切换内部时钟，判断 MCU 其他部分是否正常。若温度或批次相关，还要核对晶体 ESR、驱动能力和负阻裕量，而不是只反复换电容。</p>"},{"id":"hardware-20.9","bankId":"hardware","number":"20.9","title":"MCU 偶发复位怎么查？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>第一步读取并保存复位原因，区分上电、BOR、看门狗、外部复位和软件复位。然后用示波器同时观察 VDD、NRST 和可能的大负载动作信号，设置单次触发捕获复位前的电压跌落或毛刺。硬件上检查电源瞬态、去耦、复位线上拉与滤波、地弹、ESD 路径和反向灌电；软件侧检查看门狗、HardFault 和非法访问。定位时逐个禁用负载或接口做 A/B 对比，最终必须用最坏负载、插拔和 ESD 场景回归。</p>"},{"id":"hardware-20.10","bankId":"hardware","number":"20.10","title":"GPIO 能不能直接驱动 LED、继电器或电机？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>LED 小电流时可以通过限流电阻驱动，但要核对单引脚和整个端口的电流限制以及 VOH/VOL；继电器、电机属于大电流或感性负载，不能直接由 GPIO 驱动，通常用 BJT/MOSFET 或专用驱动器，并增加续流和电源隔离措施。选器件时要看启动/堵转电流和浪涌，而不是只看稳态电流。</p>"},{"id":"hardware-20.11","bankId":"hardware","number":"20.11","title":"MOSFET 的阈值电压是不是完全导通电压？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>不是。<code>Vgs(th)</code> 是 MOS 管在很小漏极电流下刚开始导通的门槛，只能说明“开始开”，不能说明导通电阻已经很低。真正选型要看数据手册在目标栅压，例如 2.5 V、4.5 V 或 10 V 下保证的 <code>Rds(on)</code>。如果 MCU 是 3.3 V GPIO，而器件只在 10 V 下给出低导通电阻，它可能会工作在线性区并严重发热。</p>"},{"id":"hardware-20.12","bankId":"hardware","number":"20.12","title":"MOSFET 为什么发热？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>我会从导通损耗、开关损耗和异常工作三方面看。导通损耗约是 <code>Irms²×Rds(on)</code>，而 Rds(on) 会随温度升高；开关过程中 Vds 和 Id 同时较大，会产生开关损耗，频率越高越明显。栅压不足、驱动电流小、栅极振铃、感性尖峰、SOA 不足或散热差都会加重发热。调试时要同时测 Vgs、Vds、电流和温度，特别看栅极平台、开关时间和关断尖峰。</p>"},{"id":"hardware-20.13","bankId":"hardware","number":"20.13","title":"为什么感性负载需要续流二极管？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>电感电流不能突变，开关关断时会产生反向高压，可能击穿 MOS、三极管或影响系统。并联续流二极管可以给电流提供衰减通路并钳位电压。普通二极管钳位电压较低、器件压力小，但电流衰减慢，继电器释放可能变慢；若要求快速释放，可使用 TVS、稳压管或其他较高钳位方案，同时校核开关器件耐压和能量。</p>"},{"id":"hardware-20.14","bankId":"hardware","number":"20.14","title":"运放的虚短、虚断什么时候成立？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>只有运放处于负反馈并在线性区时，才可以近似认为两输入端电压相等，也就是虚短；由于输入阻抗很高，可近似认为输入电流为零，也就是虚断。如果输出已经饱和、输入超出共模范围、运放用于开环比较，或者电路发生振荡，这两个近似都不能直接使用。算完理想增益后，我还会检查供电、共模范围、输出摆幅、带宽和压摆率。</p>"},{"id":"hardware-20.15","bankId":"hardware","number":"20.15","title":"运放和比较器为什么不建议混用？","stars":4,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>运放主要为闭环线性放大优化，比较器为开环快速翻转优化。运放进入深度饱和后恢复可能很慢，而且输入差分过大时行为未必适合比较；比较器输出可能是开漏，也未必适合线性反馈。因此阈值检测优先使用比较器并根据噪声加迟滞，信号放大则使用满足稳定性和输入输出范围的运放。</p>"},{"id":"hardware-20.16","bankId":"hardware","number":"20.16","title":"PCB 为什么要关注回流路径？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>任何信号电流都必须形成闭合回路。低频时回流可能按最小电阻路径分布，高频时更倾向紧贴信号走线下方的参考平面，以减小环路电感。如果走线跨过地平面分割，回流不得不绕路，环路面积变大，会增加串扰、辐射和波形失真。因此我的布局布线顺序不是只看信号线能否连通，还会检查它下面有没有连续参考，以及换层处有没有就近回流过孔。</p>"},{"id":"hardware-20.17","bankId":"hardware","number":"20.17","title":"模拟地和数字地到底要不要分开？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>不能机械地把地割开。关键是功能分区和控制回流，不让高速数字或大电流回流经过敏感模拟区域。对于很多低速 MCU 混合信号板，保持完整地平面、合理摆放 ADC 前端和数字器件，往往比切割地更可靠。若根据芯片手册需要模拟、数字分区，也应明确它们在哪里连接，以及每条跨区信号的回流路径，不能让信号跨缝。</p>"},{"id":"hardware-20.18","bankId":"hardware","number":"20.18","title":"高速信号为什么需要阻抗控制？","stars":4,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>当走线传播延时相对信号边沿时间不可忽略时，走线就是传输线。信号遇到阻抗不连续会反射，产生过冲、下冲、振铃或多次跨越逻辑阈值。阻抗由层叠、线宽、介质厚度、铜厚和参考平面决定，需要与板厂确认。是否属于高速不能只看时钟频率，还要看上升时间。</p>"},{"id":"hardware-20.19","bankId":"hardware","number":"20.19","title":"差分线为什么要等长？","stars":4,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>差分接收依赖两根线相反变化并同时到达。长度差会产生时延差，把部分差分能量转成共模，降低眼图和抗干扰能力。但设计时不能只追求等长，还要保证目标差分阻抗、线间耦合、连续参考和平滑换层。过多密集蛇形可能产生自耦，反而恶化波形。</p>"},{"id":"hardware-20.20","bankId":"hardware","number":"20.20","title":"什么是反射，怎么解决？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>反射是波到达阻抗变化处时部分能量返回。常见不连续来自连接器、过孔、支线、参考面变化或负载阻抗不匹配。解决思路是控制走线阻抗、减少支线和不连续、保持参考连续，并根据点对点还是多点拓扑使用源端串联、接收端并联等端接。实际用示波器观察过冲、振铃和边沿，再调整端接，而不是盲目加大电容。</p>"},{"id":"hardware-20.21","bankId":"hardware","number":"20.21","title":"TVS 怎么选？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>首先让 TVS 的反向工作电压高于接口正常最大电压，避免正常工作时漏电或误导通；再看击穿和在规定脉冲电流下的钳位电压，必须低于被保护器件和后级的承受能力；峰值脉冲功率要满足 ESD、EFT 或 Surge 等测试波形；高速信号还要关注结电容。布局上 TVS 靠近连接器，冲击电流从入口经 TVS 到机壳地或保护地的路径要短、宽、少过孔。</p>"},{"id":"hardware-20.22","bankId":"hardware","number":"20.22","title":"ESD、EFT、Surge 有什么区别？","stars":4,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>ESD 模拟人体或物体静电，边沿极快、能量相对较小，容易通过寄生参数耦合；EFT 是成组的快速脉冲，常模拟继电器或感性负载开关；Surge 模拟雷击或大功率开关引起的浪涌，持续更长、能量更大。三者不能只靠同一颗 TVS 解决，保护器件、滤波、布局和泄放路径都要针对测试等级设计。</p>"},{"id":"hardware-20.23","bankId":"hardware","number":"20.23","title":"EMC 辐射超标如何系统整改？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>我会先看超标频点是否对应时钟、开关频率或其倍频，再用近场探头、频谱仪和逐模块开关做定位。整改按“噪声源—耦合路径—天线”三部分进行：源头降低边沿或振铃，路径上缩小回路、改善回流、增加合适滤波，天线端处理线缆共模、屏蔽和接口接地。每次只改一个变量做 A/B 对比，记录频谱变化，避免无目的堆磁珠和电容。</p>"},{"id":"hardware-20.24","bankId":"hardware","number":"20.24","title":"新板第一次上电怎么做？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>先目检器件方向、极性、焊桥和漏件；断电测主电源及各电源域对地阻值，确认没有明显短路；将实验电源设为正确电压和较小限流，分电源域或分阶段上电，观察电流是否符合预期并检查异常温升；随后测各路电源、PG、复位和时钟；确认最小系统正常后再连接下载器，运行 GPIO、串口等最小程序，最后逐个启用高风险负载和外设。过程中记录基准电流和关键波形。</p>"},{"id":"hardware-20.25","bankId":"hardware","number":"20.25","title":"板上电源短路怎么定位？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>断电先测阻，但要区分电容充电导致的读数变化。利用 0Ω、电感或磁珠把电源树逐段断开，找到短路电源域；然后用低于该电源正常安全电压的低压限流源注入电流，通过热像仪、酒精挥发、松香烟或测量铜皮压降寻找热点。注入前必须确认该域所有器件允许的反向电压和最大电流，不能直接用额定高压烧短路点。</p>"},{"id":"hardware-20.26","bankId":"hardware","number":"20.26","title":"示波器长地线为什么会看到假振铃？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>长地线和探头尖端形成大环路，既会拾取空间噪声，也有较大寄生电感。高速电流变化在该电感上产生电压，叠加到真实信号上形成假尖峰或振铃。应使用地弹簧、短地片或同轴方式，并改变探头连接做交叉验证。测量系统本身是电路的一部分，不能忽略探头输入电容和接地电感。</p>"},{"id":"hardware-20.27","bankId":"hardware","number":"20.27","title":"示波器地夹为什么不能随便夹？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>多数台式示波器 BNC 外壳和探头地夹与保护地相连。如果把它夹到市电火线、高边开关节点或非地参考点，相当于把该节点直接接保护地，可能短路、炸机并危及人员。测浮地、高边或市电相关信号要使用额定等级合适的差分探头、隔离放大器或规范的隔离测试方案，不能通过拔掉示波器保护地来规避。</p>"},{"id":"hardware-20.28","bankId":"hardware","number":"20.28","title":"怎么判断问题是硬件还是软件？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>我不会先下结论，而是建立软硬件边界。先测供电、复位、时钟、GPIO 和通信总线的真实物理波形；使用最小测试程序只驱动一个外设；用已知良好的板、模块、固件或仪器做替换对比。若软件发出了正确寄存器配置但物理电平不对，继续查硬件；若物理层正常而协议时序或状态机错误，则查软件。最终用可重复实验和波形证据归因。</p>"},{"id":"hardware-20.29","bankId":"hardware","number":"20.29","title":"绝对最大额定值为什么不能作为设计值？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>绝对最大额定值是器件不应超过的损坏边界，接近它长期工作不保证功能、寿命或性能。设计应使用推荐工作范围，并把输入波动、器件容差、温度、瞬态和老化算入最坏情况，再进行降额。例如 20 V 绝对最大输入的芯片不能直接用于可能出现 20 V 浪涌的系统。</p>"},{"id":"hardware-20.30","bankId":"hardware","number":"20.30","title":"选器件时看哪些因素？","stars":5,"section":"20. 五星题口语化标准回答","answerHtml":"<p><strong>标准回答：</strong></p>\n<p>先把需求变成最大最小电压、电流、速度、精度、温度、功耗和接口指标；再看推荐工作条件、最坏电气参数、封装散热、生命周期和认证；同时评估成本、交期、第二来源、软件支持和可制造性。选完要做最坏情况计算和样机验证，而不是只凭典型应用图。</p>\n<p>---</p>"},{"id":"hardware-21.1","bankId":"hardware","number":"21.1","title":"分压器设计：12 V 测量到 3.3 V ADC","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>12 V 输入最高可能达到 15 V，ADC 满量程 3.3 V，怎样设计分压？</p>\n<p><strong>解题：</strong></p>\n<ol>\n<li>不能按标称 12 V 设计，要用最高 15 V，并给 ADC 钳位留余量。假设希望 15 V 时 ADC 约 3.0 V，则分压比为 <code>3/15=0.2</code>。</li>\n<li>选择 <code>Rbottom=20 kΩ</code>、<code>Rtop=80 kΩ</code>，理想输出为 3.0 V。</li>\n<li>输入 12 V 时输出 2.4 V。</li>\n<li>总阻值 100 kΩ，15 V 时电流 150 μA，功耗很小。</li>\n<li>但 ADC 看到的等效源阻抗为 <code>80k||20k=16 kΩ</code>，需核对 ADC 采样时间是否足够；不够则延长采样时间、降低阻值或加运放缓冲。</li>\n<li>加串联限流、RC 滤波和钳位时，要核对正常工作误差、故障电流和钳位器件漏电。</li>\n<li>用 1% 电阻时应做容差极限计算；高精度测量应选更高精度/低温漂电阻并校准。</li>\n</ol>\n<p><strong>追问：为什么不能直接用两个很大的电阻？</strong></p>\n<p>阻值过大会让 ADC 采样电容充电不足，也更容易受漏电、噪声和污染影响。</p>"},{"id":"hardware-21.2","bankId":"hardware","number":"21.2","title":"RC 低通设计","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>设计截止频率约 1 kHz 的 RC 低通。</p>\n<p><strong>解题：</strong></p>\n<p>使用 <code>fc=1/(2πRC)</code>。先选常用 <code>C=10 nF</code>，则 <code>R≈1/(2π×1000×10nF)=15.9 kΩ</code>，可选 15.8 kΩ 或 16 kΩ。选完需检查源和负载阻抗是否会改变 R 的等效值，以及目标信号在 1 kHz 附近是否允许约 -3 dB 衰减。若接 ADC，还需核对源阻抗和采样时间。</p>"},{"id":"hardware-21.3","bankId":"hardware","number":"21.3","title":"LED 限流计算","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>3.3 V GPIO 驱动红色 LED，Vf 典型 1.9 V，希望约 5 mA。</p>\n<p><strong>解题：</strong></p>\n<p><code>R=(3.3-1.9)/0.005=280Ω</code>，可选 270Ω 或 300Ω。若选 300Ω，典型电流约 4.67 mA，电阻功耗约 6.5 mW。还要用电源最大值和 LED 最小 Vf 算最大电流，核对 GPIO 的 VOH/VOL 和端口总电流。工程上不必为了亮度精确到 5 mA 而忽略器件容差。</p>"},{"id":"hardware-21.4","bankId":"hardware","number":"21.4","title":"LDO 功耗与结温","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>5 V 转 3.3 V、最大 300 mA，环境温度 50°C，封装 θJA=60°C/W。</p>\n<p><strong>解题：</strong></p>\n<p>忽略静态电流时，功耗 <code>P=(5-3.3)×0.3=0.51 W</code>。粗估结温 <code>Tj=50+0.51×60=80.6°C</code>。看起来低于常见 125°C 上限，但还需检查 θJA 的测试板条件、最高输入、电流持续时间、铜面积和 LDO 降额。样机应在最坏负载下实测温升。若输入升到 12 V，则功耗变成 2.61 W，通常不能继续使用同一 LDO 方案。</p>"},{"id":"hardware-21.5","bankId":"hardware","number":"21.5","title":"MOSFET 导通损耗","stars":4,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>负载 5 A，MOSFET 在实际栅压、高温下 <code>Rds(on)=30 mΩ</code>。</p>\n<p><strong>解题：</strong></p>\n<p><code>Pcond=I²R=25×0.03=0.75 W</code>。这还没有包含开关损耗、栅极损耗和体二极管损耗。若数据手册只给 25°C 典型 15 mΩ，不能直接按 0.375 W 设计，因为高温导通电阻可能明显增加。后续要根据封装到板热阻和铜皮估算结温并实测。</p>"},{"id":"hardware-21.6","bankId":"hardware","number":"21.6","title":"运放放大器设计","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>将 0～0.5 V 信号放大到 0～3.0 V，采用同相放大。</p>\n<p><strong>解题：</strong></p>\n<p>目标增益为 6，同相增益 <code>1+Rf/Rg=6</code>，所以 <code>Rf/Rg=5</code>，例如 <code>Rg=10 kΩ</code>、<code>Rf=50 kΩ</code>。接着检查运放在供电条件下输入共模是否包含 0 V，输出是否能接近 3.0 V，增益为 6 时带宽是否够，压摆率是否满足，以及输入失调乘以噪声增益后的误差。若单电源运放不能真正输入到地，应换轨到轨输入器件或增加偏置。</p>"},{"id":"hardware-21.7","bankId":"hardware","number":"21.7","title":"ADC 分辨率和误差","stars":4,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>12 位 ADC、Vref=3.3 V，一个 LSB 多大？</p>\n<p><strong>解题：</strong></p>\n<p>理想 LSB 约 <code>3.3/4096=0.806 mV</code>。这只是量化步长，不代表系统精度就是 0.806 mV。总误差还包括参考电压误差、ADC 偏移/增益、INL/DNL、输入噪声、分压电阻误差和温漂。面试时应区分“分辨率”和“准确度”。</p>"},{"id":"hardware-21.8","bankId":"hardware","number":"21.8","title":"电池续航估算","stars":4,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>设备每分钟工作 2 秒、工作电流 100 mA，其余时间 1 mA，电池标称 1000 mAh。</p>\n<p><strong>解题：</strong></p>\n<p>平均电流约为 <code>(100×2 + 1×58)/60=4.3 mA</code>，理想续航约 <code>1000/4.3≈233 h</code>，约 9.7 天。真实续航要乘上电池有效容量和转换效率，并考虑温度、自放电、脉冲负载下压降、截止电压和电池老化，所以应留明显余量并实测工作曲线。</p>"},{"id":"hardware-21.9","bankId":"hardware","number":"21.9","title":"I²C 上拉的分析方法","stars":5,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>为什么不能固定使用 4.7 kΩ？</p>\n<p><strong>解题：</strong></p>\n<p>上拉电阻下限受器件最大灌电流和允许低电平限制，可近似按 <code>(Vdd-VOLmax)/IOL</code> 计算；上限受总线电容和允许上升时间限制，因为上升沿近似由 <code>Rp×Cb</code> 决定。总线越长、器件越多或速率越高，电容越大，对上拉要求越强。若多个模块各有上拉，要计算并联后的等效阻值。最终用示波器测实际上升时间、低电平和过冲。</p>"},{"id":"hardware-21.10","bankId":"hardware","number":"21.10","title":"电源走线压降","stars":3,"section":"21. 完整计算题：步骤、算例与检查点","answerHtml":"<p><strong>题目：</strong>为什么高电流电源不能只按“不烧线”设计？</p>\n<p><strong>解题：</strong></p>\n<p>走线即使温升可接受，也可能有不可接受的压降。先根据铜厚、线宽和长度估算电阻，再用 <code>Vdrop=IR</code> 计算负载端最低电压；同时把过孔、连接器、保险丝和 MOSFET 电阻加入。高速负载还要看瞬态电感造成的跌落，因此大电流路径应短、宽，并在负载附近配置储能与去耦。</p>\n<p>---</p>"},{"id":"hardware-22.1","bankId":"hardware","number":"22.1","title":"请介绍一下你的项目。","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>可直接套用：</strong></p>\n<blockquote>这个项目是一个[设备类型]，主要解决[应用问题]。系统输入是[电源与信号]，核心使用[主控型号]，外接[传感器/通信/执行器]。我主要负责[器件选型、原理图、PCB、焊接调试中的真实职责]。设计中最关键的指标是[电流、精度、通信距离、尺寸或温度]。最大的难点是[具体故障]，我通过[仪器和测量方法]发现[具体证据]，最终将原因定位为[根因]，通过[修改]解决。最终实测[纹波、温升、功耗、稳定时间等真实数据]。如果再做一版，我会重点改进[测试点、保护、布局或器件裕量]。</blockquote>\n<p><strong>合格标准：</strong>三分钟内讲清系统、职责、难点和结果，不把团队成果全部说成自己的。</p>"},{"id":"hardware-22.2","bankId":"hardware","number":"22.2","title":"为什么选择这款 MCU？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>我先根据需求列出[GPIO 数、ADC 精度、定时器、通信接口、RAM/Flash、主频和功耗]，这款 MCU 的[具体资源]满足要求，并且项目已有[工具链/驱动/供应链]基础。余量方面，最终 Flash 使用[真实比例]、RAM 使用[真实比例]，关键外设还剩[真实资源]。它的不足是[成本、供货或性能限制]；如果业务增加[某功能]，我会评估[备选型号]。</blockquote>\n<p>不要只回答“便宜、常用、资料多”。</p>"},{"id":"hardware-22.3","bankId":"hardware","number":"22.3","title":"请画项目电源树。","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答方法：</strong></p>\n<p>从输入接口开始，依次画保护、主电源转换、各子电源和负载，并在每条支路写上标称电压、最大电流和启动关系。随后解释：</p>\n<ul>\n<li>输入可能出现的最高/最低电压；</li>\n<li>为什么某路用 Buck、LDO 或负载开关；</li>\n<li>最大功耗和温升；</li>\n<li>哪些负载产生浪涌；</li>\n<li>电源时序、PG/EN 和掉电行为；</li>\n<li>测试点及故障隔离方式。</li>\n</ul>"},{"id":"hardware-22.4","bankId":"hardware","number":"22.4","title":"为什么这样划分模拟和数字电路？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>我没有简单切割地，而是按电流和噪声分区。开关电源、马达和高速数字放在[区域]，ADC 前端和参考放在[区域]；敏感信号远离 SW/时钟，并保持下方连续参考。数字回流不会经过模拟输入区域，传感器回流在[位置]汇入。ADC 电源按手册用[磁珠/RC/独立 LDO]处理，并在引脚附近去耦。</blockquote>"},{"id":"hardware-22.5","bankId":"hardware","number":"22.5","title":"PCB 为什么用两层或四层？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>该板选择[层数]，主要依据[板面积、布线密度、边沿速度、EMC 和成本]。层叠是[逐层说明]。关键高速信号参考[哪一层]，换层时通过[地过孔]保证回流。如果用两层板，我会说明如何尽量保持完整地铜；如果用四层板，我会说明地平面和电源层的安排，而不是只说“四层抗干扰好”。</blockquote>"},{"id":"hardware-22.6","bankId":"hardware","number":"22.6","title":"去耦电容是怎样确定的？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>首先遵循主控和电源芯片手册，在每组 VDD 附近放[容量]陶瓷电容，电源域入口放[容量]储能。对于[高速/模拟器件]还增加[具体组合]。PCB 上让电源脚到电容到地的回路最短，并把过孔放在焊盘附近。样机阶段测过[电源纹波或负载瞬态数据]。如果没有做阻抗仿真，我会明确这是按手册加实测验证，而不是声称精确设计。</blockquote>"},{"id":"hardware-22.7","bankId":"hardware","number":"22.7","title":"任务中你到底负责了什么？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>系统方案由[谁]确定，我独立完成了[明确模块]的选型、原理图和调试；PCB 的[布局/布线/评审]由我负责[真实部分]。我亲自定位并解决的故障是[具体问题]。对于[不是你做的部分]，我参与了接口定义和联调，但不会说成自己独立完成。</blockquote>\n<p>面试官通过这题判断真实性，边界清楚反而更加可信。</p>"},{"id":"hardware-22.8","bankId":"hardware","number":"22.8","title":"最难的 Bug 是什么？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>完整回答结构：</strong></p>\n<ol>\n<li>现象：在什么条件下发生，概率多少；</li>\n<li>初始假设：电源、时钟、接口或软件；</li>\n<li>隔离：关闭哪些模块，如何稳定复现；</li>\n<li>证据：示波器通道、触发条件和测到的数值；</li>\n<li>根因：哪条设计规则被违反；</li>\n<li>修复：临时飞线与正式改板分别是什么；</li>\n<li>验证：多少块板、什么温度/负载、运行多久；</li>\n<li>复盘：新增了什么检查项，防止再次发生。</li>\n</ol>"},{"id":"hardware-22.9","bankId":"hardware","number":"22.9","title":"如何证明设计稳定？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>我把验证分为功能、边界、长时间和异常四类。功能测试覆盖[接口和模式]；边界覆盖[最高最低输入、最大负载、温度]；连续运行[真实时间]并记录复位和错误；异常测试包含[短时断电、热插拔、通信断开、负载突变]。电源测了[纹波/温升/效率]，通信测了[错误率或距离]。没有完成的 EMC/环境项目我会明确说明，而不是说“应该没问题”。</blockquote>"},{"id":"hardware-22.10","bankId":"hardware","number":"22.10","title":"为什么改了第二版板？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>回答模板：</strong></p>\n<blockquote>第一版主要有三类问题：[功能错误]、[性能裕量]、[可制造性/调试]。功能问题通过[飞线或换料]验证；性能问题的测量证据是[波形/温升]；第二版对应修改了[具体网络或布局]。改版后用同样的测试条件对比，指标从[旧值]变为[新值]。此外增加了[测试点、防呆、丝印或保护]。</blockquote>"},{"id":"hardware-22.11","bankId":"hardware","number":"22.11","title":"如果成本要求降低 20%，怎么办？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>标准思路：</strong></p>\n<p>先按 BOM 金额和数量排序，找主成本项；区分性能过剩和不可削减的可靠性成本；考虑器件集成、封装优化、通用料、第二来源、层数与板面积、连接器和装配工序；每项降本都重新校核最坏情况并做回归测试。不能直接删 TVS、去耦或降低额定而不验证。</p>"},{"id":"hardware-22.12","bankId":"hardware","number":"22.12","title":"如果负载电流翻倍，哪些地方要重算？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p>输入接口与保险丝、反接 MOS、DCDC/LDO 额定和效率、电感饱和/温升、二极管或同步 MOS、输出电容纹波电流、PCB 线宽和过孔、连接器温升、整体散热以及电池压降。软件限流和保护阈值也可能需要调整。</p>"},{"id":"hardware-22.13","bankId":"hardware","number":"22.13","title":"如果工作温度提高到 85°C，哪些地方有风险？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p>芯片结温与降额、电解电容寿命、MOS 的 Rds(on)、LDO/DCDC 限流、晶振频偏、参考电压漂移、传感器误差、电池能力、连接器和塑料材料。应使用最坏参数而非 25°C 典型值，并在温箱中验证启动和满载。</p>"},{"id":"hardware-22.14","bankId":"hardware","number":"22.14","title":"项目没有做 EMC 测试，怎么回答？","stars":4,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p><strong>诚实回答：</strong></p>\n<blockquote>这个项目当时没有送第三方实验室做正式 EMC，所以我不能声称通过标准。设计阶段做了[入口 TVS、回流、滤波、接口布局等]，并做过[静电枪/近场扫描/简单预兼容测试，若真实存在]。如果产品化，我会先明确适用标准和等级，做预扫描，再针对频点和耦合路径整改。</blockquote>"},{"id":"hardware-22.15","bankId":"hardware","number":"22.15","title":"项目数据记不清怎么办？","stars":5,"section":"22. 项目深挖题完整作答模板","answerHtml":"<p>面试前重新整理 BOM、原理图、测试记录和照片，把输入范围、各路电压电流、纹波、温升、板层、接口速率、关键阻值等写成一页项目数据表。不确定时说“我记得大约是……，准确值需要查记录”，不要编造精确数字。</p>\n<p>---</p>"},{"id":"hardware-23.1","bankId":"hardware","number":"23.1","title":"画 MCU 最小系统","stars":5,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>画完必须逐项自查：</p>\n<ol>\n<li>是否画出所有 VDD/VSS，而不是只画一组；</li>\n<li>每组去耦是否靠近引脚，电源域是否有储能；</li>\n<li>VDDA/VREF 等模拟引脚是否按手册处理；</li>\n<li>NRST 是否有确定状态并可连接下载器；</li>\n<li>晶体、负载电容与时钟源选择是否正确；</li>\n<li>BOOT/模式脚是否有默认上下拉；</li>\n<li>SWDIO、SWCLK、GND、VTref、可选 NRST 是否齐全；</li>\n<li>特殊内部稳压电容是否遗漏；</li>\n<li>是否预留电源、复位、时钟和串口测试点；</li>\n<li>未使用引脚是否有处理原则。</li>\n</ol>"},{"id":"hardware-23.2","bankId":"hardware","number":"23.2","title":"画 N-MOS 低边驱动继电器","stars":5,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>完整电路应包括：GPIO—栅极串阻—MOS 栅极；栅极到地的下拉；继电器线圈接电源，另一端接 MOS 漏极；MOS 源极接地；线圈两端并联方向正确的续流器件；电源去耦。回答时说明：</p>\n<ul>\n<li>MOS 在实际 Vgs 下的 Rds(on)；</li>\n<li>继电器吸合电流和启动容差；</li>\n<li>二极管反向耐压、正向电流和释放时间；</li>\n<li>GPIO 上电时 MOS 默认关闭；</li>\n<li>MCU 地与负载地的电流路径；</li>\n<li>若需要隔离，不能只加光耦而忽略隔离电源和地。</li>\n</ul>"},{"id":"hardware-23.3","bankId":"hardware","number":"23.3","title":"画比较器迟滞电路","stars":4,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>先确定输入接正端还是负端、输出极性和是否开漏；正反馈电阻形成上下两个阈值；开漏输出需要上拉。推导阈值时分别代入输出高、低状态，不要只给一个阈值。最后检查输入范围、输出上拉电压和切换速度。</p>"},{"id":"hardware-23.4","bankId":"hardware","number":"23.4","title":"画 0～10 V 到 ADC 输入","stars":5,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>从接口到 ADC 依次说明：浪涌/ESD 防护、串联限流、分压、RC、可选缓冲、钳位和 ADC。设计检查：</p>\n<ul>\n<li>最高正常输入和误接电压；</li>\n<li>分压后最大值低于 ADC 安全范围；</li>\n<li>电阻功率和耐压；</li>\n<li>ADC 源阻抗及采样时间；</li>\n<li>TVS/钳位漏电带来的精度误差；</li>\n<li>输入断线时默认状态；</li>\n<li>模拟地和参考电压；</li>\n<li>软件校准和容差预算。</li>\n</ul>"},{"id":"hardware-23.5","bankId":"hardware","number":"23.5","title":"画 RS-485 接口","stars":4,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>包括收发器、A/B、方向控制、连接器、总线端可选 120Ω、偏置、TVS、可选共模电感和隔离。说明终端只应放在总线物理两端；偏置不能在所有节点无限叠加；支线要短；TVS 泄放回路靠近入口；隔离版还需要隔离电源。</p>"},{"id":"hardware-23.6","bankId":"hardware","number":"23.6","title":"画输入电源保护","stars":5,"section":"23. 现场画图题完整检查清单","answerHtml":"<p>按照具体威胁选择保险丝/PTC、反接保护、TVS、EMI 滤波、过压/欠压和浪涌限制。要解释器件顺序：例如 TVS 发生短路失效时，上游保险丝应能切断；滤波电感与电容的额定和浪涌能力要满足；保护地/机壳地的路径应清晰。</p>\n<p>---</p>"},{"id":"hardware-24.1","bankId":"hardware","number":"24.1","title":"去耦电容连续追问","stars":5,"section":"24. 面试官连续追问模拟","answerHtml":"<p><strong>问：为什么加去耦？</strong> 答：为芯片瞬态电流提供就近低阻抗回路，并降低电源引脚高频噪声。</p>\n<p><strong>问：为什么要靠近？原理图上不是并联吗？</strong> 答：高频下走线和过孔有寄生电感，距离远会使回路阻抗变大，电容不能及时供给瞬态电流。</p>\n<p><strong>问：电容越大越好吗？</strong> 答：不是。大电容负责较低频，但自身 ESR/ESL、自谐振、启动浪涌和稳压器稳定性都要考虑；应按频段和手册组合。</p>\n<p><strong>问：100 nF 和 1 μF 并联一定更好吗？</strong> 答：不一定。不同电容及布局寄生可能形成反谐振峰，复杂高速设计应看阻抗曲线或仿真；普通 MCU 板至少按芯片参考设计并实测。</p>"},{"id":"hardware-24.2","bankId":"hardware","number":"24.2","title":"MOSFET 连续追问","stars":5,"section":"24. 面试官连续追问模拟","answerHtml":"<p><strong>问：3.3 V 能否驱动一个阈值 2 V 的 MOS？</strong> 答：仅凭阈值不能判断，要看 2.5 V 或 3.3 V 栅压下保证的 Rds(on) 和目标电流。</p>\n<p><strong>问：为什么栅极要串电阻？</strong> 答：限制栅极充放电峰值、抑制振铃并调节边沿速度，在开关损耗和 EMI 间权衡。</p>\n<p><strong>问：电阻越大 EMI 越好吗？</strong> 答：边沿变慢可能降低部分高频发射，但开关损耗和直通风险增加，不能无限增大，要实测 Vgs/Vds 和温升。</p>\n<p><strong>问：栅极下拉为什么需要？</strong> 答：保证 MCU 复位、高阻或掉电时 MOS 关闭，并为栅电荷提供泄放路径。</p>"},{"id":"hardware-24.3","bankId":"hardware","number":"24.3","title":"PCB 地连续追问","stars":5,"section":"24. 面试官连续追问模拟","answerHtml":"<p><strong>问：为什么铺地？</strong> 答：提供低阻抗回流、减小环路、改善电源与信号完整性，并有助于散热和屏蔽。</p>\n<p><strong>问：地越多越好吗？</strong> 答：要保证地铜真正连续并通过足够过孔连接；孤岛铜、狭窄颈部和被走线割裂的地可能没有作用甚至产生问题。</p>\n<p><strong>问：模拟地、数字地怎么接？</strong> 答：优先按功能分区和回流管理，不机械切割。若芯片手册要求分区，应在明确位置低阻连接，且避免信号跨越地缝。</p>"},{"id":"hardware-24.4","bankId":"hardware","number":"24.4","title":"示波器连续追问","stars":5,"section":"24. 面试官连续追问模拟","answerHtml":"<p><strong>问：测到电源有 500 mV 尖峰，怎么办？</strong> 答：先改用短地弹簧、靠近输出电容测，并设置正确带宽，排除探头环路拾噪。</p>\n<p><strong>问：短地后仍然有尖峰呢？</strong> 答：同步测 SW、输入电容和输出，判断是否开关边沿振铃；核对布局、高频回路和器件寄生，必要时评估 snubber 或调整栅极速度。</p>\n<p><strong>问：可以只开 20 MHz 限带让波形好看吗？</strong> 答：限带适用于按规范比较低频纹波，但排查真实高频尖峰时也应保留全带宽记录，两种结果都要说明，不能用限带隐藏问题。</p>"},{"id":"hardware-24.5","bankId":"hardware","number":"24.5","title":"EMC 连续追问","stars":5,"section":"24. 面试官连续追问模拟","answerHtml":"<p><strong>问：加磁珠能解决 EMC 吗？</strong> 答：不一定。先确定噪声频率、模式和耦合路径。磁珠在对应频率和直流偏置下要有合适阻抗，且与电容可能产生谐振。</p>\n<p><strong>问：辐射超标最先看哪里？</strong> 答：看超标频点与时钟/开关频率的关系，再检查大电流回路、时钟、连接器和线缆共模电流，用近场探头定位。</p>\n<p><strong>问：屏蔽罩是不是最终万能方案？</strong> 答：不是。缝隙、开孔、接地阻抗和穿出线缆都会影响效果，通常应先降低源和切断耦合路径，再根据需要加屏蔽。</p>\n<p>---</p>"},{"id":"hardware-25.1","bankId":"hardware","number":"25.1","title":"你的优点和缺点是什么？","stars":4,"section":"25. HR 与综合素质问题","answerHtml":"<p>优点用真实行为证明，例如“调试时习惯先记录现象和波形，能避免无方向换料”；缺点选择可改善且不致命的内容，并说明正在采取的措施。不要回答“过于追求完美”这类空话。</p>"},{"id":"hardware-25.2","bankId":"hardware","number":"25.2","title":"与软件工程师意见不一致怎么办？","stars":4,"section":"25. HR 与综合素质问题","answerHtml":"<p>先统一接口指标和可复现实验，用寄存器配置、逻辑分析仪和示波器波形建立共同事实；分层确定问题在物理层、驱动层还是协议层；必要时设计最小 A/B 测试。目标是解决问题，不是证明某一方正确。</p>"},{"id":"hardware-25.3","bankId":"hardware","number":"25.3","title":"遇到不会的问题怎么回答？","stars":5,"section":"25. HR 与综合素质问题","answerHtml":"<p>可以说“这个具体参数我不确定，但我会这样分析”，然后给出已知原理、需要查的数据手册章节和验证方法。不要凭空给数值，也不要只说“不知道”后停止。</p>"},{"id":"hardware-25.4","bankId":"hardware","number":"25.4","title":"为什么选择我们公司？","stars":4,"section":"25. HR 与综合素质问题","answerHtml":"<p>结合真实业务、产品和岗位描述，说明你的项目技能如何匹配，以及希望补足的方向。面试前至少了解公司主要产品、客户场景和岗位要求。</p>"},{"id":"hardware-25.5","bankId":"hardware","number":"25.5","title":"能否接受加班、出差或产线支持？","stars":3,"section":"25. HR 与综合素质问题","answerHtml":"<p>按照个人真实边界回答。可以说明硬件打样、试产和故障节点存在阶段性加班或现场支持，但希望安排有计划、问题有复盘。不要承诺自己无法长期做到的条件。</p>\n<p>---</p>"}]}];
    const allQuestions = BANKS.flatMap(bank => bank.questions);
    const state = { bank:'software', section:'all', stars:0, status:'all', search:'', index:0, revealed:false };
    const ratings = JSON.parse(localStorage.getItem('embedded-interview-ratings-v1') || '{}');
    const $ = id => document.getElementById(id);
    const elements = { tabs:$('bankTabs'), section:$('sectionSelect'), stars:$('starSelect'), status:$('statusSelect'), search:$('searchInput'), summary:$('filterSummary'), tag:$('sectionTag'), bank:$('bankName'), starText:$('stars'), question:$('question'), reveal:$('revealButton'), answer:$('answer'), rating:$('rating'), previous:$('previousButton'), next:$('nextButton'), random:$('randomButton'), position:$('position'), progressText:$('progressText'), progressFill:$('progressFill'), card:$('card'), quiz:$('quiz'), empty:$('empty') };

    function activeBank() { return BANKS.find(bank => bank.id === state.bank); }
    function filtered() {
      const term = state.search.trim().toLowerCase();
      return activeBank().questions.filter(q =>
        (state.section === 'all' || q.section === state.section) &&
        (!state.stars || q.stars === state.stars) &&
        (state.status === 'all' || (state.status === 'unrated' ? !ratings[q.id] : ratings[q.id] === state.status)) &&
        (!term || (q.title + ' ' + q.section + ' ' + q.answerHtml.replace(/<[^>]*>/g,' ')).toLowerCase().includes(term))
      );
    }
    function populateSections() {
      const sections = [...new Set(activeBank().questions.map(q => q.section))];
      elements.section.innerHTML = '<option value="all">全部章节</option>' + sections.map(s => '<option value="' + s.replaceAll('"','&quot;') + '">' + s + '</option>').join('');
      elements.section.value = state.section;
    }
    function renderTabs() {
      elements.tabs.innerHTML = BANKS.map(bank => '<button class="bank-tab ' + (bank.id === state.bank ? 'active' : '') + '" style="--accent:' + bank.accent + '" data-bank="' + bank.id + '">' + bank.name + '<br><small>' + bank.questions.length + ' 道题</small></button>').join('');
    }
    function updateProgress() {
      const known = allQuestions.filter(q => ratings[q.id] === 'know').length;
      elements.progressText.textContent = known + ' / ' + allQuestions.length;
      elements.progressFill.style.width = (known / allQuestions.length * 100) + '%';
    }
    function render() {
      renderTabs(); updateProgress();
      const list = filtered();
      if (state.index >= list.length) state.index = Math.max(0,list.length - 1);
      elements.summary.textContent = '当前筛选：' + list.length + ' 道题；本题库共 ' + activeBank().questions.length + ' 道。';
      if (!list.length) {
        elements.quiz.hidden = true;
        elements.empty.hidden = false;
        return;
      }
      elements.quiz.hidden = false;
      elements.empty.hidden = true;
      const q = list[state.index];
      elements.tag.textContent = q.section;
      elements.bank.textContent = activeBank().name + ' · ' + q.number;
      elements.starText.textContent = '★'.repeat(q.stars);
      elements.question.textContent = q.title;
      elements.answer.innerHTML = q.answerHtml;
      elements.answer.classList.toggle('open',state.revealed);
      elements.rating.classList.toggle('open',state.revealed);
      elements.reveal.innerHTML = state.revealed ? '收起答案 <span class="kbd">空格</span>' : '查看答案 <span class="kbd">空格</span>';
      elements.previous.disabled = state.index === 0;
      elements.next.disabled = state.index === list.length - 1;
      elements.position.textContent = (state.index + 1) + ' / ' + list.length;
      document.querySelectorAll('.rate').forEach(btn => btn.classList.toggle('selected',ratings[q.id] === btn.dataset.value));
    }
    function resetQuestion() { state.index = 0; state.revealed = false; render(); }
    function move(delta) { const list = filtered(); state.index = Math.max(0,Math.min(list.length - 1,state.index + delta)); state.revealed = false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    elements.tabs.addEventListener('click', event => { const btn=event.target.closest('[data-bank]'); if(!btn)return; state.bank=btn.dataset.bank; state.section='all'; populateSections(); resetQuestion(); });
    elements.section.addEventListener('change',e=>{state.section=e.target.value;resetQuestion()});
    elements.stars.addEventListener('change',e=>{state.stars=Number(e.target.value);resetQuestion()});
    elements.status.addEventListener('change',e=>{state.status=e.target.value;resetQuestion()});
    elements.search.addEventListener('input',e=>{state.search=e.target.value;resetQuestion()});
    elements.reveal.addEventListener('click',()=>{state.revealed=!state.revealed;render()});
    elements.previous.addEventListener('click',()=>move(-1));
    elements.next.addEventListener('click',()=>move(1));
    elements.random.addEventListener('click',()=>{const list=filtered();if(list.length){state.index=Math.floor(Math.random()*list.length);state.revealed=false;render()}});
    elements.rating.addEventListener('click',event=>{const btn=event.target.closest('[data-value]');if(!btn)return;const q=filtered()[state.index];ratings[q.id]=btn.dataset.value;localStorage.setItem('embedded-interview-ratings-v1',JSON.stringify(ratings));render()});
    document.addEventListener('keydown',event=>{if(event.target.matches('input,select'))return;if(event.code==='Space'){event.preventDefault();state.revealed=!state.revealed;render()}if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});
    populateSections(); render();
  </script>
</body>
</html>
