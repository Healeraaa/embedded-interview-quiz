dware-8.10","bankId":"hardware","number":"8.10","title":"过孔有什么寄生影响？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>过孔带来寄生电感、电容和阻抗不连续；高速差分换层时需就近放地回流过孔。高电流过孔要并联多个并核算孔铜能力。</p>"},{"id":"hardware-8.11","bankId":"hardware","number":"8.11","title":"直角走线一定不能用吗？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>在多数普通数字板中，直角并非决定性问题；45°或圆弧更利于工艺、一致性和高频阻抗控制。真正应优先关注回流、参考面、串扰和阻抗不连续。</p>"},{"id":"hardware-8.12","bankId":"hardware","number":"8.12","title":"晶振布局有哪些要求？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>晶体和负载电容靠近芯片，走线短、对称，回路小，远离高速/开关节点；下方参考按芯片建议处理，避免其他信号穿越；外壳接地方式按参考设计。</p>"},{"id":"hardware-8.13","bankId":"hardware","number":"8.13","title":"开关电源 PCB 布局优先级是什么？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>先放功率器件和高频输入电容，最小化热回路；再处理 SW、电感、输出电容和反馈；反馈从干净点采样、远离 SW；最后铺铜和热设计。优先照芯片数据手册推荐布局。</p>"},{"id":"hardware-8.14","bankId":"hardware","number":"8.14","title":"敏感模拟信号如何布线？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>远离时钟、SW、马达和大电流；保持参考连续和回路小；必要时差分、屏蔽/护环、RC 滤波；避免与噪声线长距离平行；传感器回流不要与功率回流共用狭窄路径。</p>"},{"id":"hardware-8.15","bankId":"hardware","number":"8.15","title":"连接器附近为什么放 ESD 器件？","stars":5,"section":"8. PCB 布局布线","answerHtml":"<p>让瞬态电流在进入板内前就被钳位并通过短而低阻抗路径泄放。保护器件越远，冲击电流越可能沿长线耦合到内部电路。</p>"},{"id":"hardware-8.16","bankId":"hardware","number":"8.16","title":"什么是爬电距离和电气间隙？","stars":3,"section":"8. PCB 布局布线","answerHtml":"<p>电气间隙是空气中的最短距离，爬电距离是沿绝缘表面的最短路径。要求取决于工作电压、污染等级、材料组和安规标准，高压设计必须按适用标准计算。</p>"},{"id":"hardware-8.17","bankId":"hardware","number":"8.17","title":"PCB 热设计有哪些方法？","stars":4,"section":"8. PCB 布局布线","answerHtml":"<p>增大铜面积、热过孔、合理层叠、散热片和气流；把热源与敏感器件分开；依据功耗和热阻估算后用热像仪/热电偶验证。不能只凭“摸起来不热”。</p>\n<p>---</p>"},{"id":"hardware-9.1","bankId":"hardware","number":"9.1","title":"什么是反射？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>信号遇到阻抗不连续时部分能量被反射，造成过冲、下冲、振铃或多次跨越阈值。通过控制阻抗、连续参考和适当端接改善。</p>"},{"id":"hardware-9.2","bankId":"hardware","number":"9.2","title":"串联端接和并联端接如何选择？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>源端串联端接功耗低，适合点对点单向连接；接收端并联端接匹配效果直接但有直流功耗。实际还可使用戴维南、AC 端接等，依据拓扑和接口规范选择。</p>"},{"id":"hardware-9.3","bankId":"hardware","number":"9.3","title":"什么是串扰？如何降低？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>相邻走线通过电容和电感耦合。降低方法：增大间距、缩短平行长度、保持参考平面、调整层间距离、降低不必要边沿速度、敏感线与噪声线分层或正交。</p>"},{"id":"hardware-9.4","bankId":"hardware","number":"9.4","title":"为什么信号频率不高也可能有 SI 问题？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>决定传输线效应的是上升/下降时间，而不仅是重复频率。低频方波若边沿很快，仍包含丰富高频分量并产生反射与串扰。</p>"},{"id":"hardware-9.5","bankId":"hardware","number":"9.5","title":"EMI、EMS、EMC 分别是什么？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>EMI 是电磁干扰/发射，EMS 是抗扰度，EMC 是设备在环境中既不过度干扰别人、也能承受规定干扰而正常工作的能力。</p>"},{"id":"hardware-9.6","bankId":"hardware","number":"9.6","title":"传导发射和辐射发射区别？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>传导发射通过电源线、信号线传播；辐射发射通过空间耦合。两者可互相转化，线缆常成为共模天线。</p>"},{"id":"hardware-9.7","bankId":"hardware","number":"9.7","title":"共模干扰和差模干扰区别？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>差模电流在一对导体间反向流动；共模电流相对参考地同向流动，并通过寄生路径返回。共模电流虽小也可能因大环路/线缆产生强辐射。</p>"},{"id":"hardware-9.8","bankId":"hardware","number":"9.8","title":"共模电感与差模电感有什么区别？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>共模电感对同向共模电流呈高阻，而对正常差模电流磁通多相互抵消；差模电感直接抑制线路中的差模变化。选型要看工作电流、阻抗曲线、漏感和饱和。</p>"},{"id":"hardware-9.9","bankId":"hardware","number":"9.9","title":"ESD、EFT、Surge 有什么区别？","stars":4,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>ESD 上升快、能量相对较小，模拟人体/物体静电；EFT 是快速脉冲群；Surge 上升较慢但能量更大，模拟雷击/开关浪涌。不同测试需不同防护和布局策略。</p>"},{"id":"hardware-9.10","bankId":"hardware","number":"9.10","title":"TVS 如何选型？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>工作电压高于正常最大电压；击穿与钳位电压低于被保护器件承受能力；峰值功率满足测试；结电容适合信号速率；单向/双向和封装合适。还需核对在实际脉冲电流下的钳位电压。</p>"},{"id":"hardware-9.11","bankId":"hardware","number":"9.11","title":"为什么 ESD 保护布局比器件参数还重要？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>ESD 电流边沿极快，走线和过孔寄生电感会产生很高压降。TVS 要靠近入口，泄放路径短、宽、少过孔，避免保护后的线与未保护线再次耦合。</p>"},{"id":"hardware-9.12","bankId":"hardware","number":"9.12","title":"滤波器为什么有时反而变差？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>器件寄生、布局、源负载阻抗和谐振可能让某频段放大；滤波器必须与实际阻抗和频谱匹配，并通过测量验证，而不是盲目堆磁珠和电容。</p>"},{"id":"hardware-9.13","bankId":"hardware","number":"9.13","title":"如何降低开关电源 EMI？","stars":5,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>缩小热回路和 SW 面积、优化栅极速度、选择合适频率/扩频器件、输入输出滤波、屏蔽电感、RC snubber、良好接地与回流；先用近场探头和示波器定位主频及振铃源。</p>"},{"id":"hardware-9.14","bankId":"hardware","number":"9.14","title":"什么是地弹和电源弹跳？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>多个输出同时快速切换时，封装和回路电感上的 <code>L·di/dt</code> 产生瞬态电压，使局部地或电源参考偏移。通过去耦、完整平面、减小回路和控制边沿降低。</p>"},{"id":"hardware-9.15","bankId":"hardware","number":"9.15","title":"屏蔽层应该单端接地还是双端接地？","stars":3,"section":"9. 信号完整性、电源完整性与 EMC","answerHtml":"<p>没有一刀切答案。低频时单端可减少地环路，高频时双端/多点低阻连接通常屏蔽更有效；应结合频率、系统接地、共模电流和安规设计。</p>\n<p>---</p>"},{"id":"hardware-10.1","bankId":"hardware","number":"10.1","title":"万用表能测什么？有哪些限制？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>电压、电流、电阻、通断、二极管等；但带宽低，无法观察瞬态、纹波和高速波形。测电流必须串联并注意表内保险丝和档位，不能把电流档直接并到电源上。</p>"},{"id":"hardware-10.2","bankId":"hardware","number":"10.2","title":"示波器带宽和采样率如何选择？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>为了保留边沿，带宽通常需明显高于目标最高有效频率；采样率需满足波形重建和存储时间。探头带宽、输入电容、接地方式与示波器同样重要。</p>"},{"id":"hardware-10.3","bankId":"hardware","number":"10.3","title":"10× 探头为什么常用？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>相比 1× 探头输入电容更小、带宽更高、对电路扰动更小，但信号衰减十倍。使用前应补偿校准，并确认示波器通道衰减设置一致。</p>"},{"id":"hardware-10.4","bankId":"hardware","number":"10.4","title":"为什么不能用长地线测高速波形？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>长地线形成较大环路和寄生电感，会拾取噪声并产生虚假振铃。使用地弹簧、短接地或同轴连接。</p>"},{"id":"hardware-10.5","bankId":"hardware","number":"10.5","title":"示波器地夹为什么可能造成短路？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>台式示波器通道地通常与保护地相连，把地夹接到非地高电位节点会短路。测市电、高边或浮地节点应采用合规差分探头/隔离方案，不能随意剪地线。</p>"},{"id":"hardware-10.6","bankId":"hardware","number":"10.6","title":"逻辑分析仪与示波器如何选择？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>逻辑分析仪适合多通道数字时序和协议解码，但看不到模拟电平质量；示波器可看过冲、噪声、边沿和时序，但通道少。复杂问题常结合使用。</p>"},{"id":"hardware-10.7","bankId":"hardware","number":"10.7","title":"电子负载有什么用途？","stars":3,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>可在恒流、恒阻、恒功率等模式下测试电源稳态和动态负载、过流保护及效率。设置瞬态时要考虑连线电感和远端采样。</p>"},{"id":"hardware-10.8","bankId":"hardware","number":"10.8","title":"新板第一次上电怎么做？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>目检与阻值检查 → 确认极性/焊接/短路 → 限流电源设置低电流 → 分电源域逐步上电 → 观察输入电流和温升 → 测各路电压、复位、时钟 → 再连接下载器与外设。不要一上来直接满压不限流。</p>"},{"id":"hardware-10.9","bankId":"hardware","number":"10.9","title":"板子电源短路如何定位？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>断电测阻并区分电容充电；分割 0Ω/磁珠/电感隔离电源域；低压限流注入，使用热像仪、酒精挥发或测压降找热点；注入电压必须低于该电源域安全值。</p>"},{"id":"hardware-10.10","bankId":"hardware","number":"10.10","title":"MCU 下载不了如何排查？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>检查供电、地、复位、SWD/JTAG 接线和电平、启动模式、时钟、下载器速度、引脚是否被外部电路占用；尝试复位下连接；最后考虑读保护、芯片焊接或损坏。</p>"},{"id":"hardware-10.11","bankId":"hardware","number":"10.11","title":"板子功耗异常如何排查？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>对比各电源域电流；检查反向灌电、GPIO 对打、未用输入悬空、器件未休眠、LDO 损耗、开关电源轻载模式和焊接短路；逐域断开并测温定位。</p>"},{"id":"hardware-10.12","bankId":"hardware","number":"10.12","title":"焊接 QFN/QFP 常见问题有哪些？","stars":4,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>连锡、虚焊、少锡、偏移、底部焊盘空洞或浮起。用显微镜、通断、电源限流、热风/烙铁返修；QFN 隐藏焊点可能需要 X-ray 或通过电气行为判断。</p>"},{"id":"hardware-10.13","bankId":"hardware","number":"10.13","title":"飞线修改时注意什么？","stars":3,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>线尽量短并固定，避免跨越敏感/高速区域；电源飞线按电流选择线径；差分/高速线飞线可能严重改变阻抗；修改要更新 ECO 和原理图记录。</p>"},{"id":"hardware-10.14","bankId":"hardware","number":"10.14","title":"如何判断问题来自硬件还是软件？","stars":5,"section":"10. 测量仪器、焊接与板级调试","answerHtml":"<p>先建立可观测边界：测电源、复位、时钟、总线物理波形和 MCU 引脚电平；用最小测试固件或已知良好外设替换；逐层隔离。不要仅凭“换代码后好了”就认定是软件问题。</p>\n<p>---</p>"},{"id":"hardware-11.1","bankId":"hardware","number":"11.1","title":"器件选型的完整维度有哪些？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>电气性能、最坏条件、封装与散热、环境温度、寿命与可靠性、供货周期、第二来源、成本、认证、可制造性、软件生态和厂商支持。</p>"},{"id":"hardware-11.2","bankId":"hardware","number":"11.2","title":"为什么不能只看绝对最大额定值设计？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>绝对最大值是不可长期接近的损坏边界，不是推荐工作条件。应按推荐范围设计，并考虑瞬态、温度、容差、老化与降额。</p>"},{"id":"hardware-11.3","bankId":"hardware","number":"11.3","title":"什么是降额设计？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>器件实际承受的电压、电流、功率和温度低于其额定极限，以提高可靠性并覆盖波动。不同器件和行业有不同降额规则。</p>"},{"id":"hardware-11.4","bankId":"hardware","number":"11.4","title":"数据手册最应该看哪些章节？","stars":5,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>推荐工作条件、绝对最大值、引脚定义、典型应用、时序、电气特性、封装与热、布局指南、勘误和应用笔记。典型值不能替代最小/最大保证值。</p>"},{"id":"hardware-11.5","bankId":"hardware","number":"11.5","title":"为什么要做最坏情况分析？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>器件容差、输入、电源、温度和老化同时变化时，典型设计可能失效。通过极限组合、蒙特卡洛或容差分析验证阈值、增益、功耗和时序仍满足要求。</p>"},{"id":"hardware-11.6","bankId":"hardware","number":"11.6","title":"如何做替代料评估？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>逐项比对引脚、封装、电气规格、时序、控制逻辑、热性能、寿命与认证；不能只看“功能相同”。替换后需做样机和关键测试回归。</p>"},{"id":"hardware-11.7","bankId":"hardware","number":"11.7","title":"BOM 成本优化的正确方式是什么？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>先满足性能和可靠性，再通过功能整合、规格合理化、通用料、减少独家料、优化封装和供应链降低成本。不能删除保护/去耦而不做验证。</p>"},{"id":"hardware-11.8","bankId":"hardware","number":"11.8","title":"什么是 DFM、DFA、DFT？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>DFM 面向制造，DFA 面向装配，DFT 面向测试。包括封装与间距、拼板、工艺边、器件方向、测试点、ICT/功能测试覆盖等。</p>"},{"id":"hardware-11.9","bankId":"hardware","number":"11.9","title":"可靠性测试常见有哪些？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>高低温、温循、湿热、振动、跌落、老化、插拔、ESD/EFT/浪涌、长时间满载等。选择依据产品环境和标准，并设置清晰通过判据。</p>"},{"id":"hardware-11.10","bankId":"hardware","number":"11.10","title":"连接器选型看什么？","stars":4,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>电压电流、接触电阻、针数、间距、插拔寿命、防呆、锁紧、防水、温度、振动、线束工艺和供应稳定性。电流能力需考虑针脚数量和温升降额。</p>"},{"id":"hardware-11.11","bankId":"hardware","number":"11.11","title":"保险丝与 PTC 如何选择？","stars":3,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>普通保险丝一次性熔断，PTC 可自恢复但动作与冷却特性不同。依据正常电流、浪涌、动作时间、环境温度、电压和最大故障电流选择。</p>"},{"id":"hardware-11.12","bankId":"hardware","number":"11.12","title":"FMEA 是什么？","stars":2,"section":"11. 器件选型、BOM 与可靠性","answerHtml":"<p>系统识别可能的失效模式、原因、后果和现有控制，评估风险并制定改进。硬件可分析短路、开路、参数漂移、器件失效和接口误接等。</p>\n<p>---</p>"},{"id":"hardware-12.1","bankId":"hardware","number":"12.1","title":"分压器输出电压怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>空载时 <code>Vout = Vin × Rbottom/(Rtop+Rbottom)</code>。接入负载后，底部电阻需与负载并联重算。ADC 分压还要考虑输入漏电、采样电容和保护电压。</p>"},{"id":"hardware-12.2","bankId":"hardware","number":"12.2","title":"RC 截止频率怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>一阶网络 <code>fc=1/(2πRC)</code>。面试中还要说明截止点约 -3 dB、相位变化和源负载阻抗可能改变实际值。</p>"},{"id":"hardware-12.3","bankId":"hardware","number":"12.3","title":"LED 限流电阻怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p><code>R=(Vs−Vf)/I</code>，再计算 <code>P=I²R</code> 并留余量，使用最坏电源和最低/最高 Vf 验证电流范围。</p>"},{"id":"hardware-12.4","bankId":"hardware","number":"12.4","title":"NTC 温度采样如何计算？","stars":3,"section":"12. 高频计算题","answerHtml":"<p>先由分压计算 NTC 电阻，再用 B 参数公式或查表换算温度；考虑 NTC 误差、参考电阻精度、ADC 参考和自热。</p>"},{"id":"hardware-12.5","bankId":"hardware","number":"12.5","title":"ADC 分辨率和量化电压怎么算？","stars":4,"section":"12. 高频计算题","answerHtml":"<p>N 位理想 ADC 有 <code>2^N</code> 个码，常用 LSB 近似 <code>Vref/2^N</code>。实际有效位数还受噪声、INL/DNL、参考和前端误差影响。</p>"},{"id":"hardware-12.6","bankId":"hardware","number":"12.6","title":"LDO 功耗与结温怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p><code>P≈(Vin−Vout)Iout</code>，<code>Tj≈Ta+PθJA</code>。实际 PCB 铜面积会改变热阻，最终需实测温升验证。</p>"},{"id":"hardware-12.7","bankId":"hardware","number":"12.7","title":"运放闭环增益怎么算？","stars":5,"section":"12. 高频计算题","answerHtml":"<p>反相 <code>-Rf/Rin</code>，同相 <code>1+Rf/Rg</code>；进一步检查目标频率下开环增益是否足够、输出摆幅和压摆率是否满足。</p>"},{"id":"hardware-12.8","bankId":"hardware","number":"12.8","title":"MOSFET 导通功耗怎么算？","stars":4,"section":"12. 高频计算题","answerHtml":"<p><code>Pcond=Irms²×Rds(on)</code>，其中 Rds(on) 要用实际栅压和高温值，而不是只用 25°C 典型值。</p>"},{"id":"hardware-12.9","bankId":"hardware","number":"12.9","title":"PCB 走线压降如何估算？","stars":3,"section":"12. 高频计算题","answerHtml":"<p>先由铜电阻率、长度和截面积估算走线电阻，再用 <code>Vdrop=IR</code>。同时检查温升、过孔和连接器电阻。</p>"},{"id":"hardware-12.10","bankId":"hardware","number":"12.10","title":"电池续航如何粗估？","stars":4,"section":"12. 高频计算题","answerHtml":"<p>不能只用容量除平均电流。应按工作状态占空比求平均电流，并考虑电池有效容量、放电倍率、温度、转换效率、自放电和截止电压。</p>\n<p>---</p>"},{"id":"hardware-13.1","bankId":"hardware","number":"13.1","title":"新板 3.3 V 只有 1.8 V，如何排查？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>确认测量点和仪器 → 断电测负载阻值 → 看输入电压、EN、反馈和限流状态 → 限流电源观察输入电流与温升 → 隔离下游负载 → 检查稳压器外围、封装和焊接 → 用示波器判断是否启动打嗝或振荡。</p>"},{"id":"hardware-13.2","bankId":"hardware","number":"13.2","title":"MCU 偶发复位，如何排查？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>读取复位原因；同时监测 VDD、NRST、时钟和负载事件；检查电源跌落、BOR、看门狗、ESD、地弹、复位线干扰和软件异常；用示波器单次触发捕获复位前瞬态。</p>"},{"id":"hardware-13.3","bankId":"hardware","number":"13.3","title":"ADC 采样值跳动很大怎么办？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>检查参考电压、电源噪声、信号源阻抗、采样时间、接地与布局；对比短接输入/内部参考；用示波器观察原始信号；增加合理 RC、缓冲、平均或同步采样，但先定位噪声来源。</p>"},{"id":"hardware-13.4","bankId":"hardware","number":"13.4","title":"MOSFET 一带负载就烧毁，可能是什么原因？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>耐压/浪涌不足、栅压不够导致线性区、开关慢、无续流、SOA 不足、热设计差、直通、封装引脚错误或负载启动电流过大。捕获 Vgs、Vds、电流和温度，不只换更大额定电流器件。</p>"},{"id":"hardware-13.5","bankId":"hardware","number":"13.5","title":"I²C 偶发 NACK，硬件如何排查？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>用示波器看电平、上升时间、过冲和毛刺；检查上拉、总线电容、电平转换、供电时序、地址脚、线长和干扰；降低速率验证；确认从机是否在复位/忙状态。</p>"},{"id":"hardware-13.6","bankId":"hardware","number":"13.6","title":"SPI 高速时错误、降速正常，怎么办？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>检查时钟/数据边沿、模式、走线与回流、串联端接、探头测量和电平裕量；测 setup/hold、过冲与振铃；优化源端电阻、连续参考和布局，而不是只永久降速。</p>"},{"id":"hardware-13.7","bankId":"hardware","number":"13.7","title":"USB 插拔导致系统重启，怎么查？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>观察 VBUS、系统电源、复位和地电位；排查浪涌电流、ESD、反向灌电、连接器地先后、TVS 布局和固件 USB 状态处理；使用单次触发捕获插拔瞬态。</p>"},{"id":"hardware-13.8","bankId":"hardware","number":"13.8","title":"开关电源纹波很大，可能是什么问题？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>先确认测量方法；再检查电感/输出电容、环路稳定性、布局热回路、负载模式、二极管/同步整流、输入电源和焊接；区分开关基波、振铃尖峰和低频环路振荡。</p>"},{"id":"hardware-13.9","bankId":"hardware","number":"13.9","title":"EMC 辐射超标如何整改？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>先看超标频点与倍频关系，用近场探头定位源；识别噪声源—耦合路径—天线；分别从减小源强、切断路径、降低天线效率整改；常见措施包括缩小回路、端接、滤波、屏蔽、优化线缆共模路径，并逐项 A/B 验证。</p>"},{"id":"hardware-13.10","bankId":"hardware","number":"13.10","title":"板子高温下正常、低温下不起机，可能是什么？","stars":3,"section":"13. 高频场景排障题","answerHtml":"<p>晶振启动裕量、器件参数/ESR 随温度变化、焊点接触、复位时序、电池内阻、LDO/Buck 启动和元件容差。温箱内分阶段测电源、复位和时钟，避免只热风吹整板。</p>"},{"id":"hardware-13.11","bankId":"hardware","number":"13.11","title":"量产少量板子不工作，研发样机正常，如何处理？","stars":5,"section":"13. 高频场景排障题","answerHtml":"<p>统计故障分布与批次；对比 BOM、PCB/钢网/工艺、器件日期码；建立好坏板 A/B 测量；检查设计裕量、焊接和容差；用边界条件复现。不要把偶发归因于“器件质量”而没有证据。</p>"},{"id":"hardware-13.12","bankId":"hardware","number":"13.12","title":"用示波器看到振铃，怎样判断是真实还是测量伪影？","stars":4,"section":"13. 高频场景排障题","answerHtml":"<p>更换短地弹簧、不同探头和测量位置，调整带宽，做探头校准；若振铃随地线长度明显变化，多半包含测量环路伪影。也可用同轴或有源探头交叉验证。</p>\n<p>---</p>"},{"id":"hardware-15.1","bankId":"hardware","number":"15.1","title":"画一个 MCU 最小系统。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>至少包含：所有电源引脚与去耦、模拟电源、复位、晶振/时钟、BOOT 配置、SWD/JTAG、主电源入口和必要测试点。</p>"},{"id":"hardware-15.2","bankId":"hardware","number":"15.2","title":"画一个 N-MOS 低边驱动继电器电路。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>包括栅极串阻、栅极下拉、续流器件、负载电源和共地；进一步说明 GPIO 上电默认状态、MOS 选型和关断速度。</p>"},{"id":"hardware-15.3","bankId":"hardware","number":"15.3","title":"画一个运放同相/反相放大器并算增益。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>除公式外，还要检查供电、输入共模、输出范围、带宽、压摆率和去耦。</p>"},{"id":"hardware-15.4","bankId":"hardware","number":"15.4","title":"设计一个 12 V 转 3.3 V/100 mA 电源。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>先比较 LDO 功耗 <code>0.87 W</code> 与热条件，再决定是否用 Buck；说明输入保护、器件额定、电容、电感、反馈、布局和测试计划。</p>"},{"id":"hardware-15.5","bankId":"hardware","number":"15.5","title":"设计一个 5 V 到 3.3 V 的数字电平转换。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>先问信号方向、速率、推挽/开漏和是否双向，再选分压、MOS、缓冲器或专用转换器；不能不问条件直接给固定电路。</p>"},{"id":"hardware-15.6","bankId":"hardware","number":"15.6","title":"设计一个 0～10 V 信号接入 3.3 V ADC。","stars":5,"section":"15. 现场画图与手算题","answerHtml":"<p>分压、输入限流、钳位/保护、RC 滤波、源阻抗与采样时间、ADC 参考和容差分析；若工业接口还要考虑浪涌、误接和隔离。</p>"},{"id":"hardware-15.7","bankId":"hardware","number":"15.7","title":"设计一个按键输入。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>上拉/下拉、RC/施密特消抖、ESD（若外接）、上电默认状态和软件消抖配合。</p>"},{"id":"hardware-15.8","bankId":"hardware","number":"15.8","title":"画 RS-485/CAN 接口保护框图。","stars":4,"section":"15. 现场画图与手算题","answerHtml":"<p>收发器、终端/偏置、TVS、可选共模电感、连接器、接地/隔离。说明器件顺序和瞬态泄放路径。</p>\n<p>---</p>"}]}];
    const allQuestions = BANKS.flatMap(bank => bank.questions);
    const state = { bank:'software', section:'all', stars:0, status:'all', search:'', index:0, revealed:false };
    const ratings = JSON.parse(localStorage.getItem('embedded-interview-ratings-v1') || '{}');
    const $ = id => document.getElementById(id);
    const elements = { tabs:$('bankTabs'), section:$('sectionSelect'), stars:$('starSelect'), status:$('statusSelect'), search:$('searchInput'), summary:$('filterSummary'), tag:$('sectionTag'), bank:$('bankName'), starText:$('stars'), question:$('question'), reveal:$('revealButton'), answer:$('answer'), rating:$('rating'), previous:$('previousButton'), next:$('nextButton'), random:$('randomButton'), position:$('position'), progressText:$('progressText'), progressFill:$('progressFill'), card:$('card'), quiz:$('quiz'), empty:$('empty') };

    function activeBank() { return BANKS.find(bank => bank.id === state.bank); }
    function filtered() {
      const term = state.search.trim().toLowerCase();
      return activeBank().questions.filter(q =>
        (state.section === 'all' || q.section === state.section) &&
        (!state.stars || q.stars === state.stars) &&
        (state.status === 'all' || (state.status === 'unrated' ? !ratings[q.id] : ratings[q.id] === state.status)) &&
        (!term || (q.title + ' ' + q.section + ' ' + q.answerHtml.replace(/<[^>]*>/g,' ')).toLowerCase().includes(term))
      );
    }
    function populateSections() {
      const sections = [...new Set(activeBank().questions.map(q => q.section))];
      elements.section.innerHTML = '<option value="all">全部章节</option>' + sections.map(s => '<option value="' + s.replaceAll('"','&quot;') + '">' + s + '</option>').join('');
      elements.section.value = state.section;
    }
    function renderTabs() {
      elements.tabs.innerHTML = BANKS.map(bank => '<button class="bank-tab ' + (bank.id === state.bank ? 'active' : '') + '" style="--accent:' + bank.accent + '" data-bank="' + bank.id + '">' + bank.name + '<br><small>' + bank.questions.length + ' 道题</small></button>').join('');
    }
    function updateProgress() {
      const known = allQuestions.filter(q => ratings[q.id] === 'know').length;
      elements.progressText.textContent = known + ' / ' + allQuestions.length;
      elements.progressFill.style.width = (known / allQuestions.length * 100) + '%';
    }
    function render() {
      renderTabs(); updateProgress();
      const list = filtered();
      if (state.index >= list.length) state.index = Math.max(0,list.length - 1);
      elements.summary.textContent = '当前筛选：' + list.length + ' 道题；本题库共 ' + activeBank().questions.length + ' 道。';
      if (!list.length) {
        elements.quiz.hidden = true;
        elements.empty.hidden = false;
        return;
      }
      elements.quiz.hidden = false;
      elements.empty.hidden = true;
      const q = list[state.index];
      elements.tag.textContent = q.section;
      elements.bank.textContent = activeBank().name + ' · ' + q.number;
      elements.starText.textContent = '★'.repeat(q.stars);
      elements.question.textContent = q.title;
      elements.answer.innerHTML = q.answerHtml;
      elements.answer.classList.toggle('open',state.revealed);
      elements.rating.classList.toggle('open',state.revealed);
      elements.reveal.innerHTML = state.revealed ? '收起答案 <span class="kbd">空格</span>' : '查看答案 <span class="kbd">空格</span>';
      elements.previous.disabled = state.index === 0;
      elements.next.disabled = state.index === list.length - 1;
      elements.position.textContent = (state.index + 1) + ' / ' + list.length;
      document.querySelectorAll('.rate').forEach(btn => btn.classList.toggle('selected',ratings[q.id] === btn.dataset.value));
    }
    function resetQuestion() { state.index = 0; state.revealed = false; render(); }
    function move(delta) { const list = filtered(); state.index = Math.max(0,Math.min(list.length - 1,state.index + delta)); state.revealed = false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    elements.tabs.addEventListener('click', event => { const btn=event.target.closest('[data-bank]'); if(!btn)return; state.bank=btn.dataset.bank; state.section='all'; populateSections(); resetQuestion(); });
    elements.section.addEventListener('change',e=>{state.section=e.target.value;resetQuestion()});
    elements.stars.addEventListener('change',e=>{state.stars=Number(e.target.value);resetQuestion()});
    elements.status.addEventListener('change',e=>{state.status=e.target.value;resetQuestion()});
    elements.search.addEventListener('input',e=>{state.search=e.target.value;resetQuestion()});
    elements.reveal.addEventListener('click',()=>{state.revealed=!state.revealed;render()});
    elements.previous.addEventListener('click',()=>move(-1));
    elements.next.addEventListener('click',()=>move(1));
    elements.random.addEventListener('click',()=>{const list=filtered();if(list.length){state.index=Math.floor(Math.random()*list.length);state.revealed=false;render()}});
    elements.rating.addEventListener('click',event=>{const btn=event.target.closest('[data-value]');if(!btn)return;const q=filtered()[state.index];ratings[q.id]=btn.dataset.value;localStorage.setItem('embedded-interview-ratings-v1',JSON.stringify(ratings));render()});
    document.addEventListener('keydown',event=>{if(event.target.matches('input,select'))return;if(event.code==='Space'){event.preventDefault();state.revealed=!state.revealed;render()}if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});
    populateSections(); render();
  </script>
</body>
</html>
